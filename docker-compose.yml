services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "1"
    container_name: awp-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./workflows:/code/workflows
      - ./tests:/code/tests
      - ./samples:/code/samples
      - ./scripts:/code/scripts
    networks:
      - awp

  mongo:
    image: mongo:7
    container_name: awp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - awp

  redis:
    image: redis:7-alpine
    container_name: awp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - awp

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    container_name: awp-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - awp

  minio:
    image: minio/minio:latest
    container_name: awp-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - awp

  prometheus:
    image: prom/prometheus:latest
    container_name: awp-prometheus
    ports:
      - "9090:9090"
    networks:
      - awp
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: awp-grafana
    ports:
      - "3000:3000"
    networks:
      - awp
    profiles:
      - observability

volumes:
  mongo_data:
  weaviate_data:
  minio_data:

networks:
  awp:
    driver: bridge