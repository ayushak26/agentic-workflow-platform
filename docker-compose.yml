services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongo
      - weaviate
      - minio
      - redis
    volumes:
      - ./app:/app/app
      - ./workflows:/app/workflows
    networks:
      - eurskem-net

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: eurskem
      MONGO_INITDB_ROOT_PASSWORD: eurschempass
    volumes:
      - mongo-data:/data/db
    networks:
      - eurskem-net

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks:
      - eurskem-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: eurskemadmin
      MINIO_ROOT_PASSWORD: eurskempassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - eurskem-net

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - eurskem-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - eurskem-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    networks:
      - eurskem-net

volumes:
  mongo-data:
  weaviate-data:
  minio-data:

networks:
  eurskem-net:
    driver: bridge