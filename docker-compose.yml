services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-32-bytes-only}
      MONGO_URI: ${MONGO_URI:-mongodb://eurskem-dev:eurskem-dev-password@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-eurskem_ai}
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: 8080
      WEAVIATE_GRPC_PORT: 50051
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-eurskem-dev-weaviate-key}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-eurskem-dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-eurskem-dev-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-eurskem-ai-docs}
      REDIS_URL: redis://:${REDIS_PASSWORD:-eurskem-dev-redis-password}@redis:6379/0
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    depends_on:
      mongo:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./workflows:/app/workflows
    networks:
      - eurskem-net

  mongo:
    image: mongo:7.0.14
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-eurskem-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-eurskem-dev-password}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eurskem-net

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-eurskem-dev-weaviate-key}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_KEY_USER:-eurskem-app}
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_API_KEY_USER:-eurskem-app}
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/v1/.well-known/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - eurskem-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eurskem-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-eurskem-dev-minio-password}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eurskem-net

  redis:
    # redis-stack-server carries the RediSearch engine (FT.*) the LangGraph
    # Redis checkpointer requires. The core `redis:8.x` library image is
    # search-less (verified: 267 cmds, FT._LIST unknown); redis-stack-server
    # reports 407 cmds and answers FT._LIST. Do NOT override the entrypoint
    # with a bare redis-server command — that bypasses the managed startup
    # that loads search. Pass args via REDIS_ARGS instead.
    image: redis/redis-stack-server:latest
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD:-eurskem-dev-redis-password}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "${REDIS_PASSWORD:-eurskem-dev-redis-password}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - eurskem-net

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - eurskem-net

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-eurskem-dev-grafana-password}
    networks:
      - eurskem-net

volumes:
  mongo-data:
  weaviate-data:
  minio-data:
  redis-data:

networks:
  eurskem-net:
    driver: bridge
