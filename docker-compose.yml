services:
  app:
    build:
      context: .
      args:
        SCIENTIFIC_SKILLS_REF: ${SCIENTIFIC_SKILLS_REF:-v2.59.0}
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PAPER_SEARCH_MCP_ENABLED: ${PAPER_SEARCH_MCP_ENABLED:-true}
      PAPER_SEARCH_MCP_PATH: ${PAPER_SEARCH_MCP_PATH:-}
      PAPER_SEARCH_MCP_COMMAND: ${PAPER_SEARCH_MCP_COMMAND:-python}
      PAPER_SEARCH_MCP_MODULE: ${PAPER_SEARCH_MCP_MODULE:-paper_search_mcp.server}
      PAPER_SEARCH_MCP_OPENALEX_API_KEY: ${PAPER_SEARCH_MCP_OPENALEX_API_KEY:-}
      PAPER_SEARCH_MCP_UNPAYWALL_EMAIL: ${PAPER_SEARCH_MCP_UNPAYWALL_EMAIL:-}
      PAPER_SEARCH_MCP_CORE_API_KEY: ${PAPER_SEARCH_MCP_CORE_API_KEY:-}
      PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY: ${PAPER_SEARCH_MCP_SEMANTIC_SCHOLAR_API_KEY:-}
      SCIENTIFIC_SKILLS_ENABLED: ${SCIENTIFIC_SKILLS_ENABLED:-true}
      SCIENTIFIC_SKILLS_PATH: ${SCIENTIFIC_SKILLS_PATH:-/opt/scientific-agent-skills/skills}
      OPA_URL: http://opa:8181
    depends_on:
      mongo:
        condition: service_healthy
      weaviate:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      opa:
        condition: service_started
      snippet-runner:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./workflows:/app/workflows
      - snippet-runner-socket:/run/snippet-runner
    extra_hosts:
      # Lets the API container reach vLLM/SGLang running on the host on Linux.
      # Docker Desktop provides the same hostname on macOS and Windows.
      - "host.docker.internal:host-gateway"
    networks:
      - eurskem-net

  mongo:
    image: mongo:7.0.14
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-eurskem-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-eurskem-local-dev}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eurskem-net

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-eurskem-local-dev-key}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_API_KEY_USER:-eurskem-app}
      AUTHORIZATION_ADMINLIST_ENABLED: "true"
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_API_KEY_USER:-eurskem-app}
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/v1/.well-known/ready",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - eurskem-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eurskemapp}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-eurskem-local-dev-secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/ready >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eurskem-net

  redis:
    # redis-stack-server carries the RediSearch engine (FT.*) the LangGraph
    # Redis checkpointer requires. Plain redis:8.x (incl. -alpine) ships only
    # vectorset, not search — FT._LIST returns "unknown command". Do NOT
    # override the entrypoint with a bare redis-server command; that bypasses
    # the managed startup that loads the modules. Pass args via REDIS_ARGS.
    image: redis/redis-stack-server:7.4.0-v3  # pinned; was :latest — bump deliberately
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD:-eurskem-local-dev}"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "${REDIS_PASSWORD:-eurskem-local-dev}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - eurskem-net

  # Business Records — a real, persistent MySQL database backing
  # app/mcp/business_records (seeded from both app/mcp/d365_finance/fixtures.json
  # and app/mcp/dynamics/fixtures.json via `python -m app.mcp.business_records.seed`),
  # unlike the other MCP connectors in this repo which serve fixture data
  # in-process with no database of their own.
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${BUSINESS_RECORDS_MYSQL_ROOT_PASSWORD:-eurskem-local-dev-root}
      MYSQL_DATABASE: ${BUSINESS_RECORDS_MYSQL_DATABASE:-business_records}
      MYSQL_USER: ${BUSINESS_RECORDS_MYSQL_USER:-eurskem-app}
      MYSQL_PASSWORD: ${BUSINESS_RECORDS_MYSQL_PASSWORD:-eurskem-local-dev}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - eurskem-net

  # snippet-runner — the isolated executor for PythonSnippetAgent
  # (app/nodes/python_snippet.py). Reused build/image as `app` (same repo,
  # same Python) so no second Dockerfile to maintain, but a completely
  # different runtime posture: no network at all, read-only root
  # filesystem, no capabilities, a non-root numeric uid, and a process
  # limit — none of which the main app container can afford, since it
  # legitimately needs to reach Mongo/MySQL/the model APIs. Reached over a
  # Unix socket on a shared volume, never a port — there is no network to
  # publish one on.
  snippet-runner:
    build:
      context: .
      args:
        SCIENTIFIC_SKILLS_REF: ${SCIENTIFIC_SKILLS_REF:-v2.59.0}
    command: ["python", "-m", "app.runtime.snippet_daemon"]
    environment:
      SNIPPET_RUNNER_SOCKET_PATH: /run/snippet-runner/snippet-runner.sock
    volumes:
      - ./app:/app/app:ro
      - snippet-runner-socket:/run/snippet-runner
    # No `networks:` — network_mode: none is the actual containment for
    # every snippet this daemon ever runs, independent of anything the
    # snippet itself imports or tries.
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    # No explicit `user:` override — inherits the image's own non-root
    # `app` (uid 10001), the same uid the Dockerfile already gives
    # /run/snippet-runner ownership to. Container isolation, not a
    # different uid number, is what actually separates this from the main
    # app container.
    healthcheck:
      test:
        [
          "CMD",
          "python", "-c",
          "import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(2); s.connect('/run/snippet-runner/snippet-runner.sock')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # OPA (Open Policy Agent) — policy-as-code decision point for the data-classification/
  # ZDR routing policy (app/security/llm_policy.py). Not exposed publicly.
  opa:
    image: openpolicyagent/opa:1.19.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./config/opa/policies:/policies:ro
    # No healthcheck: the "-static" image ships literally nothing but the opa binary itself
    # (no shell, no wget/curl, not even `ls` — verified by exec probing) so no CMD-based
    # healthcheck can run inside it. `app`'s depends_on uses `service_started` (not
    # `service_healthy`) for this reason.
    networks:
      - eurskem-net

  # Presidio Analyzer — PII/entity DETECTION primitive, available alongside Eurskem's own
  # Python-native entity tokenizer (app/security/entity_tokenizer.py, which currently uses
  # registry/regex/spaCy NER detection, not Presidio) for future use.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.360
    ports:
      - "127.0.0.1:5001:3000"
    healthcheck:
      # No wget/curl in this image (verified by exec probing) — python3 is present.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - eurskem-net

  # OTel Collector. Ships with a "debug" exporter (logs traces to its own stdout) so the
  # wiring is provably real without requiring a full tracing backend (Jaeger/Tempo/etc.) at
  # this scale — swap config/otel-collector-config.yaml's exporter for a real backend when
  # one exists.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    networks:
      - eurskem-net

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts/alerts.yml:ro
    networks:
      - eurskem-net

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - eurskem-net

volumes:
  mongo-data:
  weaviate-data:
  minio-data:
  redis-data:
  mysql-data:
  snippet-runner-socket:

networks:
  eurskem-net:
    driver: bridge