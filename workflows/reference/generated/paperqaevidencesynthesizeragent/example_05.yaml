        - name: target_users
          type: text
          description: The KER's target users.
        - name: value_proposition
          type: text
          description: The KER's value proposition.
        - name: protection_or_ipr_route
          type: text
          description: The protection or IPR route for this KER.
        - name: exploitation_route
          type: text
          description: The exploitation route for this KER.
        - name: time_to_uptake
          type: string
          description: The expected time to uptake for this KER.
    - name: policy_impact_strategy
      type: object
      description: 2.2.5 — multi-level policy impact strategy.
      fields:
      - name: value
        type: text
        description: Free-form — see the node's original instructions for expected
          shape.
    - name: impact_summary
      type: object
      description: A short summary of impact, closing section 2.
      fields:
      - name: value
        type: text
        description: Free-form — see the node's original instructions for expected
          shape.
    - name: work_plan_timing
      type: object
      description: 3.1.1 — timing of work packages.
      fields:
      - name: value
        type: text
        description: Free-form — see the node's original instructions for expected
          shape.
- id: evidence_consistency
  type: ConsistencyChecker
  config:
    block_on_warn: true
- id: blueprint_completeness_gate
  type: ProposalSubmissionGate
  config:
    proposal_text: '{{proposal_blueprint.raw}}'
    evidence_blockers: '{{truth_graph.blocking_issues}}'
    consistency_gate: '{{evidence_consistency.gate}}'
    consistency_findings: '{{evidence_consistency.findings}}'
    evaluation_threshold_passed: true
    evaluation_total_score: 0
    evaluation_blockers: []
    required_headings: []
    minimum_proposal_characters: 1000
    require_evaluation_pass: false
    block_on_input_needed: true
- id: blueprint_readiness_router
  type: RouterAgent
  config:
    mode: rule
    rules:
    - name: READY
      condition: blueprint_completeness_gate.submission_ready == true
    - name: BLOCKED
      default: true
- id: blueprint_blocked
  type: HumanInLoopAgent
  config:
    question: The locked blueprint cannot be released to section drafting because
      the Proposal Graph still has blocking or advisory consistency issues. Reject
      this run, close the listed project inputs in the concept and supporting documents,
      and rerun Stage 1.
    context_fields:
    - blueprint_completeness_gate.report
    - evidence_consistency.report
    - evidence_consistency.findings
    - proposal_blueprint.parsed.unresolved_inputs
    allow_document_override: false
    allowed_actions:
    - reject
- id: approve_locked_blueprint
  type: HumanInLoopAgent
  config:
    question: Human Gate 5 — approve the locked proposal blueprint for section drafting.
      Confirm that unresolved_inputs is empty and that the objectives, KPIs, partners,
      work packages, resources, Method Cards, impact logic and page budget reflect
      the consortium's approved commitments. Reject and rerun Stage 1 if anything
      remains unresolved.
    context_fields:
    - proposal_blueprint.parsed
    - proposal_blueprint.parsed.unresolved_inputs
    - methodology_engineering.method_cards
    - evidence_consistency.report
    allow_document_override: false
    allowed_actions:
    - approve
    - reject
