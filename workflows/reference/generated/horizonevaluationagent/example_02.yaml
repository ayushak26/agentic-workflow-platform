- id: consistency_gate
  type: ConsistencyChecker
  config:
    block_on_warn: false
- id: submission_gate
  type: ProposalSubmissionGate
  config:
    proposal_text: '{{final_revision.text}}'
    evidence_blockers: '{{ inputs.candidates_processed.rejected_candidates }}'
    consistency_gate: '{{consistency_gate.gate}}'
    consistency_findings: '{{consistency_gate.findings}}'
    evaluation_threshold_passed: '{{evaluate_final.threshold_passed}}'
    evaluation_total_score: '{{evaluate_final.total_score}}'
    evaluation_blockers: '{{evaluate_final.deterministic_blockers}}'
    minimum_proposal_characters: 20000
    require_evaluation_pass: true
    block_on_input_needed: true
- id: dynamic_figures
  type: DynamicFigureAgent
  config:
    content: '{{ final_revision.text }}'
    image_model: gpt-image-2-2026-04-21
    size: auto
    quality: auto
    output_format: png
    max_images: 10
    fail_open: true
- id: render_submission_docx_full
  type: HorizonDOCXProposalRenderer
  config:
    content: '{{ dynamic_figures.captioned_content }}'
    content_format: markdown
    metadata: '{{ inputs.metadata }}'
    citation_registry: '{{ citation_registry.citation_registry }}'
    evidence_qa: '{{ inputs.candidates_processed.report }}'
    evidence_blockers: '{{submission_gate.blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: null
    enforce_page_limit: false
    enable_footnotes: true
