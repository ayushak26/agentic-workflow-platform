      default: []
  experience:
    display_name: Service and Spare Parts
    purpose: Hand a parts request to Service with the equipment identified.
    contribution: Service can identify the part from recorded order history.
    expected_output: A spare-parts hand-off packet.
    failure_message: The Service hand-off could not be built.
- id: human_review
  type: HumanInLoopAgent
  config:
    question: This request could not be handled automatically. Check what the customer
      wrote against what the CRM knows, and decide how to proceed.
    review_purpose: Either the AI step was not confident enough, the company is not
      in the CRM, or the customer referred to a purchase we could not identify. Approve
      to accept the extraction, edit it to correct what is wrong, or reject to stop
      the workflow.
    allowed_actions:
    - approve
    - edit
    - reject
    context_fields:
    - outputs.incoming_request.data.message
    - outputs.understand_request.parsed
    - outputs.find_crm_account.data
    - outputs.assess_request.decisions
    editable_content_field: outputs.understand_request.parsed
    review_panels:
    - label: Original communication
      field: outputs.incoming_request.data.message
      hint: Exactly as the customer wrote it, untranslated.
    - label: What the AI understood
      field: outputs.understand_request.parsed
      hint: Correct anything wrong before approving.
      editable: true
    - label: Confidence
      field: outputs.understand_request.parsed.confidence
      hint: Below 0.80 the workflow does not act automatically.
    - label: Blocking information
      field: outputs.understand_request.parsed.blocking_missing_information
      hint: Without these, this request cannot be handled with any confidence.
    - label: Ambiguities
      field: outputs.understand_request.parsed.ambiguities
      hint: Phrases that need interpretation rather than information that is simply
        missing.
    - label: Suggested actions
      field: outputs.understand_request.parsed.suggested_actions
      hint: The AI's advisory recommendation. It does not decide the route — you do.
    - label: CRM account
      field: outputs.find_crm_account.data
      hint: What Dynamics knows about this company, if anything.
    - label: Order history
      field: outputs.crm_order_history.data
      hint: What they have actually bought. When the customer said "the same as last
        time", the product they meant is one of these — pick it rather than letting
        the workflow guess.
    - label: Complexity
      field: outputs.assess_request.decisions.complexity
      hint: standard, technical, or complex — complex always comes to a person.
    - label: Suggested route
      field: outputs.assess_request.decisions.primary_intent
      hint: Where this would have gone if it had been handled automatically.
    - label: Reason for escalation
      field: outputs.assess_request.decisions.escalation_reason
      hint: Which rule sent this request to you.
  experience:
    display_name: Human Review
    purpose: A person decides what happens with requests the rules could not settle.
    contribution: Nothing uncertain is handled automatically.
    expected_output: An approval, an edit, or a rejection with a reason.
    failure_message: The review could not be presented.
edges:
- from: incoming_request
  to: understand_request
- from: understand_request
  to: find_crm_account
- from: find_crm_account
  to:
  - crm_order_history
  - crm_opportunities
- from: crm_order_history
  to: assess_request
- from: crm_opportunities
  to: assess_request
- from: assess_request
  to: route_request
- from: route_request
  condition: route
  branches:
    sales: sales
    technical_support: product_knowledge_support
    spare_parts: product_knowledge_parts
    human_review: human_review
- from: product_knowledge_support
  to: technical_support
- from: product_knowledge_parts
  to: spare_parts
