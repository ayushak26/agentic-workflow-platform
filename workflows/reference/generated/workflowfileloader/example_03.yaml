      coordinator_role: INSIDE_SALES
    rules:
    - name: At least one specialist responsibility exists
      when:
        operator: and
        conditions:
        - field: outputs.responsibility_decision.decisions.specialist_required
          operator: is_true
      then:
      - field: specialist_required
        value: true
      - field: crm_can_fully_resolve
        value: false
      - field: coordination_required
        value: true
      - field: coordinator_role
        value: TECHNICAL_CASE_COORDINATOR
    - name: More than one role is needed
      when:
        operator: and
        conditions:
        - field: outputs.responsibility_metrics.data.work_item_count
          operator: greater_than
          value: 1
      then:
      - field: multi_role
        value: true
      - field: coordination_required
        value: true
      - field: coordinator_role
        value: TECHNICAL_CASE_COORDINATOR
- id: build_crm_case_payload
  type: DataTransformAgent
  config:
    operations:
    - target: case
      operation: object
      value:
        status: READY_FOR_CRM_CASE_CREATION
        source_channel: $customer_inquiry.data.source_channel
        received_at: $customer_inquiry.data.received_at
        language: $understand_customer_inquiry.data.language
        summary: $interpret_customer_inquiry.parsed.inquiry.summary
        customer_state: $customer_context.decisions.customer_state
        customer_verified: $customer_context.decisions.customer_verified
        account_id: $find_customer.first.account_id
        account_name: $find_customer.first.account_name
        specialist_required: $coordination_decision.decisions.specialist_required
        multi_role: $coordination_decision.decisions.multi_role
        coordination_required: $coordination_decision.decisions.coordination_required
        coordinator_department: $coordination_decision.decisions.coordinator_department
        coordinator_role: $coordination_decision.decisions.coordinator_role
    - target: understanding
      operation: copy
      source: understand_customer_inquiry.data
    - target: attachment
      operation: copy
      source: understand_customer_inquiry.data.attachment
    - target: required_work
      operation: copy
      source: responsibility_decision.decisions.required_work
      default: []
    - target: owner_directory
      operation: copy
      source: owner_directory.data
      default: {}
    - target: routing_rule_matches
      operation: copy
      source: responsibility_decision.matched_rules
      default: []
    - target: routing_explanation
      operation: copy
      source: responsibility_decision.summary
      default: []
    - target: customer_context
      operation: copy
      source: customer_context.decisions
      default: {}
edges:
- from: load_attachments
  to: interpret_customer_inquiry
- from: interpret_customer_inquiry
  to: understand_customer_inquiry
- from: understand_customer_inquiry
  to: understanding_metrics
- from: understanding_metrics
  to: understanding_quality
- from: understanding_quality
  to: understanding_router
- from: understanding_router
  condition: route
  branches:
    HUMAN_REVIEW: manual_understanding_review
    CONTINUE: find_customer
- from: find_customer
  to: customer_match_router
- from: customer_match_router
  condition: route
  branches:
    AMBIGUOUS: customer_ambiguity_review
    CONTINUE: get_account_ownership
- from: get_account_ownership
  to: customer_context
- from: customer_context
  to: owner_directory
- from: owner_directory
  to: responsibility_decision
- from: responsibility_decision
  to: responsibility_metrics
- from: responsibility_metrics
  to: coordination_decision
- from: coordination_decision
  to: build_crm_case_payload
- from: customer_inquiry
  to: load_attachments
