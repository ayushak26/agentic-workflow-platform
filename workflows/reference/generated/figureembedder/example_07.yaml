name: Reference FigureEmbedder 07
description: 'Revamped post-evidence slice of the Horizon Europe RIA/IA Part B workflow.
  It starts strictly after evidence verification: every artifact the evidence stage
  produces (metadata, call intelligence, normalised source graph, discovery candidates,
  search audit, concept/document text, optional supplementary web search, the verified
  evidence package, and the deterministic call coverage matrix) is supplied as a workflow
  input rather than recomputed here — this workflow never calls web search or re-verifies
  evidence itself. From there it maps the call, locks a blueprint, drafts the six
  official Part B subsections in parallel (matching the official numbered subsection
  structure down to 1.1.1/1.1.2, 1.2.1-1.2.7, 2.1.1-2.1.3, 2.2.1-2.2.5 and 3.1.1-3.1.3),
  compiles, independently evaluates and red-teams the result, revises once, gates
  deterministically, and renders TWO editable DOCX files: one with no page limit at
  all, and one carrying the 45-page working estimate as an informational warning only
  (neither blocks). Both renders include real Word footnotes at every citation marker,
  pointing to the source. Unlike the original backhalf workflow, this version never
  leaves a visible "[INPUT NEEDED]" placeholder in the document — every gap is resolved
  with the model''s own best-supported analysis so the output reads as a finished,
  submission-style draft; treat it as a strong first draft that still wants a human
  fact-check pass before actual submission, since unresolved gaps are no longer visually
  flagged.'
version: '2.0'
use_case: eu_proposal
inputs:
  metadata:
    type: json
    required: true
    description: partb_metadata.parsed (renderer metadata).
  call_intelligence:
    type: json
    required: true
    description: call_intelligence.parsed (atomic call checklist).
  normalise_report:
    type: text
    required: true
    description: normalise_source_graph.report.
  normalise_warnings:
    type: json
    required: true
    description: normalise_source_graph.warnings.
  candidates:
    type: json
    required: true
    description: discover_evidence.candidates (list of scholarly candidates).
  search_audit:
    type: json
    required: true
    description: discover_evidence.search_audit.
  load_concept:
    type: file
    required: true
    description: '[LIVE] evidence stage''s load_concept output — .parseable_text is
      the concept note text given to proposal_blueprint.'
  load_documents:
    type: file
    required: true
    description: '[LIVE] evidence stage''s load_documents output — .parseable_text
      is given to proposal_blueprint, draft_2_2, draft_3_1 and draft_3_2 for source
      fidelity.'
  web_search:
    type: json
    required: false
    description: '[LIVE] evidence stage''s web_search output — .results is given to
      research_documentation as supplementary, non-citable context. Leave empty if
      the evidence stage did not run a web search.'
  verify_evidence:
    type: json
    required: true
    description: '[LIVE] evidence stage''s verify_evidence output (citation_registry,
      verified_claims, qa_report, proposal_ready_cited_markdown, blocking_issues)
      — the verified-evidence backbone for every draft and both renders.'
  call_coverage:
    type: json
    required: true
    description: '[LIVE] evidence stage''s call_coverage output — the deterministic
      call-requirement coverage matrix. Must come from a run where call_coverage executed
      alongside a live normalise_source_graph node; this workflow cannot recompute
      it from JSON inputs alone.'
nodes:
- id: start
  type: Literal
  config:
    value: true
- id: research_documentation
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 16000
    output_schema:
      cited_sources: list
      bibliography_formatted: str
      web_search_references: list
      candidate_sources_considered: list
      citation_coverage_summary: object
    prompt_template: 'Produce a standalone, audit-ready research-documentation record
      for

      this proposal run. This is not proposal text — it is the evidence

      paper trail: every research source cited, every web link consulted,

      and what was found but not used. Never invent a source, URL, DOI, or

      detail not present in the supplied records.


      cited_sources: one entry per citation ID in the verified citation

      registry — id, title, authors (if known), year, source type

      (official/peer_reviewed/standard/dataset/project/market/partner),

      URL or DOI, exact locator used, verification status, and the exact

      Part B subsection(s) it supports. Use [UNKNOWN] for any missing

      bibliographic field rather than guessing.


      bibliography_formatted: a clean, numbered reference list built only

      from cited_sources, ready to paste into an evidence annex.


      web_search_references: one entry per web-search result actually

      surfaced in the supplementary web context — the query that found it,

      title, URL, why it was consulted, and whether it ended up informing

      the proposal. Label these clearly as situational/contextual, never

      as citable evidence.


      candidate_sources_considered: discovery candidates that were found

      but never promoted to verified evidence, each with a rejection

      reason (unverified, contradicted, superseded, off-topic, duplicate).

      If more than ~40 candidates were considered, group by rejection

      reason with representative examples instead of listing every one.


      citation_coverage_summary: counts of candidates discovered,

      acquired in full text, verified, cited in the final citation

      registry, rejected, and web-search-only references.


      CITATION REGISTRY:

      {{inputs.verify_evidence.citation_registry}}


      VERIFIED CLAIMS:

      {{inputs.verify_evidence.verified_claims}}


      DISCOVERY CANDIDATES:

      {{ inputs.candidates }}


      SEARCH AUDIT:

      {{ inputs.search_audit }}


      WEB SEARCH RESULTS:

      {{ inputs.web_search.results }}


      EVIDENCE QA:

      {{inputs.verify_evidence.qa_report}}

      '
- id: proposal_blueprint
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 34000
    output_schema:
      proposal_identity: object
      source_hierarchy_and_fact_ledger: object
      official_partb_structure: object
      hard_page_limit: int
      working_page_target: int
      section_page_budget: object
      objective_result_outcome_chain: object
      state_of_art_and_innovations: object
      methodology_and_validation: object
      impact_pathways_and_kpis: object
      work_packages_tasks_deliverables: object
      consortium_and_resources: object
      risks_and_mitigations: object
      cross_cutting_compliance: object
      figure_and_table_plan: object
      unresolved_inputs: list
      specific_objectives_table: object
      ambitions: object
      pilot_strategy: object
      linked_research_activities: object
      ssh_integration: object
      gender_dimension: object
      data_management_open_science: object
      pestel_analysis: object
      dissemination_communication_plan: object
      post_project_dissemination: object
      exploitation_strategy: object
      policy_impact_strategy: object
      impact_summary: object
      work_plan_timing: object
    prompt_template: "Treat the supplied concept note as the selected project concept.\
      \ Create\nthe master blueprint only for the Horizon Europe RIA/IA Part B technical\n\
      description. Follow the official 2026 headings exactly, down to every\nnumbered\
      \ subsection below — each maps to the output field named after\nit, and none\
      \ may be silently skipped:\n1.1 Objective and Ambition\n  1.1.1 Overall Project\
      \ Objective: one row per approved objective —\n  never force the count to match\
      \ a template's blank SO1-SO5\n  placeholders — each giving SO id, specific objective,\
      \ target\n  outcome, KPI, baseline, target value, verification route and the\n\
      \  call requirement it answers -> specific_objectives_table\n  (the causal objective\
      \ -> result -> outcome -> impact chain itself\n  still belongs in objective_result_outcome_chain).\n\
      \  1.1.2 Ambitions: the central ambition (A1), state of the art, and\n  what\
      \ goes beyond it -> ambitions.\n1.2 Methodology\n  1.2.1 Concept, 1.2.2 pilot\
      \ strategy -> pilot_strategy, and\n  1.2.3 overall methodology and approach\
      \ all belong in\n  methodology_and_validation. 1.2.4 linked research and innovation\n\
      \  activities this project builds on -> linked_research_activities.\n  1.2.5\
      \ interdisciplinary approach and SSH integration ->\n  ssh_integration. 1.2.6\
      \ gender dimension -> gender_dimension: treat\n  gender relevance in research\
      \ content (variables, disaggregation,\n  bias controls) as its own topic, separate\
      \ from workforce/team\n  balance.\n  1.2.7 data management and open science\
      \ practices ->\n  data_management_open_science (cover data types, FAIR handling\
      \ and\n  planned open-access routes).\n2.1 Project's Pathways Towards Impact\n\
      \  2.1.1-2.1.2 contribution to expected outcomes and impacts belong in\n  impact_pathways_and_kpis.\
      \ 2.1.3 requirements and potential barriers\n  beyond the project's scope: run\
      \ a concrete PESTEL (Political,\n  Economic, Social, Technological, Environmental,\
      \ Legal) analysis\n  naming factors specific to this call and domain, never\
      \ generic\n  boilerplate -> pestel_analysis. Give each barrier a category, the\n\
      \  external condition, likelihood, consequence, project response and a\n  responsible\
      \ monitor. These are external conditions beyond the\n  project's control; never\
      \ restate one as an internal implementation\n  risk in risks_and_mitigations,\
      \ and vice versa.\n2.2 Measures to Maximise Impact - Dissemination, Communication,\
      \ and\nExploitation\n  2.2.1 dissemination strategy and measures and 2.2.2 communication\n\
      \  strategy -> dissemination_communication_plan. 2.2.3 dissemination\n  and\
      \ communication activities after the project ends ->\n  post_project_dissemination.\
      \ 2.2.4 exploitation strategy ->\n  exploitation_strategy: one key exploitable\
      \ result (KER) per row,\n  each with an owner, target users, value proposition,\n\
      \  protection/IPR route, exploitation route and time to uptake.\n  2.2.5 multi-level\
      \ policy impact strategy -> policy_impact_strategy.\n  Close section 2 with\
      \ a short summary of impact -> impact_summary.\noptional 2.3 Summary\n3.1 Work\
      \ Plan and Resources\n  3.1.1 timing of work packages -> work_plan_timing. 3.1.2\
      \ overall\n  structure of the work package set and 3.1.3 detailed work\n  description\
      \ both belong in work_packages_tasks_deliverables.\n3.2 Capacity of Participants\
      \ and Consortium as a Whole ->\nconsortium_and_resources.\nDo not create sections\
      \ 1.3, 3.3, 3.4, Part A, ethics forms, security\nforms, budget forms or submission\
      \ instructions. Treat any blank\nplaceholder label (e.g. an empty \"SO1\"/\"\
      A1\" slot) or example/template\nproject name found in a supplied document as\
      \ a structural cue only,\nnever as approved content — do not let either leak\
      \ into the\nblueprint.\n\nDetermine the hard page limit from the call metadata\
      \ and template,\nnot by default: a confirmed lump-sum RIA/IA topic gets a 45-page\
      \ hard\nlimit with a 44-page working target (front matter 1; 1.1 = 4; 1.2 =\n\
      13; 2.1 = 3; 2.2 = 3; optional 2.3 = 1; 3.1 = 16; 3.2 = 3). A standard\n(non-lump-sum)\
      \ full proposal gets the normal 40-page hard limit with\na 39-page working target\
      \ (front matter 1; 1.1 = 5; 1.2 = 12; 2.1 =\n4.5; 2.2 = 3; optional 2.3 = 0.5;\
      \ 3.1 = 11.5; 3.2 = 2.5). If the\nfunding model cannot be confirmed from the\
      \ supplied call documents,\ndefault to the stricter 40-page profile and use\
      \ your own\nbest-supported reading of the record for unresolved_inputs rather\n\
      than leaving it blank. Retain one page of safety against rendering\nvariation.\
      \ If section 2.3 is omitted, reallocate its page only where\nevaluator value\
      \ is highest. This is a full proposal: plan each\nsubsection to fill its budget\
      \ with evaluator-dense, grounded content,\nnot filler.\n\nIn figure_and_table_plan,\
      \ for each planned figure give a short stable\nslug (used later to match a generated\
      \ image to its slot) and the exact\nevaluator-relevant content it must show.\
      \ Plan only evaluator-useful\nfigures — never decoration.\n\nMap every call\
      \ requirement to a Part B subsection, result, owner,\nevidence claim, KPI, WP,\
      \ task, deliverable, milestone and risk where\ngrounded. Build an explicit objective\
      \ -> result -> outcome -> impact chain.\nUse only verified citations and supplied\
      \ facts; where a fact is\ngenuinely missing, use your own best-supported analysis\
      \ to complete\nit rather than inventing a specific partner, budget, KPI, TRL,\n\
      timeline, pilot, source or evidence detail from nothing.\n\nCONCEPT NOTE:\n\
      {{ inputs.load_concept.parseable_text }}\n\nPROPOSAL METADATA:\n{{ inputs.metadata\
      \ }}\n\nCALL CHECKLIST:\n{{ inputs.call_intelligence }}\n\nCALL COVERAGE:\n\
      {{ inputs.call_coverage }}\n\nNORMALISED SOURCE:\n{{ inputs.normalise_report\
      \ }}\n{{ inputs.normalise_warnings }}\n\nSUPPORTING DOCUMENTS:\n{{ inputs.load_documents.parseable_text\
      \ }}\n\nVERIFIED EVIDENCE (citation-annotated narrative markdown of the\nverified\
      \ claims):\n{{inputs.verify_evidence.proposal_ready_cited_markdown}}\n"
