    content_format: markdown
    metadata: '{{ inputs.metadata }}'
    citation_registry: '{{inputs.verify_evidence.citation_registry}}'
    evidence_qa: '{{inputs.verify_evidence.qa_report}}'
    evidence_blockers: '{{submission_gate.blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: 45
    enforce_page_limit: false
    enable_footnotes: true
