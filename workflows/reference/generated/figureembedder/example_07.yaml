      sections. Remove duplication, align terminology, and add no facts.

      Preserve every official numbered subsection heading exactly as

      drafted (2.1.1-2.1.3, 2.2.1-2.2.5). Never introduce a

      "[INPUT NEEDED]" placeholder — if the two drafts disagree or a fact

      is unclear, resolve it with your own best-supported analysis and

      state it as a normal, confident sentence. Keep the prose in full

      paragraphs; do not convert narrative text into bullet lists. Retain

      every valid citation marker. Preserve every `[[IMAGE PROMPT: ...]]`

      marker exactly as it appears, verbatim, on its own line — never

      paraphrase, reformat, or drop it. Aim for a full, evaluator-dense

      2.1+2.2(+2.3). Start with the "# 2. Impact" heading.


      2.1:

      {{draft_2_1_pathways.raw}}


      2.2 AND OPTIONAL 2.3:

      {{draft_2_2_measures_and_2_3_summary.raw}}

      '
- id: compile_implementation
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 20000
    prompt_template: 'Assemble the coherent "3. Implementation" section (3.1 and 3.2
      only)

      of the Horizon Europe Part B Markdown document from the two supplied

