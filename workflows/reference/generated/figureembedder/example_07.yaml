      no facts. Preserve every official numbered subsection heading

      exactly as drafted (3.1.1-3.1.3). Never introduce a

      "[INPUT NEEDED]" placeholder — if the two drafts disagree or a fact

      is unclear, resolve it with your own best-supported analysis and

      state it as a normal, confident sentence. Keep the prose in full

      paragraphs (tables stay tables). Retain every valid citation marker.

      Preserve every `[[IMAGE PROMPT: ...]]` marker exactly as it appears,

      verbatim, on its own line — never paraphrase, reformat, or drop it.

      Aim for a full, evaluator-dense 3.1+3.2. Start with the

      "# 3. Implementation" heading.


      3.1:

      {{draft_3_1_workplan_resources.raw}}


      3.2:

      {{draft_3_2_consortium.raw}}

      '
- id: compile_v1
  type: TextAssemblerAgent
  config:
    separator: '


      '
