      {{proposal_blueprint.parsed.work_packages_tasks_deliverables}}

      '
- id: draft_1_1_objectives_ambition
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 16000
    prompt_template: 'Draft only official subsection "1.1 Objective and Ambition"
      in

      polished proposal-ready Markdown, in full prose paragraphs, targeting

      a full 4 pages. Use bullet points or numbered lists only for the two

      mandated tables described below — never for ordinary narrative

      content.


      Structure the subsection under two explicit numbered headings:


      "1.1.1 Overall Project Objective": state the single overall project

      objective in one clear paragraph, then present the specific

      objectives (SO1, SO2, SO3, ... — one per approved objective from

      proposal_blueprint.parsed.specific_objectives_table; never force the

      count to match blank SO1-SO5 placeholders in any supplied template)

      each as its own short paragraph explaining what it targets and why it

      matters. Follow with a table using exactly these columns: SO''s |

      Target Outcomes | KPIs | Target values.


      "1.1.2 Ambitions": open with the central ambition (A1) as a

      paragraph, then a labelled subsection "State of the Art" summarising

      in prose the current state of the art and available solutions

      (grounded in proposal_blueprint.parsed.ambitions and the verified

      evidence below), followed by a labelled subsection "Beyond the State

      of the Art" explaining in prose the precise advance this project

      makes and why it is ambitious yet realistically achievable. State

      R&I maturity or start/end TRLs only when grounded.


      Use only verified citation IDs. If a fact is genuinely missing, do

      not flag it — resolve it with your own best-supported analysis or a

      reasonable, clearly-reasoned estimate, and write the result as a

      normal, confident sentence, not a placeholder. Do not draft

      methodology or create 1.3.


      Where the objective -> result -> outcome -> impact chain diagram

      belongs, insert exactly this marker on its own line, unmodified:

      [[IMAGE PROMPT: Figure 1 - Objective-Result-Outcome-Impact Chain]]

      Do not draw or describe the diagram yourself; do not omit the marker.


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      VERIFIED EVIDENCE:

      {{inputs.verify_evidence.proposal_ready_cited_markdown}}


      CITATION REGISTRY:

      {{inputs.verify_evidence.citation_registry}}

      '
- id: draft_1_2_methodology
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 32000
    prompt_template: 'Draft only official subsection "1.2 Methodology" in proposal-ready

      Markdown, in full prose paragraphs (no bullet lists for narrative

      content), targeting a full 13 pages. Structure it under these seven

      explicit numbered headings, each a coherent narrative rather than a

      repetition of work packages:


      "1.2.1 Concept": the guiding concept and design philosophy behind the

      project''s approach.


      "1.2.2 Pilot Strategy": how piloting and validation are structured

      across the project (sites, phases, scale-up logic).


      "1.2.3 Overall Methodology and Approach": concepts, models,

      assumptions, methods, data, validation, uncertainty, methodological

      challenges and mitigation.


      "1.2.4 Linked Research and Innovation Activities": based on

      proposal_blueprint.parsed.linked_research_activities — how relevant

      national or international R&I results feed the project.


      "1.2.5 Interdisciplinary Approach & Integration of SSH": based on

      proposal_blueprint.parsed.ssh_integration.


      "1.2.6 Gender Dimension": based on

      proposal_blueprint.parsed.gender_dimension — treat gender relevance

      strictly as research-content relevance (variables, disaggregation,

      bias controls), a separate topic from workforce or team gender

      balance.


      "1.2.7 Data Management & Open Science Practices": based on

      proposal_blueprint.parsed.data_management_open_science — data types,

      FAIR handling, and planned open-access routes.


      Integrate the multi-actor approach where the call requires it, and a

      method-per-objective structure with validation criteria so the

      section fills its page budget with evaluator-useful detail. Use only

      verified citations and supplied facts. If a fact is genuinely

      missing, do not flag it — resolve it with your own best-supported

      analysis or a reasonable, clearly-reasoned estimate, and write the

      result as a normal, confident sentence.


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      VERIFIED EVIDENCE:

      {{inputs.verify_evidence.proposal_ready_cited_markdown}}


      CITATION REGISTRY:

      {{inputs.verify_evidence.citation_registry}}

      '
- id: draft_2_1_pathways
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 16000
    prompt_template: 'Draft only official subsection "2.1 Project''s Pathways Towards

      Impact" in proposal-ready Markdown, in full prose paragraphs,

      targeting a full 3 pages. Structure it under three explicit numbered

      headings:


      "2.1.1 Contribution to the Expected Outcomes": a concise causal

      narrative from specific needs through project results, target

      groups and uptake mechanisms to every expected topic outcome.


      "2.1.2 Contribution to the Expected Impacts": continuing the

      narrative from outcomes to the topic''s wider destination impacts,

      with quantified estimates only when meaningful and grounded.


      "2.1.3 Requirements and Potential Barriers Beyond the Scope of the

      Project": a PESTEL analysis (Political, Economic, Social,

      Technological, Environmental, Legal) grounded in

      proposal_blueprint.parsed.pestel_analysis — identify external

      requirements, assumptions and barriers, how they may evolve, and

      mitigation within or beyond the project. These are external

      conditions only; never restate one as an internal implementation

      risk here or duplicate it in 3.1''s risk table.


      Every number must have a baseline, target, unit, source, owner and

      time horizon; where one is not available, use your own

      best-supported estimate rather than flagging it as missing.


      Where the impact-pathways diagram belongs, insert exactly this

      marker on its own line, unmodified:

      [[IMAGE PROMPT: Figure 2 - Impact Pathways]]

      Do not draw or describe the diagram yourself; do not omit the marker.


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      CALL OUTCOMES:

      {{ inputs.call_intelligence.expected_outcomes }}


      VERIFIED EVIDENCE:

      {{inputs.verify_evidence.proposal_ready_cited_markdown}}

      '
- id: draft_2_2_measures_and_2_3_summary
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 16000
    prompt_template: 'Draft official subsection "2.2 Measures to Maximise Impact -

      Dissemination, Communication, and Exploitation" in proposal-ready

      Markdown, in full prose paragraphs, targeting a full 3 pages.

      Structure it under five explicit numbered headings:


      "2.2.1 Dissemination Strategy and Measures": objectives, target

      groups, messages, measures, channels, timing and KPIs for

      disseminating results during the project.


      "2.2.2 Communication Strategy": the distinct communication plan

      (broader public/stakeholder-facing), with its own objectives,

      messages, channels and KPIs — do not merge this with the

      dissemination methodology above.


      "2.2.3 Dissemination and Communication Activities After the End of

      the Project": post-project uptake, continued outreach and result

      ownership once the project has ended.


      "2.2.4 Exploitation Strategy": give each key exploitable result (KER)

      in proposal_blueprint.parsed.exploitation_strategy its own paragraph

      with owner, target users, value proposition, protection/IPR route

      and exploitation route — do not describe exploitation only in

      general terms.


      "2.2.5 Multi-Level Policy Impact Strategy": how the project''s

      results feed policy at local, national and EU level — policy

      feedback, standardisation, and access-rights considerations relevant

      to policy uptake.


      Add official optional subsection "2.3 Summary" only when it improves

      evaluator comprehension. If used, keep it to one page as a compact

      impact canvas covering specific needs, expected results, D/E/C

      measures, target groups, outcomes and impacts. If it cannot fit the

      working page target, omit it completely. If a fact is genuinely

      missing, use your own best-supported analysis or estimate rather

      than flagging it.


      CALL CHECKLIST:

      {{ inputs.call_intelligence }}


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      SUPPORTING DOCUMENTS:

      {{ inputs.load_documents.parseable_text }}

      '
- id: draft_3_1_workplan_resources
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 32000
    prompt_template: 'Draft only official subsection "3.1 Work Plan and Resources"
      in

      proposal-ready Markdown, in full prose paragraphs for narrative

      content (the mandated official tables below remain tables), targeting

      a full 16 pages including all tables. Structure the narrative under

      three explicit numbered headings:


      "3.1.1 Timing of WPs": work-plan logic, timing, a Gantt placeholder

      and a PERT/dependency placeholder.


      "3.1.2 Overall Structure of Work Package": the overall work-package

      structure, governance and decision controls, quality assurance, and

      data management.


      "3.1.3 Detailed Work Description": WP/task descriptions with

      quantified activities, participants, effort and resources;

      dissemination/exploitation/communication implementation; milestones;

      implementation risks and mitigations; and lump-sum resource

      coherence. Implementation risks here must be distinct from the

      external PESTEL barriers already captured in 2.1.3 — do not

      duplicate them.


      Within 3.1.3, produce the official tables exactly as applicable:

      3.1a list of work packages; 3.1b description of each work package;

      3.1c deliverables; 3.1d milestones; 3.1e critical risks; 3.1f staff

      effort; 3.1g subcontracting costs; and 3.1h major equipment purchase

      costs above the applicable threshold. Preserve exact identifiers and

      numbers from the documents. If a lead, date, person-month, cost,

      owner or quantity is genuinely missing, use your own best-supported

      estimate rather than leaving a placeholder — never fabricate a

      balanced budget or partner allocation beyond a reasonable,

      clearly-reasoned estimate.


      Where the work-package structure diagram belongs (after the WP list,

      before 3.1b), insert exactly this marker on its own line, unmodified:

      [[IMAGE PROMPT: Figure 3 - Work Package Structure]]

      Do not draw or describe the diagram yourself; do not omit the marker.


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      SUPPORTING DOCUMENTS:

      {{ inputs.load_documents.parseable_text }}

      '
- id: draft_3_2_consortium
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 16000
    prompt_template: 'Draft only official subsection "3.2 Capacity of Participants
      and

      Consortium as a Whole" in proposal-ready Markdown, in full prose

      paragraphs, targeting a full 3 pages. Do not repeat the Part A

      organisation descriptions. Demonstrate how the consortium

      collectively matches the objectives, combines disciplinary and

      interdisciplinary expertise, covers SSH/open science/gender

      capabilities where relevant, accesses critical infrastructure,

      covers the value chain and target groups, and assigns complementary

      roles. Explain any affiliated entities, associated partners or

      international participants only when documented. Integrate

      multi-actor co-creation capacity when required by the call. If a

      partner or facility fact is genuinely missing, use your own

      best-supported analysis or estimate rather than flagging it.


      BLUEPRINT:

      {{proposal_blueprint.parsed}}


      SUPPORTING DOCUMENTS:

      {{ inputs.load_documents.parseable_text }}

      '
- id: compile_excellence
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 20000
    prompt_template: 'Assemble the coherent "1. Excellence" section (1.1 and 1.2 only)
      of

      the Horizon Europe Part B Markdown document from the two supplied

      drafts. Do not add Part A, annexes or extra numbered sections.

      Remove duplication between 1.1 and 1.2, align objectives/results/

      terminology, and add no facts. Preserve every official numbered

      subsection heading exactly as drafted (1.1.1, 1.1.2, 1.2.1-1.2.7).

      Never introduce a "[INPUT NEEDED]" placeholder — if the two drafts

      disagree or a fact is unclear, resolve it with your own

      best-supported analysis and state it as a normal, confident

      sentence. Keep the prose in full paragraphs; do not convert

      narrative text into bullet lists. Retain every valid citation

      marker. Preserve every `[[IMAGE PROMPT: ...]]` marker exactly as it

      appears, verbatim, on its own line — never paraphrase, reformat, or

      drop it. Aim for a full, evaluator-dense 1.1+1.2. Start with the

      "# 1. Excellence" heading.


      1.1:

      {{draft_1_1_objectives_ambition.raw}}


      1.2:

      {{draft_1_2_methodology.raw}}

      '
- id: compile_impact
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 12000
    prompt_template: 'Assemble the coherent "2. Impact" section (2.1, 2.2 and optional
