    - '{{compile_implementation.raw}}'
- id: evaluate_v1
  type: HorizonEvaluationAgent
  config:
    proposal_text: '{{compile_v1.text}}'
    generator_model: auto
    evaluator_models:
    - claude-sonnet-4-5
    - gpt-5
    criterion_threshold: 4.0
    total_threshold: 12.0
- id: red_team_v1
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - gpt-5.6-sol
  - claude-opus-5
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-sol
    max_tokens: 12000
    output_schema:
      blocking_gaps: list
      excellence_risks: list
      impact_risks: list
      implementation_risks: list
      evidence_and_citation_risks: list
      numerical_inconsistencies: list
      page_budget_actions: list
      unverified_estimates: list
      safe_revision_instructions: list
    prompt_template: 'Red-team this draft as a strict Horizon evaluator and proposal
      engineer.

      Find only concrete, actionable defects. Check call coverage, causal

      logic, measurable ambition, evidence/citation fit, partner and

      work-package consistency, person-month and budget contradictions,

      official Tables 3.1a-3.1h, milestones, risks, gender dimension, SSH,

      open science, multi-actor requirements and page density. Confirm

      PESTEL barriers (2.1.3) are never duplicated as implementation risks

      (3.1) and vice versa; confirm every KER (2.2.4) has a distinct owner,

      target users, value proposition and exploitation route; confirm the

      gender-dimension content (1.2.6) addresses research-content

      relevance, not only team or workforce balance. Confirm every official

      numbered subsection heading (1.1.1-1.1.2, 1.2.1-1.2.7, 2.1.1-2.1.3,

      2.2.1-2.2.5, 3.1.1-3.1.3) is present and correctly labelled.


      Assess PAGE FILL explicitly. The target is a full ~44-page proposal

      within a 45-page working estimate. In page_budget_actions, for each

      official subsection state whether it is under-developed, about

      right, or over budget, and give specific, evidence-safe expansions

      for any thin subsection (for example: add a validation-criteria

      table, expand a WP description, add missing risk rows) - never

      invent facts to fill space. Flag any non-official section, any

      content outside Part B, any likely breach of the working page

      estimate, and any misuse of Part A information. This draft

      intentionally never uses "[INPUT NEEDED]" placeholders — where a gap

      was instead filled with a best-supported estimate rather than

      sourced evidence, and that estimate looks weak, implausible, or

      load-bearing for the proposal''s case, list it in

      unverified_estimates (subsection, the specific claim, and why it

      needs a human fact-check) rather than treating the estimate itself

      as a defect. Tag each finding to its owning criterion so it lands in

      the matching *_risks list (excellence_risks, impact_risks,

      implementation_risks) - cross-cutting findings that do not belong to

      one criterion (evidence, numerical, page-budget, unverified

      estimates) go in their own dedicated lists instead.


      DRAFT:

      {{compile_v1.text}}


      CALL COVERAGE:

      {{ inputs.call_coverage }}


      EVIDENCE QA:

      {{inputs.verify_evidence.qa_report}}

      '
- id: revise_excellence
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 20000
    prompt_template: 'Produce the final submission candidate for ONLY the "1. Excellence"

      section (1.1 and 1.2). Apply evaluator and red-team recommendations

      relevant to this section only when they can be resolved from

      supplied content or verified evidence. Improve logic, specificity,

      consistency and evaluator readability.


      Fill this section''s page budget toward a full, evaluator-dense

      1.1+1.2, following the page_budget_actions from the red-team pass

      that apply here. Expand thin passages only with evidence-safe

      content already grounded in the drafts and verified citations. Never

      fabricate a specific partner fact, result, source, KPI, TRL, budget

      or timeline to reach a page count. Where a gap remains, resolve it

      with your own best-supported analysis and write it as a normal,

      confident sentence — never a "[INPUT NEEDED]" placeholder. Keep the

      prose in full paragraphs; do not convert narrative text into bullet

      lists. Keep all valid citation identifiers intact. Preserve every

      `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on

      its own line — never paraphrase, reformat, or drop it. Preserve the

      exact official headings, including 1.1.1/1.1.2. Return only this

      section - do not draft Impact or Implementation.


      SECTION DRAFT:

      {{compile_excellence.raw}}


      INDEPENDENT EVALUATION:

      {{evaluate_v1}}


      RED TEAM (full report - apply only the excellence_risks,

      evidence_and_citation_risks, numerical_inconsistencies and

      page_budget_actions entries relevant to 1.1/1.2):

      {{red_team_v1.parsed}}


      VERIFIED CITATIONS:

      {{inputs.verify_evidence.citation_registry}}

      '
- id: revise_impact
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 12000
    prompt_template: 'Produce the final submission candidate for ONLY the "2. Impact"

      section (2.1, 2.2 and optional 2.3). Apply evaluator and red-team

      recommendations relevant to this section only when they can be

      resolved from supplied content or verified evidence. Improve logic,

      specificity, consistency and evaluator readability.


      Fill this section''s page budget toward a full, evaluator-dense

      2.1+2.2(+2.3), following the page_budget_actions from the red-team

      pass that apply here. Expand thin passages only with evidence-safe

      content already grounded in the drafts and verified citations. Never

      fabricate a specific partner fact, result, source, KPI, TRL, budget

      or timeline to reach a page count. Where a gap remains, resolve it

      with your own best-supported analysis and write it as a normal,

      confident sentence — never a "[INPUT NEEDED]" placeholder. Keep the

      prose in full paragraphs; do not convert narrative text into bullet

      lists. Keep all valid citation identifiers intact. Preserve every

      `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on

      its own line — never paraphrase, reformat, or drop it. Preserve the

      exact official headings, including 2.1.1-2.1.3 and 2.2.1-2.2.5.

      Return only this section - do not draft Excellence or

      Implementation.


      SECTION DRAFT:

      {{compile_impact.raw}}


      INDEPENDENT EVALUATION:

      {{evaluate_v1}}


      RED TEAM (full report - apply only the impact_risks,

      evidence_and_citation_risks, numerical_inconsistencies and

      page_budget_actions entries relevant to 2.1/2.2/2.3):

      {{red_team_v1.parsed}}


      VERIFIED CITATIONS:

      {{inputs.verify_evidence.citation_registry}}

      '
- id: revise_implementation
  type: TransformAgent
  selected_model: auto
  allowed_models:
  - claude-opus-5
  - gpt-5.6-sol
  model_routing:
    accuracy_priority: maximum
  config:
    model: claude-opus-5
    max_tokens: 20000
    prompt_template: 'Produce the final submission candidate for ONLY the

      "3. Implementation" section (3.1 and 3.2). Apply evaluator and

      red-team recommendations relevant to this section only when they can

      be resolved from supplied content or verified evidence. Improve

      logic, specificity, consistency and evaluator readability.


      Fill this section''s page budget toward a full, evaluator-dense

      3.1+3.2, following the page_budget_actions from the red-team pass

      that apply here. Expand thin passages only with evidence-safe

      content already grounded in the drafts and verified citations. Never

      fabricate a specific partner fact, result, source, KPI, TRL, budget

      or timeline to reach a page count. Where a gap remains, resolve it

