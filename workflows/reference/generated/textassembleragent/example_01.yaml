- id: generate_work_responsibilities
  type: TransformAgent
  config:
    mode: ai
    model: claude-sonnet-4-5
    prompt_template: null
    system_prompt: null
    input_fields:
    - name: input_1
      description: ''
      type: string
      value: '{{outputs.understanding_message.parsed.customer_problem}}'
    - name: input_2
      description: ''
      type: string
      value: '{{outputs.understanding_message.parsed.company_action_items}}'
    - name: input_3
      description: ''
      type: string
      value: '{{outputs.understanding_message.parsed.category}}'
    - name: input_4
      description: ''
      type: string
      value: '{{outputs.business_context.text}}'
    instructions: "You are the Responsibility Resolver for an industrial B2B customer-enquiry\
      \ workflow.\n\nYour task is to determine which specialized business responsibilities\
      \ are required to handle a customer enquiry.\n\nYou receive two sources of information:\n\
      \nCUSTOMER CONTEXT\ncategory\ncustomer_problem\ncompany_action_items\nBUSINESS\
      \ CONTEXT\ncustomer state\nquotation state\norder state\nshipment state\nservice-case\
      \ state\nexisting ownership\n\nYour job is ONLY to select one or more responsibilities\
      \ from the controlled responsibility catalogue.\n\nDo not select:\n\ndepartment\n\
      role\nemployee\nteam\nfinal owner\n\nThese are determined downstream.\n\nCore\
      \ decision principle\n\nDetermine responsibility from:\n\nwhat the customer\
      \ wants\n+\nwhat already exists in the business\n\nCompany action items identify\
      \ the work that needs to happen.\n\nBusiness context determines whether that\
      \ work is:\n\nnew;\nalready in progress;\nassociated with an existing record;\n\
      missing a required business record;\nor should continue with an existing process.\n\
      Important rules\nExisting service case\n\nIf:\n\nservice_case.found = true\n\
      AND\nservice_case.status = open\n\nand the customer asks for technical help\
      \ related to that issue:\n\nPrefer:\n\ncontinue_existing_technical_case\n\n\
      instead of:\n\ntechnical_diagnosis\n\nwhen the work is already represented by\
      \ the existing case.\n\nFor a requested service visit with an existing open\
      \ case, prefer:\n\nfield_service_coordination\n\nFor a new request with no service\
      \ case, use:\n\nnew_field_service_request\nExisting quotation\n\nIf the customer\
      \ requests:\n\nrevise_quote\n\nand an existing quotation is found and still\
      \ editable/open:\n\nUse:\n\nquotation_revision\n\nIf the quotation cannot be\
      \ found:\n\nUse:\n\nquotation_identification\n\nIf the quotation is already\
      \ accepted/confirmed and the customer requests a commercial change:\n\nUse:\n\
      \ncommercial_change_review\nNew quotation\n\nIf:\n\ncreate_quote\n\nand the\
      \ customer already exists:\n\nUse:\n\nquotation_management\n\nIf the customer\
      \ does not exist:\n\nUse:\n\nnew_customer_rfq_handling\n\nor, when customer\
      \ creation is independently required:\n\ncustomer_identification_or_creation\n\
      Pump selection\n\nFor:\n\nselect_pump\n\nuse:\n\npump_application_selection\n\
      \nIf the enquiry is specifically a replacement pump:\n\nreplacement_pump_selection\n\
      \nIf quotation work is also requested, return the additional quotation responsibility.\n\
      \nExample:\n\nselect_pump\n+\ncreate_quote\n\nmay return:\n\npump_application_selection\n\
      quotation_management\nOrders\n\nFor:\n\ncheck_order_status\n\nand an order exists:\n\
      \norder_status_information\n\nIf the order cannot be found:\n\norder_identification\n\
      \nFor a new order:\n\nsales_order_processing\n\nIf customer creation/intake\
      \ is required first:\n\ncustomer_creation_and_order_intake\nDelivery and shipment\n\
      \nFor:\n\ncheck_delivery_status\n\nif an actual shipment exists:\n\nshipment_tracking\n\
      \nIf the order exists but no shipment exists yet:\n\ndelivery_schedule_information\n\
      \nIf the customer asks to accelerate delivery:\n\ndelivery_escalation\n\nFor\
      \ a shipment-related problem:\n\ndelivery_issue_investigation\n\nFor a fulfilment/production\
      \ delay before shipment:\n\nfulfilment_delay_investigation\nTechnical support\n\
      \nFor:\n\ndiagnose_problem\n\nwith no relevant open service case:\n\ntechnical_diagnosis\n\
      \nWith an existing relevant open case:\n\ncontinue_existing_technical_case\n\
      Spare parts\n\nFor:\n\nidentify_spare_part\n\nuse:\n\nspare_part_identification\n\
      Warranty\n\nFor:\n\ncheck_warranty\n\nwith no existing case:\n\nwarranty_verification\n\
      \nIf there is an existing service case related to the issue:\n\nwarranty_case_review\n\
      Invoice\n\nFor:\n\ninvestigate_invoice\n\nuse:\n\nbilling_investigation\n\n\
      For:\n\nsend_invoice_copy\n\nuse:\n\ninvoice_document_support\nComplaint\n\n\
      For:\n\nregister_complaint\n\nuse:\n\ncomplaint_management\n\nDo not change\
      \ the responsibility merely because the customer is a key account.\n\nKey-account\
      \ status may affect downstream ownership or notification, not the fundamental\
      \ work being performed.\n\nQuality\n\nFor a product-quality issue use:\n\nproduct_quality_investigation\n\
      Return\n\nFor a return request use:\n\nreturn_authorization\nCommercial terms\n\
      \nFor contract or commercial-term questions use:\n\ncommercial_terms_management\n\
      Customer data\n\nFor customer-account or master-data work use:\n\ncustomer_master_data_management\n\
      Unknown work\n\nIf the enquiry cannot be mapped safely to a controlled responsibility:\n\
      \nmanual_customer_enquiry_triage\n\nNever invent a new responsibility.\n\n5.\
      \ Multiple Responsibilities\n\nA customer enquiry may legitimately require several\
      \ responsibilities.\n\nExample:\n\ncategory: new_pump_quote_or_rfq\n\ncompany_action_items:\n\
      \  - select_pump\n  - create_quote\n\nOutput:\n\n{\n  \"responsibilities\":\
      \ [\n    \"pump_application_selection\",\n    \"quotation_management\"\n  ],\n\
      \  \"reasoning_summary\": \"The customer needs both technical pump selection\
      \ and a commercial quotation.\"\n}\n\nDo not artificially force a multi-action\
      \ enquiry into one responsibility.\n\n6. Example: Existing Technical Case\n\n\
      Input:\n\ncustomer_context:\n  category: technical_support\n\n  customer_problem:\n\
      \    Dura 25 pump is producing substantially less flow than expected.\n\n  company_action_items:\n\
      \    - diagnose_problem\n\nbusiness_context:\n  customer:\n    found: true\n\
      \    customer_id: ACC-1043\n    customer_type: existing\n    key_account: true\n\
      \    account_owner: Markus Weber\n\n  quotation:\n    found: false\n    status:\
      \ null\n\n  order:\n    found: true\n    status: fulfilled\n    confirmed_date:\
      \ 2024-09-18\n\n  shipment:\n    found: true\n    status: delivered\n\n  service_case:\n\
      \    found: true\n    status: open\n    current_owner: Peter Janssen\n\nOutput:\n\
      \n{\n  \"responsibilities\": [\n    \"continue_existing_technical_case\"\n \
      \ ],\n  \"reasoning_summary\": \"The customer requires technical diagnosis and\
      \ a relevant open service case already exists, so the existing technical case\
      \ should be continued.\"\n}\n7. Example: New Technical Problem\n\nInput:\n\n\
      customer_context:\n  category: technical_support\n\n  customer_problem:\n  \
      \  Customer reports abnormal pump vibration.\n\n  company_action_items:\n  \
      \  - diagnose_problem\n\nbusiness_context:\n  customer:\n    found: true\n\n\
      \  quotation:\n    found: false\n    status: null\n\n  order:\n    found: true\n\
      \    status: fulfilled\n    confirmed_date: 2025-04-20\n\n  shipment:\n    found:\
      \ true\n    status: delivered\n\n  service_case:\n    found: false\n    status:\
      \ null\n    current_owner: null\n\nOutput:\n\n{\n  \"responsibilities\": [\n\
      \    \"technical_diagnosis\"\n  ],\n  \"reasoning_summary\": \"The customer\
      \ requires technical diagnosis and there is no existing service case for the\
      \ issue.\"\n}\n8. Example: Delivery Question\n\nInput:\n\ncustomer_context:\n\
      \  category: delivery_or_shipment_enquiry\n\n  customer_problem:\n    Customer\
      \ wants to know when the order will arrive.\n\n  company_action_items:\n   \
      \ - check_delivery_status\n\nbusiness_context:\n  customer:\n    found: true\n\
      \n  quotation:\n    found: true\n    status: accepted\n\n  order:\n    found:\
      \ true\n    status: confirmed\n    confirmed_date: 2026-08-10\n\n  shipment:\n\
      \    found: false\n    status: null\n\n  service_case:\n    found: false\n \
      \   status: null\n    current_owner: null\n\nOutput:\n\n{\n  \"responsibilities\"\
      : [\n    \"delivery_schedule_information\"\n  ],\n  \"reasoning_summary\": \"\
      The order exists but has not yet produced a shipment, so the required work is\
      \ to provide delivery scheduling information.\"\n}\n9. Example: Shipment Tracking\n\
      \nInput:\n\ncustomer_context:\n  category: delivery_or_shipment_enquiry\n\n\
      \  customer_problem:\n    Customer wants the current location of the dispatched\
      \ order.\n\n  company_action_items:\n    - check_delivery_status\n\nbusiness_context:\n\
      \  order:\n    found: true\n    status: dispatched\n\n  shipment:\n    found:\
      \ true\n    status: in_transit\n\nOutput:\n\n{\n  \"responsibilities\": [\n\
      \    \"shipment_tracking\"\n  ],\n  \"reasoning_summary\": \"A shipment already\
      \ exists and is in transit, so the required work is shipment tracking.\"\n}\n\
      10. Example: Pump Selection + Quote\n\nInput:\n\ncustomer_context:\n  category:\
      \ new_pump_quote_or_rfq\n\n  customer_problem:\n    Customer needs a suitable\
      \ pump and quotation for a new application.\n\n  company_action_items:\n   \
      \ - select_pump\n    - create_quote\n\nbusiness_context:\n  customer:\n    found:\
      \ true\n    customer_type: existing\n\n  quotation:\n    found: false\n\nOutput:\n\
      \n{\n  \"responsibilities\": [\n    \"pump_application_selection\",\n    \"\
      quotation_management\"\n  ],\n  \"reasoning_summary\": \"The enquiry requires\
      \ both technical pump selection and creation of a new quotation for an existing\
      \ customer.\"\n}"
    output_fields:
    - name: responsibilities
      type: list
      description: Select every controlled specialized responsibility required to
        handle the customer's requested work. Base the selection on the category,
        company action items, and available business context. Do not select departments,
        roles, or employees.
      required: true
      nullable: false
      enum_values: []
      fields: []
      item_type: enum
      item_enum_values:
      - new_customer_rfq_handling
      - quotation_management
      - quotation_revision
      - quotation_identification
      - commercial_change_review
      - pump_application_selection
      - technical_product_information
      - sales_order_processing
      - customer_creation_and_order_intake
      - order_status_information
      - order_identification
      - delivery_schedule_information
      - shipment_tracking
      - delivery_escalation
      - delivery_issue_investigation
      - fulfilment_delay_investigation
      - technical_diagnosis
      - continue_existing_technical_case
      - new_field_service_request
      - field_service_coordination
      - spare_part_identification
      - replacement_pump_selection
      - replacement_quotation
      - warranty_verification
      - warranty_case_review
      - billing_investigation
      - invoice_document_support
      - payment_and_credit_management
      - product_quality_investigation
      - return_authorization
      - complaint_management
      - commercial_terms_management
      - customer_master_data_management
      - general_customer_support
      - customer_identification_or_creation
      - business_record_identification
      - manual_customer_enquiry_triage
      - reasoning_summary
      minimum: null
      maximum: null
    - name: reasoning_summary
      type: text
      description: Briefly explain which customer request and business facts caused
        the selected responsibilities. Use factual business language, do not mention
        chain-of-thought, probabilities, or internal model reasoning, and explain
        all selected responsibilities when multiple responsibilities apply.
      required: true
      nullable: false
      enum_values: []
      fields: []
      item_type: null
      item_enum_values: []
      minimum: null
      maximum: null
    language: null
    temperature: 0.2
    max_tokens: 16384
    max_retries: 1
    fail_on_error: true
    operations: []
    omit_empty: false
  selected_model: auto
  model_routing:
    accuracy_priority: maximum
    prefer_low_latency: false
- id: responsibilities_to_department_role
  type: DecisionAgent
  config:
    rules:
    - name: Rule 1
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: new_customer_rfq_handling
      then:
      - field: Department
        operation: merge
        value: Sales
      - field: Role
        operation: merge
        value: Inside Sales
    - name: ''
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: quotation_management
      then:
      - field: Department
        operation: merge
        value: Sales
      - field: Role
        operation: merge
        value: Inside Sales
    - name: Rule 3
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: pump_application_selection
      then:
      - field: Department
        operation: merge
        value: Sales Engineering
      - field: Role
        operation: merge
        value: Application Engineer
    - name: Rule 4
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: order_status_information
      then:
      - field: Department
        operation: merge
        value: Customer Service
      - field: Role
        operation: merge
        value: Customer Support Executive
    - name: Rule 5
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: shipment_tracking
      then:
      - field: Department
        operation: merge
        value: Supply Chain
      - field: Role
        operation: merge
        value: Logistics Coordinator
    - name: Rule 6
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: technical_diagnosis
      then:
      - field: Department
        operation: merge
        value: Service
      - field: Role
        operation: merge
        value: Technical Support Engineer
    - name: Rule 7
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: billing_investigation
      then:
      - field: Department
        operation: merge
        value: Finance
      - field: Role
        operation: merge
        value: Accounts Receivable Specialist
    - name: Rule 8
      description: ''
      when:
        operator: and
        conditions:
        - field: outputs.generate_work_responsibilities.parsed.responsibilities
          operator: contains
          value: spare_part_identification
      then:
      - field: Department
        operation: set
        value: Spare Parts and Product Service
      - field: Role
        operation: set
        value: Spare Parts Specialist
    declared_fields: []
