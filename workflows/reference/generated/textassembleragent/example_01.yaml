nodes:
- id: understanding_message
  type: TransformAgent
  config:
    model: claude-sonnet-4-5
    prompt_template: null
    input_fields:
    - name: Subject
      description: The incoming customer enquiry
      type: string
      value: '{{inputs.Subject}}'
    - name: Source
      description: Email, or Message or Contact Form
      type: string
      value: '{{inputs.Source}}'
    instructions: "Use the incoming customer enquiry in Subject and, where relevant,\
      \ its channel in Source. Source indicates whether the enquiry came by Email,\
      \ Message, or Contact Form; do not use the channel to invent information or\
      \ change the customer’s requested outcome.\n\nReturn exactly four logical outputs:\n\
      \n- Category\n- Customer Problem\n- Company Action Item(s)\n- References\n\n\
      Return valid JSON only, using this structure:\n\n{\n  \"category\": \"\",\n\
      \  \"customer_problem\": \"\",\n  \"company_action_items\": [],\n  \"references\"\
      : {}\n}\n\nCategory\n\nSelect exactly one category from this controlled list:\n\
      \n- new_pump_quote_or_rfq\n- existing_quote_enquiry\n- product_selection_or_application\n\
      - product_information\n- new_order_or_purchase\n- existing_order_enquiry\n-\
      \ delivery_or_shipment_enquiry\n- delivery_problem\n- technical_support\n- service_or_repair_request\n\
      - spare_parts_request\n- replacement_pump_request\n- warranty_enquiry\n- invoice_or_billing_enquiry\n\
      - payment_or_credit_enquiry\n- product_quality_issue\n- return_request\n- complaint\n\
      - contract_or_commercial_terms\n- customer_account_or_master_data\n- general_information\n\
      - unknown\n\nDo not create new category names. Use unknown when the message\
      \ cannot reasonably be matched to one controlled category.\n\nChoose the category\
      \ that best describes the customer’s overall situation, not the department or\
      \ role that should handle it. If several situations appear, use the category\
      \ representing the main customer problem; use the more specific problem category\
      \ when one clearly applies. For example, a leaking pump with a request to inspect\
      \ it is service_or_repair_request, even if the customer also asks whether it\
      \ is covered by warranty. Use warranty_enquiry when warranty status or coverage\
      \ is the main subject and no more specific service or repair request is central.\n\
      \nCustomer Problem\n\nDescribe what is happening to the customer in short, simple,\
      \ factual business language. State the customer’s need, issue, or request without\
      \ adding assumptions.\n\nExamples:\n\n- The customer's Dura 35 pump is leaking\
      \ again.\n- The customer's shipment has not arrived.\n- The customer needs a\
      \ pump for a hydrochloric acid application.\n\nDo not describe internal routing,\
      \ departments, roles, or decisions about who should perform the work.\n\nCompany\
      \ Action Item(s)\n\nIdentify every distinct action the customer expects the\
      \ company to perform. Use only these controlled values:\n\n- create_quote\n\
      - revise_quote\n- select_pump\n- provide_product_information\n- check_order_status\n\
      - check_delivery_status\n- expedite_delivery\n- diagnose_problem\n- schedule_service_visit\n\
      - check_warranty\n- investigate_invoice\n- send_invoice_copy\n- identify_spare_part\n\
      - register_complaint\n- manual_review\n\nA message may contain multiple action\
      \ items. List each applicable action once. Do not create new action names or\
      \ determine which department should perform an action.\n\nUse these distinctions\
      \ when they apply:\n\n- Use create_quote for a new quotation or RFQ, including\
      \ when pump selection is also requested.\n- Use revise_quote when the customer\
      \ asks to change or update an existing quotation.\n- Use select_pump when the\
      \ customer needs help choosing a pump for an application.\n- Use provide_product_information\
      \ for a request for product details without a clear request to select a pump.\n\
      - Use check_order_status for the status of an order.\n- Use check_delivery_status\
      \ for the status or expected arrival of a shipment or delivery.\n- Use expedite_delivery\
      \ when the customer asks the company to speed up or prioritize a delivery.\n\
      - Use diagnose_problem when the customer asks what may be wrong with a product\
      \ or system.\n- Use schedule_service_visit when the customer asks for someone\
      \ to inspect, repair, or visit the site.\n- Use check_warranty when the customer\
      \ asks whether a product or problem is covered by warranty.\n- Use investigate_invoice\
      \ for a disputed, incorrect, or unclear invoice.\n- Use send_invoice_copy when\
      \ the customer asks for a copy of an invoice.\n- Use identify_spare_part when\
      \ the customer needs help identifying a spare or replacement part.\n- Use register_complaint\
      \ when the customer is making a complaint and expects it to be formally recorded.\n\
      - Use manual_review when the requested work cannot be mapped to any other controlled\
      \ action.\n\nIf the customer asks for work that cannot be mapped to one of these\
      \ actions, use manual_review rather than inventing an action.\n\nExamples:\n\
      \nCustomer:\n\"Our pump is leaking. Can you check the warranty and send someone\
      \ to inspect it?\"\n\nCompany Action Items:\n- check_warranty\n- schedule_service_visit\n\
      \nCustomer:\n\"We need a pump for hydrochloric acid and would like a quotation.\"\
      \n\nCompany Action Items:\n- select_pump\n- create_quote\n\nReferences\n\nExtract\
      \ useful business references and technical specifications explicitly provided\
      \ by the customer. References may later be used for CRM, ERP, product, service,\
      \ or other database lookups.\n\nInclude only references actually found in the\
      \ customer enquiry. Do not guess, infer unsupported values, calculate engineering\
      \ values, or add missing technical specifications.\n\nBusiness references may\
      \ include:\n\n- customer_name\n- company_name\n- contact_name\n- product_name\n\
      - pump_model\n- product_family\n- serial_number\n- order_number\n- purchase_order_number\n\
      - quotation_number\n- invoice_number\n- shipment_number\n- service_case_number\n\
      - contract_number\n- site_or_location\n- quantity\n\nTechnical specifications\
      \ must also be included in references when explicitly provided. Relevant fields\
      \ include:\n\n- fluid\n- chemical\n- flow_rate\n- pressure\n- temperature\n\
      - viscosity\n- density\n- required_head\n- suction_pressure\n- discharge_pressure\n\
      - differential_pressure\n- solids_content\n- particle_size\n- pipe_size\n- connection_size\n\
      - connection_type\n- motor_power\n- motor_speed\n- voltage\n- frequency\n- pump_speed\n\
      - required_capacity\n- operating_hours\n- duty_cycle\n- material_requirement\n\
      - seal_requirement\n- hose_requirement\n- impeller_requirement\n- hazardous_area_requirement\n\
      - atex_requirement\n- installation_type\n- indoor_or_outdoor\n- existing_pump_model\n\
      - existing_pump_manufacturer\n- existing_pump_performance\n\nYou may use a descriptive\
      \ technical field name when the customer provides an important technical specification\
      \ that does not exactly match these examples. Preserve the customer’s stated\
      \ value and units where available. If a value is described as approximate, current,\
      \ expected, required, or normal, reflect that distinction in the field name\
      \ or value rather than presenting it as a different fact.\n\nExample 1 — New\
      \ Pump RFQ\n\nCustomer Message:\nPlease quote four pumps suitable for hydrochloric\
      \ acid at 60°C.\nWe need approximately 20 m3/h at 5 bar.\n\nOutput:\n{\n  \"\
      category\": \"new_pump_quote_or_rfq\",\n  \"customer_problem\": \"The customer\
      \ needs four pumps for a hydrochloric acid application.\",\n  \"company_action_items\"\
      : [\n    \"select_pump\",\n    \"create_quote\"\n  ],\n  \"references\": {\n\
      \    \"quantity\": 4,\n    \"technical_specifications\": {\n      \"fluid\"\
      : \"hydrochloric acid\",\n      \"temperature\": \"60°C\",\n      \"flow_rate\"\
      : \"20 m3/h\",\n      \"pressure\": \"5 bar\"\n    }\n  }\n}\n\nExample 2 —\
      \ Delivery Enquiry\n\nCustomer Message:\nPO 45882 still hasn't arrived.\nCan\
      \ you tell me when it will be delivered?\n\nOutput:\n{\n  \"category\": \"delivery_or_shipment_enquiry\"\
      ,\n  \"customer_problem\": \"The customer's delivery has not arrived.\",\n \
      \ \"company_action_items\": [\n    \"check_delivery_status\"\n  ],\n  \"references\"\
      : {\n    \"purchase_order_number\": \"45882\"\n  }\n}\n\nExample 3 — Technical\
      \ Support\n\nCustomer Message:\nOur Dura 35, serial D35-8821, is only producing\
      \ 12 m3/h.\nIt normally operates at around 20 m3/h and 4 bar.\nThe fluid is\
      \ sodium hydroxide at approximately 50°C.\nCan you check what may be wrong?\n\
      \nOutput:\n{\n  \"category\": \"technical_support\",\n  \"customer_problem\"\
      : \"The customer's Dura 35 pump is producing significantly less flow than expected.\"\
      ,\n  \"company_action_items\": [\n    \"diagnose_problem\"\n  ],\n  \"references\"\
      : {\n    \"pump_model\": \"Dura 35\",\n    \"serial_number\": \"D35-8821\",\n\
      \    \"technical_specifications\": {\n      \"fluid\": \"sodium hydroxide\"\
      ,\n      \"temperature\": \"50°C\",\n      \"current_flow_rate\": \"12 m3/h\"\
      ,\n      \"expected_flow_rate\": \"20 m3/h\",\n      \"pressure\": \"4 bar\"\
      \n    }\n  }\n}\n\nExample 4 — Warranty + Service\n\nCustomer Message:\nOur\
      \ Dura 35 pump, serial D35-8821, is leaking again.\nCan you check whether it\
      \ is under warranty and arrange someone to inspect it?\n\nOutput:\n{\n  \"category\"\
      : \"service_or_repair_request\",\n  \"customer_problem\": \"The customer's Dura\
      \ 35 pump is leaking again.\",\n  \"company_action_items\": [\n    \"check_warranty\"\
      ,\n    \"schedule_service_visit\"\n  ],\n  \"references\": {\n    \"pump_model\"\
      : \"Dura 35\",\n    \"serial_number\": \"D35-8821\"\n  }\n}\n\nDo not include\
      \ explanatory text outside the JSON output."
