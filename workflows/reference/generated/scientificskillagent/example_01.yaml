      value: '{{ load_concept.text }}'
    - name: scientific_synthesis
      description: Proposal-engineering evidence synthesis, so evidence-safe expansions
        stay grounded.
      type: string
      value: '{{ inputs.scientific_synthesis }}'
    - name: independent_evaluation
      description: The independent evaluation of the compiled proposal.
      type: string
      value: '{{evaluate_v1}}'
    - name: red_team_report
      description: Full red-team report - apply only the implementation_risks, evidence_and_citation_risks,
        numerical_inconsistencies and page_budget_actions entries relevant to 3.1/3.2.
      type: string
      value: '{{red_team_v1.parsed}}'
    - name: verified_citations
      description: Verified citation registry.
      type: string
      value: '{{ inputs.citation_registry }}'
    instructions: 'Produce the final submission candidate for ONLY the "3. Quality
      and

      efficiency of the implementation" section (3.1 and 3.2). Apply the

      evaluator and red-team recommendations relevant to this section only

      when they can be resolved from the supplied draft, blueprint,

      concept note, scientific synthesis, citation registry or evidence

      QA. Improve logic, specificity, consistency and evaluator

      readability. Keep this section faithful to the locked blueprint and

      the actual concept note.


      Fill this section''s page budget toward a full, evaluator-dense

      3.1+3.2, following the page_budget_actions from the red-team pass

      that apply here. Expand thin passages only with evidence-safe

      content already grounded in the draft, blueprint and verified

      evidence. Never fabricate a missing number, partner fact, result,

      source, KPI, TRL, budget or timeline to reach a page count -

      preserve unresolved facts as [INPUT NEEDED: ...]. Keep all valid

      citation identifiers and the official Tables 3.1a-3.1h intact.

      Preserve every `[[IMAGE PROMPT: ...]]` marker exactly as it appears,

      verbatim, on its own line - never paraphrase, reformat, or drop it.

      Preserve the exact official headings. Return only this section - do

      not draft Excellence or Impact.'
- id: final_revision
  type: TextAssemblerAgent
  config:
    separator: '


      '
    parts:
    - '{{revise_excellence.raw}}'
    - '{{revise_impact.raw}}'
    - '{{revise_implementation.raw}}'
- id: evaluate_final
  type: HorizonEvaluationAgent
  config:
    proposal_text: '{{final_revision.text}}'
    generator_model: auto
    evaluator_models:
    - claude-opus-5
    - gpt-5.6-sol
    criterion_threshold: 4.0
    total_threshold: 12.0
- id: submission_gate
  type: ProposalSubmissionGate
  config:
    proposal_text: '{{final_revision.text}}'
    evidence_blockers: '{{ inputs.evidence_blockers }}'
    consistency_gate: '{{inputs.evidence_consistency.gate}}'
    consistency_findings: '{{inputs.evidence_consistency.findings}}'
    evaluation_threshold_passed: '{{evaluate_final.threshold_passed}}'
    evaluation_total_score: '{{evaluate_final.total_score}}'
    evaluation_blockers: '{{evaluate_final.deterministic_blockers}}'
    required_headings:
    - 1.1 Objectives and ambition
    - 1.2 Methodology
    - 2.1 Project's pathways towards impact
    - 2.2 Measures to maximise impact
    - 3.1 Work plan and resources
    - 3.2 Capacity of participants and consortium as a whole
    minimum_proposal_characters: 20000
    require_evaluation_pass: true
    block_on_input_needed: true
- id: submission_readiness_router
  type: RouterAgent
  config:
    mode: rule
    rules:
    - name: READY
      condition: submission_gate.submission_ready == true
    - name: BLOCKED
      default: true
- id: submission_blocked
  type: HumanInLoopAgent
  config:
    question: The proposal failed the deterministic pre-render submission gate. Reject
      this run and return to the relevant earlier stage to close the listed blockers.
      Rendering is deliberately disabled on this branch.
    context_fields:
    - submission_gate.report
    - submission_gate.blockers
    - evaluate_final
    - inputs.evidence_consistency
    allow_document_override: false
    allowed_actions:
    - reject
- id: figure_embedder
  type: FigureEmbedder
  config:
    content: '{{final_revision.text}}'
    figures:
    - marker: Figure 1 - Objective-Result-Outcome-Impact Chain
      image: '{{ inputs.generate_figure_oro_chain }}'
      alt_text: Objective-result-outcome-impact chain diagram
    - marker: Figure 2 - Impact Pathways
      image: '{{ inputs.generate_figure_impact_pathways }}'
      alt_text: Impact pathways diagram
    - marker: Figure 3 - Work Package Structure
      image: '{{ inputs.generate_figure_workplan }}'
      alt_text: Work package structure diagram
    - marker: Figure 4 - Methodology Architecture
      image: '{{ inputs.generate_figure_methodology }}'
      alt_text: Methodology architecture diagram
- id: page_limit_router
  type: RouterAgent
  config:
    mode: rule
    rules:
    - name: PAGE_45
      condition: inputs.proposal_blueprint.hard_page_limit == 45
    - name: PAGE_40
      default: true
- id: render_45_start
  type: Literal
  config:
    value: true
- id: render_40_start
  type: Literal
  config:
    value: true
- id: render_submission_docx_45
  type: HorizonDOCXProposalRenderer
  config:
    content: '{{figure_embedder.content}}'
    content_format: markdown
    metadata: '{{ inputs.metadata }}'
    citation_registry: '{{ inputs.citation_registry }}'
    evidence_qa: '{{ inputs.evidence_qa }}'
    evidence_blockers: '{{inputs.evidence_blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: 45
    enforce_page_limit: true
    enable_footnotes: true
- id: render_submission_pdf_45
  type: HorizonHTMLProposalRenderer
  config:
    content: '{{figure_embedder.content}}'
    content_format: markdown
    metadata: '{{inputs.metadata}}'
    citation_registry: '{{inputs.citation_registry}}'
    evidence_qa: '{{inputs.evidence_qa}}'
    evidence_blockers: '{{inputs.evidence_blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: 45
    enforce_page_limit: true
- id: render_submission_docx_40
  type: HorizonDOCXProposalRenderer
  config:
    content: '{{figure_embedder.content}}'
    content_format: markdown
    metadata: '{{inputs.metadata}}'
    citation_registry: '{{inputs.citation_registry}}'
    evidence_qa: '{{inputs.evidence_qa}}'
    evidence_blockers: '{{inputs.evidence_blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: 40
    enforce_page_limit: true
    enable_footnotes: true
- id: render_submission_pdf_40
  type: HorizonHTMLProposalRenderer
  config:
    content: '{{figure_embedder.content}}'
    content_format: markdown
    metadata: '{{inputs.metadata}}'
    citation_registry: '{{inputs.citation_registry}}'
    evidence_qa: '{{inputs.evidence_qa}}'
    evidence_blockers: '{{inputs.evidence_blockers}}'
    include_toc: false
    include_bibliography: true
    include_evidence_annex: false
    page_limit: 40
    enforce_page_limit: true
- id: approve_submission_package_45
  type: HumanInLoopAgent
  config:
    question: Final release gate for the 45-page profile — inspect the rendered DOCX
      and PDF before treating this proposal as submission-ready. Approve only when
      both renderers report submission_ready, the PDF is within 45 pages, no figure
      is missing or unmatched, no warning affects submission, and the hashes and files
      are present. Reject to revise.
    context_fields:
    - submission_gate.report
    - figure_embedder.embedded_count
    - figure_embedder.unmatched_figures
    - figure_embedder.missing_images
    - render_submission_docx_45
    - render_submission_pdf_45
    allow_document_override: false
    allowed_actions:
    - approve
    - reject
- id: approve_submission_package_40
  type: HumanInLoopAgent
  config:
    question: Final release gate for the 40-page profile — inspect the rendered DOCX
      and PDF before treating this proposal as submission-ready. Approve only when
      both renderers report submission_ready, the PDF is within 40 pages, no figure
      is missing or unmatched, no warning affects submission, and the hashes and files
      are present. Reject to revise.
    context_fields:
    - submission_gate.report
    - figure_embedder.embedded_count
    - figure_embedder.unmatched_figures
    - figure_embedder.missing_images
    - render_submission_docx_40
    - render_submission_pdf_40
    allow_document_override: false
    allowed_actions:
    - approve
    - reject
edges:
- from: load_concept
  to:
  - compile_excellence
  - compile_impact
  - compile_implementation
- from: compile_excellence
  to: compile_v1
- from: compile_impact
  to: compile_v1
- from: compile_implementation
  to: compile_v1
- from: compile_v1
  to:
  - evaluate_v1
  - scientific_peer_review
- from: scientific_peer_review
  to: red_team_v1
- from: evaluate_v1
  to:
  - revise_excellence
  - revise_impact
  - revise_implementation
- from: red_team_v1
  to:
  - revise_excellence
  - revise_impact
  - revise_implementation
- from: revise_excellence
  to: final_revision
- from: revise_impact
  to: final_revision
- from: revise_implementation
  to: final_revision
- from: final_revision
  to: evaluate_final
- from: evaluate_final
  to: submission_gate
- from: submission_gate
  to: submission_readiness_router
- from: submission_readiness_router
  condition: route
  branches:
    READY: figure_embedder
    BLOCKED: submission_blocked
- from: figure_embedder
  to: page_limit_router
- from: page_limit_router
  condition: route
  branches:
    PAGE_45: render_45_start
    PAGE_40: render_40_start
- from: render_45_start
  to:
  - render_submission_docx_45
  - render_submission_pdf_45
- from: render_40_start
  to:
  - render_submission_docx_40
  - render_submission_pdf_40
- from: render_submission_docx_45
  to: approve_submission_package_45
- from: render_submission_pdf_45
  to: approve_submission_package_45
- from: render_submission_docx_40
  to: approve_submission_package_40
- from: render_submission_pdf_40
  to: approve_submission_package_40
entry: load_concept
exit:
- approve_submission_package_45
- approve_submission_package_40
- submission_blocked
output:
  include_input: false
  nodes:
  - node_id: evaluate_final
    flatten: false
  - node_id: submission_gate
    flatten: false
  - node_id: figure_embedder
    flatten: false
  - node_id: render_submission_docx_45
    flatten: false
  - node_id: render_submission_pdf_45
    flatten: false
  - node_id: render_submission_docx_40
    flatten: false
  - node_id: render_submission_pdf_40
    flatten: false
  - node_id: approve_submission_package_45
    flatten: false
  - node_id: approve_submission_package_40
    flatten: false
