name: Reference ScientificSkillAgent 01
description: 'Final stage of the gated Horizon Europe RIA/IA Part B pipeline. The
  six human-approved section drafts (1.1, 1.2, 2.1, 2.2 [+optional 2.3], 3.1, 3.2)
  plus the approved truth graph, locked blueprint, verified evidence and call context
  are supplied directly; this workflow does not re-run discovery, evidence verification
  or drafting. It compiles the drafts into one coherent Part B, runs a K-Dense-guided
  scientific peer review plus an independent evaluation and red-team pass, applies
  a single controlled revision tuned to the authoritative page budget, runs an independent
  final evaluation and deterministic submission gate, splices generated figures into
  the four "[[IMAGE PROMPT: ...]]" markers the drafts stage''s sections were told
  to emit, and renders both an editable DOCX and a submission PDF. The evidence- stage
  graph consistency verdict is reused because proposal domain state is scoped to a
  workflow run. A readiness router blocks rendering when evidence, evaluation, headings
  or placeholders fail. A final human gate inspects the actual DOCX/PDF page counts,
  warnings, figure status and hashes before release.'
version: '5.0'
use_case: eu_proposal
inputs:
  metadata:
    type: json
    required: true
    description: '[LIVE] partb_metadata.parsed - proposal title, acronym, call_id,
      action_type, funding_model, consortium_name, part_label, version. Used by the
      DOCX renderer.'
  citation_registry:
    type: json
    required: true
    description: '[LIVE] verify_evidence.citation_registry - verified citation IDs
      used across the section drafts. Used by final_revision and the renderer bibliography.'
  evidence_qa:
    type: json
    required: true
    description: '[LIVE] verify_evidence.qa_report - evidence QA summary. Used by
      the red-team pass and the renderer.'
  evidence_blockers:
    type: json
    required: true
    description: '[LIVE] verify_evidence.blocking_issues - unresolved evidence blockers.
      Used by the submission gate.'
  verified_claims:
    type: json
    required: false
    description: '[LIVE] verify_evidence.verified_claims - full verified claim records
      (claim -> evidence -> locator -> verification). Given to the red-team pass so
      it can check citation/claim fit precisely.'
  scientific_synthesis:
    type: text
    required: false
    description: '[LIVE] scientific_synthesis.answer - proposal-engineering evidence
      synthesis. Given to final_revision so evidence-safe expansions stay grounded.'
  call_intelligence:
    type: json
    required: false
    description: '[LIVE] call_intelligence.parsed - atomic call checklist (expected
      outcomes, scope, mandatory conditions, evaluation priorities, exclusions, page/format
      rules). Given to compile_v1 and red_team_v1 to check coverage and format rules.'
  call_coverage:
    type: json
    required: true
    description: '[LIVE] call_coverage output - requirement -> section coverage matrix.
      Used by the red-team pass.'
  proposal_blueprint:
    type: json
    required: false
    description: '[LIVE] proposal_blueprint.parsed - the locked single source of truth
      (objective->result->outcome->impact chain, page budget, WP/task/deliverable/KPI/risk
      registers, figure/table plan). Given to compile_v1, red_team_v1 and final_revision
      to keep every section aligned to the frozen model.'
  truth_graph:
    type: json
    required: true
    description: '[GATED] ProposalTruthGraphAgent output approved after evidence review.
      .truth_graph is the only external factual authority for compilation, peer review,
      red-team and revision.'
  evidence_consistency:
    type: json
    required: true
    description: '[GATED] Evidence stage''s ConsistencyChecker output, computed while
      the Proposal Graph is present in workflow domain state.'
  concept_note:
    type: file
    required: true
    multiple: true
    max_files: 5
    accept:
    - pdf
    - document
    - markdown
    - presentation
    description: '[LIVE] The selected project concept note file(s). Loaded and given
      to final_revision so revisions stay faithful to the actual concept, not the
      drafts alone.'
  draft_1_1:
    type: text
    required: true
    description: '[LIVE] draft_1_1_objectives_ambition.raw - Markdown for ''1.1 Objectives
      and ambition''.'
  draft_1_2:
    type: text
    required: true
    description: '[LIVE] draft_1_2_methodology.raw - Markdown for ''1.2 Methodology''.'
  draft_2_1:
    type: text
    required: true
    description: '[LIVE] draft_2_1_pathways.raw - Markdown for ''2.1 Project''s pathways
      towards impact''.'
  draft_2_2_2_3:
    type: text
    required: true
    description: '[LIVE] draft_2_2_measures_and_2_3_summary.raw - Markdown for ''2.2
      Measures to maximise impact'' and optional ''2.3 Summary''.'
  draft_3_1:
    type: text
    required: true
    description: '[LIVE] draft_3_1_workplan_resources.raw - Markdown for ''3.1 Work
      plan and resources'', including Tables 3.1a-3.1h.'
  draft_3_2:
    type: text
    required: true
    description: '[LIVE] draft_3_2_consortium.raw - Markdown for ''3.2 Capacity of
      participants and consortium as a whole''.'
  generate_figure_oro_chain:
    type: json
    required: false
    description: '[LIVE] drafts stage''s generate_figure_oro_chain output ({generated,
      minio_key, content_type, ...}) - embedded in place of the ''Figure 1 - Objective-Result-Outcome-Impact
      Chain'' marker draft_1_1 was told to emit.'
  generate_figure_impact_pathways:
    type: json
    required: false
    description: '[LIVE] drafts stage''s generate_figure_impact_pathways output -
      embedded in place of the ''Figure 2 - Impact Pathways'' marker draft_2_1 was
      told to emit.'
  generate_figure_workplan:
    type: json
    required: false
    description: '[LIVE] drafts stage''s generate_figure_workplan output - embedded
      in place of the ''Figure 3 - Work Package Structure'' marker draft_3_1 was told
      to emit.'
  generate_figure_methodology:
    type: json
    required: false
    description: '[LIVE] drafts stage''s generate_figure_methodology output - embedded
      in place of the ''Figure 4 - Methodology Architecture'' marker draft_1_2 was
      told to emit.'
nodes:
- id: load_concept
  type: WorkflowFileLoader
  config:
    files: '{{inputs.concept_note}}'
    max_chars_per_file: 500000
    fail_on_unreadable: false
- id: compile_excellence
  type: TransformAgent
  selected_model: gpt-5.6-terra
  allowed_models:
  - gpt-5.6-terra
  - gpt-5.6-sol
  - gpt-5
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-terra
    max_tokens: 20000
    input_fields:
    - name: proposal_blueprint
      description: The locked blueprint - single source of truth for objectives, results
        and methodology.
      type: string
      value: '{{ inputs.proposal_blueprint }}'
    - name: truth_graph
      description: The approved truth graph. External factual claims must exist here
        and retain their qualifications. Raw research dossiers are not drafting inputs.
      type: string
      value: '{{ inputs.truth_graph.truth_graph }}'
    - name: call_checklist
      description: The call checklist, used to confirm the official headings and that
        every mandatory requirement is present.
      type: string
      value: '{{ inputs.call_intelligence }}'
    - name: draft_1_1
      description: Draft of section 1.1 Objectives and ambition.
      type: string
      value: '{{ inputs.draft_1_1 }}'
    - name: draft_1_2
      description: Draft of section 1.2 Methodology.
      type: string
      value: '{{ inputs.draft_1_2 }}'
    instructions: 'Assemble the coherent "1. Excellence" section (1.1 and 1.2 only)
      of

      the Horizon Europe Part B Markdown document from the two supplied

      drafts. Do not add Part A, annexes or extra numbered sections.


      Use the locked blueprint as the single source of truth for

      objectives, results and methodology. Use the call checklist to

      confirm the official headings and that every mandatory requirement

      is present.


      Remove duplication between 1.1 and 1.2, align terminology, keep

      every valid citation identifier and every [INPUT NEEDED] marker, and

      add no facts. Preserve every `[[IMAGE PROMPT: ...]]` marker exactly

      as it appears, verbatim, on its own line - never paraphrase,

      reformat, or drop it. Aim for a full, evaluator-dense 1.1+1.2. Start

      with the "# 1. Excellence" heading.'
- id: compile_impact
  type: TransformAgent
  selected_model: gpt-5.6-terra
  allowed_models:
  - gpt-5.6-terra
  - gpt-5.6-sol
  - gpt-5
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-terra
    max_tokens: 12000
    input_fields:
    - name: proposal_blueprint
      description: The locked blueprint - single source of truth for impact pathways
        and KPIs.
      type: string
      value: '{{ inputs.proposal_blueprint }}'
    - name: truth_graph
      description: The approved truth graph. External factual claims must exist here
        and retain their qualifications. Raw research dossiers are not drafting inputs.
      type: string
      value: '{{ inputs.truth_graph.truth_graph }}'
    - name: call_checklist
      description: The call checklist, used to confirm the official headings and that
        every mandatory requirement is present.
      type: string
      value: '{{ inputs.call_intelligence }}'
    - name: draft_2_1
      description: Draft of section 2.1 Project's pathways towards impact.
      type: string
      value: '{{ inputs.draft_2_1 }}'
    - name: draft_2_2_2_3
      description: Draft of section 2.2 Measures to maximise impact and optional 2.3
        Summary.
      type: string
      value: '{{ inputs.draft_2_2_2_3 }}'
    instructions: 'Assemble the coherent "2. Impact" section (2.1, 2.2 and optional
      2.3

      only) of the Horizon Europe Part B Markdown document from the two

      supplied drafts. Do not add Part A, annexes or extra numbered

      sections.


      Use the locked blueprint as the single source of truth for impact

      pathways and KPIs. Use the call checklist to confirm the official

      headings and that every mandatory requirement is present.


      Remove duplication, align terminology, keep every valid citation

      identifier and every [INPUT NEEDED] marker, and add no facts.

      Preserve every `[[IMAGE PROMPT: ...]]` marker exactly as it appears,

      verbatim, on its own line - never paraphrase, reformat, or drop it.

      Aim for a full, evaluator-dense 2.1+2.2(+2.3). Start with the "# 2.

      Impact" heading.'
- id: compile_implementation
  type: TransformAgent
  selected_model: gpt-5.6-terra
  allowed_models:
  - gpt-5.6-terra
  - gpt-5.6-sol
  - gpt-5
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-terra
    max_tokens: 20000
    input_fields:
    - name: proposal_blueprint
      description: The locked blueprint - every WP, task, deliverable, milestone,
        KPI, risk and partner must agree with it.
      type: string
      value: '{{ inputs.proposal_blueprint }}'
    - name: truth_graph
      description: The approved truth graph. External factual claims must exist here
        and retain their qualifications. Raw research dossiers are not drafting inputs.
      type: string
      value: '{{ inputs.truth_graph.truth_graph }}'
    - name: call_checklist
      description: The call checklist, used to confirm the official headings and that
        every mandatory requirement is present.
      type: string
      value: '{{ inputs.call_intelligence }}'
    - name: draft_3_1
      description: Draft of section 3.1 Work plan and resources, including Tables
        3.1a-3.1h.
      type: string
      value: '{{ inputs.draft_3_1 }}'
    - name: draft_3_2
      description: Draft of section 3.2 Capacity of participants and consortium as
        a whole.
      type: string
      value: '{{ inputs.draft_3_2 }}'
    instructions: 'Assemble the coherent "3. Quality and efficiency of the

      implementation" section (3.1 and 3.2 only) of the Horizon Europe

      Part B Markdown document from the two supplied drafts. Do not add

      Part A, annexes or extra numbered sections.


      Use the locked blueprint as the single source of truth: every WP,

      task, deliverable, milestone, KPI, risk and partner must agree with

      it. Use the call checklist to confirm the official headings and

      that every mandatory requirement is present.


      Remove duplication, align WPs/tasks/deliverables/milestones/risks/

      KPIs/partners, keep every valid citation identifier, every [INPUT

      NEEDED] marker and the official Tables 3.1a-3.1h as plain text

      tables, and add no facts. Preserve every `[[IMAGE PROMPT: ...]]`

      marker exactly as it appears, verbatim, on its own line - never

      paraphrase, reformat, or drop it. Aim for a full, evaluator-dense

      3.1+3.2. Start with the "# 3. Quality and efficiency of the

      implementation" heading.'
- id: compile_v1
  type: TextAssemblerAgent
  config:
    separator: '


      '
    parts:
    - '{{compile_excellence.raw}}'
    - '{{compile_impact.raw}}'
    - '{{compile_implementation.raw}}'
- id: scientific_peer_review
  type: ScientificSkillAgent
  selected_model: gpt-5.6-sol
  allowed_models:
  - gpt-5.6-sol
  - gpt-5.6-terra
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-sol
    skills:
    - peer-review
    - scientific-critical-thinking
    - research-grants
    - scientific-writing
    auto_select: false
    max_skills: 4
    temperature: 0.0
    max_tokens: 12000
    system_prompt: Act as a skeptical scientific peer reviewer of a Horizon Europe
      Part B proposal. Check whether the draft overstates evidence, ignores contradictory
      findings, confuses correlation with causation, omits validation or uncertainty,
      or makes claims outside the approved truth graph. Produce actionable review
      findings only. Do not rewrite the proposal and do not introduce new facts or
      citations.
    objective: 'Review the compiled proposal against the approved truth graph,

      verified claim records, call checklist, and evidence QA. For every

      issue, cite the Part B subsection and distinguish a scientific defect,

      a missing input, an unsupported statement, or a presentation issue.

      Preserve project commitments but flag them when they are presented as

      externally validated facts.


      COMPILED PROPOSAL:

      {{compile_v1.text}}


      APPROVED TRUTH GRAPH:

      {{ inputs.truth_graph.truth_graph }}


      VERIFIED CLAIM RECORDS:

      {{ inputs.verified_claims }}


      CALL CHECKLIST:

      {{ inputs.call_intelligence }}


      EVIDENCE QA:

      {{ inputs.evidence_qa }}

      '
- id: evaluate_v1
  type: HorizonEvaluationAgent
  config:
    proposal_text: '{{compile_v1.text}}'
    generator_model: auto
    evaluator_models:
    - claude-opus-5
    - gpt-5.6-sol
    criterion_threshold: 4.0
    total_threshold: 12.0
- id: red_team_v1
  type: TransformAgent
  selected_model: gpt-5.6-sol
  allowed_models:
  - gpt-5.6-sol
  - gpt-5.6-terra
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-sol
    max_tokens: 12000
    input_fields:
    - name: compiled_draft
      description: The compiled Part B draft to red-team.
      type: string
      value: '{{compile_v1.text}}'
    - name: proposal_blueprint
      description: The locked blueprint - source of truth for WPs, tasks, deliverables,
        milestones, KPIs, risks and partners.
      type: string
      value: '{{ inputs.proposal_blueprint }}'
    - name: truth_graph
      description: The approved truth graph.
      type: string
      value: '{{ inputs.truth_graph.truth_graph }}'
    - name: scientific_peer_review
      description: The K-Dense-guided scientific peer review findings.
      type: string
      value: '{{scientific_peer_review.answer}}'
    - name: call_checklist
      description: The call checklist.
      type: string
      value: '{{ inputs.call_intelligence }}'
    - name: call_coverage
      description: Requirement -> section coverage matrix.
      type: string
      value: '{{ inputs.call_coverage }}'
    - name: verified_claims
      description: Verified claim records (claim -> evidence -> locator -> verification).
      type: string
      value: '{{ inputs.verified_claims }}'
    - name: evidence_qa
      description: Evidence QA summary.
      type: string
      value: '{{ inputs.evidence_qa }}'
    instructions: 'Red-team this compiled Part B draft as a strict Horizon evaluator
      and

      proposal engineer. Find only concrete, actionable defects. Check call

      coverage against the coverage matrix, causal logic, measurable ambition,

      evidence/citation fit against the verified claim records, partner and

      work-package consistency against the blueprint, person-month and budget

      contradictions, official Tables 3.1a-3.1h, milestones, risks, gender

      dimension, SSH, open science and multi-actor requirements.


      Also assess PAGE FILL explicitly. The target is a full ~44-page proposal

      within a 45-page hard limit. Never invent facts to fill space. A

      missing fact is a blocker or input request, not permission to invent.

      Tag each finding to its owning criterion so it lands in the matching

      *_risks list - cross-cutting findings that do not belong to one

      criterion (evidence, numerical, page-budget) go in their own

      dedicated lists instead. The field descriptions below define exactly

      what each output list should contain.'
    output_fields:
    - name: blocking_gaps
      type: list
      item_type: string
      description: Concrete, actionable blockers - missing required facts or content
        that must be resolved before submission. A missing fact is a blocker or input
        request, not permission to invent.
    - name: excellence_risks
      type: list
      item_type: string
      description: Findings tagged to the Excellence criterion (1.1/1.2). Confirm
        the gender-dimension content (1.2.6) addresses research-content relevance,
        not only team or workforce balance.
    - name: impact_risks
      type: list
      item_type: string
      description: Findings tagged to the Impact criterion (2.1/2.2/2.3). Confirm
        PESTEL barriers (2.1.3) are never duplicated as implementation risks (3.1)
        and vice versa; confirm every KER (2.2.4) has a distinct owner, target users,
        value proposition and exploitation route.
    - name: implementation_risks
      type: list
      item_type: string
      description: 'Findings tagged to the Implementation criterion (3.1/3.2): work-package/task/deliverable/milestone/risk/KPI/partner
        consistency against the blueprint, person-month and budget contradictions,
        and the official Tables 3.1a-3.1h. Confirm PESTEL barriers (2.1.3) are never
        duplicated here as implementation risks.'
    - name: evidence_and_citation_risks
      type: list
      item_type: string
      description: Cross-cutting evidence/citation-fit findings against the verified
        claim records that do not belong to one criterion.
    - name: numerical_inconsistencies
      type: list
      item_type: string
      description: Cross-cutting numerical contradictions (e.g. person-months vs budget,
        KPI figures) that do not belong to one criterion.
    - name: page_budget_actions
      type: list
      item_type: string
      description: 'For each official subsection, whether it is under-developed, about
        right, or over the ~44-page target within the 45-page hard limit, with specific,
        evidence-safe expansions for any subsection that is thin (for example: add
        a validation-criteria table, expand a WP description, add missing risk rows)
        - never invent facts to fill space. Also flags any non-official section, any
        content outside Part B, any likely breach of the 45-page limit, and any misuse
        of Part A information.'
    - name: safe_revision_instructions
      type: list
      item_type: string
      description: Concrete, evidence-safe instructions the downstream per-criterion
        revision stages (revise_excellence/revise_impact/ revise_implementation) can
        apply directly to fix a finding without fabricating facts.
- id: revise_excellence
  type: TransformAgent
  selected_model: gpt-5.6-sol
  allowed_models:
  - gpt-5.6-sol
  - gpt-5.6-terra
  - gpt-5
  model_routing:
    accuracy_priority: maximum
  config:
    model: gpt-5.6-sol
    max_tokens: 20000
    input_fields:
    - name: section_draft
      description: Compiled draft of the Excellence section (1.1+1.2) to revise.
      type: string
      value: '{{compile_excellence.raw}}'
    - name: proposal_blueprint
      description: The locked blueprint.
      type: string
      value: '{{ inputs.proposal_blueprint }}'
    - name: truth_graph
      description: The approved truth graph.
      type: string
