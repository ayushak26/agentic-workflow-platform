    - name: scientific_synthesis
      description: Proposal-engineering evidence synthesis, so evidence-safe expansions
        stay grounded.
      type: string
      value: '{{ inputs.scientific_synthesis }}'
    - name: independent_evaluation
      description: The independent evaluation of the compiled proposal.
      type: string
      value: '{{evaluate_v1}}'
    - name: red_team_report
      description: Full red-team report - apply only the excellence_risks, evidence_and_citation_risks,
        numerical_inconsistencies and page_budget_actions entries relevant to 1.1/1.2.
      type: string
      value: '{{red_team_v1.parsed}}'
    - name: verified_citations
      description: Verified citation registry.
      type: string
      value: '{{ inputs.citation_registry }}'
    instructions: 'Produce the final submission candidate for ONLY the "1. Excellence"

      section (1.1 and 1.2). Apply the evaluator and red-team

      recommendations relevant to this section only when they can be

      resolved from the supplied draft, blueprint, concept note,

      scientific synthesis, citation registry or evidence QA. Improve

      logic, specificity, consistency and evaluator readability. Keep this

      section faithful to the locked blueprint and the actual concept note.


      Fill this section''s page budget toward a full, evaluator-dense

      1.1+1.2, following the page_budget_actions from the red-team pass

      that apply here. Expand thin passages only with evidence-safe

      content already grounded in the draft, blueprint and verified

      evidence. Never fabricate a missing number, partner fact, result,

      source, KPI, TRL, budget or timeline to reach a page count -

      preserve unresolved facts as [INPUT NEEDED: ...]. Keep all valid

      citation identifiers intact. Preserve every `[[IMAGE PROMPT: ...]]`

      marker exactly as it appears, verbatim, on its own line - never

      paraphrase, reformat, or drop it. Preserve the exact official

      headings. Return only this section - do not draft Impact or

      Implementation.'
