name: Horizon Europe Part B - Evidence-Gated Submission Pipeline
description: >-
  Canonical three-stage Horizon Europe RIA/IA Part B pipeline. Each stage is
  independently inspectable, retryable and manually advanced: Stage 1 curates
  and verifies evidence, freezes the concept and Method Cards, closes project
  inputs, and locks the blueprint; Stage 2 creates the six official subsection
  drafts and four grounded figures; Stage 3 compiles, peer-reviews, evaluates,
  revises, verifies, and renders the submission DOCX and PDF. Completing a
  stage never starts the next stage automatically. Raw Deep Research and
  PaperQA2 output remain candidate analysis; only exact-passage-verified claims
  in the approved truth graph may support proposal drafting.
version: "3.0"

inputs:
  concept_note:
    type: file
    description: >-
      The selected project concept note. Research may test its assumptions but
      cannot silently replace its approved project direction.
    required: true
    multiple: true
    max_files: 5
    accept: [pdf, document, markdown, presentation]
  documents:
    type: file
    description: >-
      Official call/topic text, downloaded Part B template, consortium and
      partner profiles, work plan, budget, pilot facts, prior research,
      technical material, datasets and proposal guidance. Stage 1 must resolve
      these into approved structured facts before section drafting starts.
    required: true
    multiple: true
    max_files: 20
    accept: [pdf, document, markdown, presentation, spreadsheet]
  supporting_image:
    type: file
    description: >-
      Optional proposal-relevant diagram, scan, certificate, organisation
      chart or other single image requiring separate visual analysis.
    required: false
    multiple: false
    accept: [image]

stages:
  - id: evidence
    workflow: horizon_partb_evidence
    description: >-
      Approve the call interpretation; build the Proposal Graph; run bounded
      Deep Research and scholarly discovery; acquire immutable source versions;
      use PaperQA2 for candidate literature understanding; verify exact
      passages; enforce evidence readiness; freeze one concept; approve Method
      Cards; lock the blueprint; and pass graph consistency. Five human gates
      are inside this stage. After it completes, inspect all outputs in Run
      History and explicitly advance only when the locked blueprint is final.
    # concept_note, documents and supporting_image auto-match pipeline inputs.

  - id: drafts
    workflow: horizon_partb_drafts
    description: >-
      Draft the six official Part B subsections and generate four grounded
      figures in parallel from the approved drafting package. Raw uploaded
      documents, Deep Research dossiers and PaperQA2 prose are deliberately
      unavailable to section writers. A final human gate presents the complete
      draft packet. Inspect it, then explicitly advance to document production.
    # proposal_blueprint, verify_evidence, truth_graph, call_intelligence and
    # methodology_engineering auto-match Stage 1 node outputs by name.

  - id: document
    workflow: horizon_partb_drafts_to_docx
    description: >-
      Compile by Horizon criterion, run scientific peer review, independent
      evaluation and red-team review, apply one controlled revision, enforce
      deterministic release rules, embed figures, and render both editable
      DOCX and submission PDF. The stage finishes only after a human reviews
      the actual rendered files, page counts, warnings and figure status.
    inputs:
      metadata: "{{evidence.partb_metadata.parsed}}"
      citation_registry: "{{evidence.verify_evidence.citation_registry}}"
      evidence_qa: "{{evidence.verify_evidence.qa_report}}"
      evidence_blockers: "{{evidence.verify_evidence.blocking_issues}}"
      verified_claims: "{{evidence.verify_evidence.verified_claims}}"
      scientific_synthesis: "{{evidence.verify_evidence.proposal_ready_cited_markdown}}"
      evidence_consistency: "{{evidence.evidence_consistency}}"
      draft_1_1: "{{drafts.draft_1_1_objectives_ambition.raw}}"
      draft_1_2: "{{drafts.draft_1_2_methodology.raw}}"
      draft_2_1: "{{drafts.draft_2_1_pathways.raw}}"
      draft_2_2_2_3: "{{drafts.draft_2_2_measures_and_2_3_summary.raw}}"
      draft_3_1: "{{drafts.draft_3_1_workplan_resources.raw}}"
      draft_3_2: "{{drafts.draft_3_2_consortium.raw}}"
    # call_intelligence, call_coverage, proposal_blueprint, truth_graph and all
    # four generate_figure_* outputs auto-match earlier node outputs. The
    # concept_note auto-matches the pipeline-level file input.
