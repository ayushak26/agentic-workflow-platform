name: Post-Call Follow-up & CRM Sync
description: >-
  Logs interaction details immediately after a sales call finishes: extracts
  action items and a summary from the call transcript, then routes the
  structured output to a human who updates CRM pipeline status and schedules
  follow-up tasks. IMPORTANT LIMITATIONS: (1) This platform has no
  speech-to-text/audio-transcription node, so this workflow does NOT ingest
  raw call audio or video — it assumes the call has ALREADY been transcribed
  to text by an external call tool (e.g. Zoom, Gong, Otter) and takes that
  transcript as a text/document file input. (2) This platform has no CRM
  integration node (no Salesforce/HubSpot/etc. API sync), so the final step
  is NOT an automated CRM write — it is a HumanInLoopAgent explicitly
  labeled as a manual step where a human reviews the extracted summary and
  action items and copies them into the CRM themselves, marking the task
  approved once the CRM has been updated and follow-up tasks scheduled.
version: "1.0"
use_case: sales_ops

inputs:
  call_transcript:
    type: file
    description: >-
      Plain-text or document transcript of a completed sales call, already
      produced by an external transcription tool. Raw audio/video is not
      supported by this workflow.
    required: true
    multiple: false
    accept: [document, markdown, pdf]

nodes:
  - id: load_transcript_file
    type: WorkflowFileLoader
    config:
      files: "{{inputs.call_transcript}}"
      max_chars_per_file: 200000
      fail_on_unreadable: true

  - id: extract_action_items_and_summary
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      system_prompt: >-
        You are a sales operations assistant. Read a sales call transcript
        and produce a concise, CRM-ready summary: what was discussed, the
        prospect's current pipeline stage/sentiment, concrete action items
        with owners, and recommended follow-up tasks with suggested due
        dates. Be factual and only use information present in the
        transcript.
      prompt_template: >-
        Sales call transcript:

        {{load_transcript_file.text}}


        Extract the following as structured fields:

        - call_summary: a short paragraph summarizing the call.

        - pipeline_stage_update: the recommended CRM pipeline stage/status
          based on this call (e.g. "Discovery", "Proposal Sent",
          "Negotiation", "Closed Won", "Closed Lost"), with a one-sentence
          rationale.

        - action_items: a bullet list of concrete action items mentioned or
          implied, each with an owner if known.

        - follow_up_tasks: a bullet list of follow-up tasks to schedule,
          each with a suggested due date or timeframe (e.g. "in 3 days",
          "next Monday").
      output_schema:
        call_summary: str
        pipeline_stage_update: str
        action_items: list
        follow_up_tasks: list
      temperature: 0.2
      max_tokens: 4096

  - id: human_review_and_sync_to_crm
    type: HumanInLoopAgent
    config:
      question: >-
        MANUAL CRM SYNC STEP: Review the extracted call summary, pipeline
        stage recommendation, action items, and follow-up tasks below. Copy
        this information into the CRM yourself (this platform does not sync
        to any CRM automatically), update the pipeline status, and create
        the follow-up tasks. Edit the content first if anything needs
        correcting, then approve once the CRM has been updated.
      context_fields:
        - extract_action_items_and_summary.parsed
      editable_content_field: extract_action_items_and_summary.parsed
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
        - edit

edges:
  - from: load_transcript_file
    to: extract_action_items_and_summary
  - from: extract_action_items_and_summary
    to: human_review_and_sync_to_crm

entry: load_transcript_file
exit: human_review_and_sync_to_crm
