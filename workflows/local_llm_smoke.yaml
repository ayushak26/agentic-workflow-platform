name: local_llm_smoke
description: Verify Kimi K3 local routing and structured output.
version: "1.0"
use_case: platform_validation

inputs:
  prompt:
    type: text
    description: Short test instruction.
    required: true

nodes:
  - id: kimi_draft
    type: TransformAgent
    config:
      model: local-kimi-k3
      system_prompt: >-
        Respond concisely. State that you are the locally routed Kimi K3
        workflow step. Do not invent external evidence.
      prompt_template: "{{inputs.prompt}}"
      temperature: 0.0

entry: kimi_draft
exit: kimi_draft

output:
  include_input: false
  nodes:
    - node_id: kimi_draft
      flatten: false