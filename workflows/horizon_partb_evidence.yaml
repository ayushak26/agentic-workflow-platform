name: Horizon Europe Part B - Evidence (Stage 1 of 3)
description: >-
  First stage of the staged Horizon Europe RIA/IA Part B pipeline (evidence ->
  drafts -> document; see workflows/pipelines/pipeline.yaml).
  Converts a concept note and supporting documents into: renderer metadata, an
  atomic call checklist, a normalised source graph, bounded scientific
  research dossiers, immutable source versions, citation-grounded verified
  claims, an integrity-stamped proposal truth graph, an audit record, a
  call-coverage matrix, and the locked master blueprint every later section
  is drafted against. Raw research is never drafting authority. Produces no
  proposal prose itself.
version: "4.0"
use_case: eu_proposal

inputs:
  concept_note:
    type: file
    description: The selected project concept note. This is the concept to develop; the workflow does not replace it with alternative concepts.
    required: true
    multiple: true
    max_files: 5
    accept: [pdf, document, markdown, presentation]
  documents:
    type: file
    description: >-
      Supporting proposal documents in any mixture: official call/topic text,
      the downloaded Part B template, consortium profiles, work plan, budget,
      pilot information, prior research, technical material, and guidance.
    required: true
    multiple: true
    max_files: 20
    accept: [pdf, document, markdown, presentation, spreadsheet]
  supporting_image:
    type: file
    description: >-
      Optional single image worth understanding on its own — a diagram,
      scanned certificate/letter of support, org chart, or photo a partner
      supplied outside the main documents. Leave empty if none applies;
      nothing downstream depends on it being present.
    required: false
    multiple: false
    accept: [image]

nodes:
  - id: load_concept
    type: WorkflowFileLoader
    config:
      files: "{{inputs.concept_note}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: load_documents
    type: WorkflowFileLoader
    config:
      files: "{{inputs.documents}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: understand_supporting_image
    type: KimiVisionAgent
    config:
      image: "{{inputs.supporting_image}}"
      prompt: >-
        Describe this image and extract anything relevant to a Horizon Europe
        Part B proposal: diagrams (architecture, methodology, work packages),
        organisation charts, data/results visualisations, certificates,
        letters of support, or similar. Separate what you observe directly
        from any inference. If the image carries no proposal-relevant
        information, say so plainly.
      vision_model: kimi-k3

  - id: partb_metadata
    type: TransformAgent
    selected_model: gpt-5-mini
    allowed_models:
      - gpt-5-mini
      - gpt-5.6-luna
      - gpt-4o-mini
      - gpt-5.6-terra
      - gpt-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: economy
      prefer_low_latency: true
      quality_scores:
        gpt-5-mini: 0.95
        gpt-5.6-luna: 0.90
        gpt-4o-mini: 0.85
        gpt-5.6-terra: 0.70
        gpt-5: 0.60
        gpt-5.6-sol: 0.25
    config:
      model: gpt-5-mini
      max_tokens: 4000
      output_schema:
        proposal_title: str
        acronym: str
        call_id: str
        action_type: str
        funding_model: str
        consortium_name: str
        part_label: str
        version: str
        unresolved_metadata: list
      prompt_template: |
        Extract renderer metadata from the concept note and supporting
        documents. Use only explicit facts. Use an empty string for an unknown
        display field and list the exact missing item in unresolved_metadata.
        part_label must be "Part B – Technical Description". Do not invent a
        title, acronym, call identifier, action type, consortium or version.

        CONCEPT NOTE:
        {{load_concept.text}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: call_intelligence
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-5
      - gpt-5-mini
    model_routing:
      accuracy_priority: balanced
    config:
      model: gpt-5.6-terra
      max_tokens: 12000
      output_schema:
        call_identity: object
        expected_outcomes: list
        scope_requirements: list
        mandatory_conditions: list
        evaluation_priorities: list
        exclusions: list
        page_and_format_rules: object
        unresolved_call_questions: list
      prompt_template: |
        Identify the authoritative call/topic and template material within the
        supporting documents, then extract an atomic, traceable Horizon Europe
        checklist. Separate expected outcomes, scope, admissibility or
        eligibility conditions, evaluator priorities, exclusions, and
        page/format rules. Label the source and locator for every requirement.
        Do not treat concept-note claims or partner documents as call rules.
        Put absent or ambiguous authoritative information in
        unresolved_call_questions. For a lump-sum RIA/IA, apply 45 pages only
        when the supplied official template or topic conditions support it.

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: normalise_source_graph
    type: GraphNormalizer
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 32000
      concept_note: |
        CONCEPT NOTE:
        {{load_concept.text}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}
      call_facts: |
        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

        ATOMIC CALL CHECKLIST:
        {{call_intelligence.parsed}}

  - id: approve_call_interpretation
    type: HumanInLoopAgent
    config:
      question: >-
        Human Gate 1 — review the parsed call interpretation and the
        normalised claim/requirement graph before any research budget is
        spent. Edit call_intelligence's parsed checklist below if it
        misreads the call; this is the highest-authority source for
        everything that follows.
      context_fields:
        - call_intelligence.parsed
        - normalise_source_graph.report
        - normalise_source_graph.warnings
      editable_content_field: call_intelligence.parsed
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
        - edit

  - id: research_plan
    type: ScientificResearchPlannerAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      call_context: "{{call_intelligence.parsed}}"
      concept_context: "{{load_concept.text}}"
      max_briefs: 8
      max_total_tool_calls: 72
      standard_tool_calls: 7
      critical_tool_calls: 11
      standard_research_model: gpt-5.6-sol
      critical_research_model: gpt-5.6-sol
      max_skills_per_brief: 4

  - id: deep_research
    type: BoundedDeepResearchAgent
    config:
      research_briefs: "{{research_plan.research_briefs}}"
      max_jobs: 8
      max_parallel_jobs: 2
      max_total_tool_calls: 72
      max_tool_calls_per_job: 16
      max_citations_per_brief: 20
      max_candidates_per_claim: 12
      max_duration_seconds: 1800
      max_iterations: 15
      max_cost_per_call_usd: 15

  - id: discover_candidates
    type: ScholarlyCandidateDiscoveryAgent
    selected_model: gpt-5.6-luna
    allowed_models:
      - gpt-5.6-luna
      - gpt-5.6-terra
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: balanced
      prefer_low_latency: true
    config:
      model: gpt-5.6-luna
      max_results_per_source: 3
      max_candidates_per_claim: 10
      max_claims: 30
      claim_types: [state_of_art, problem, impact, method]
      require_contradiction_search: true

  - id: acquire_research_sources
    type: ResearchSourceAcquirer
    config:
      candidates:
        - "{{deep_research.candidates}}"
        - "{{discover_candidates.candidates}}"
      max_concurrent_requests: 6
      max_sources_per_claim: 4
      max_total_sources: 60
      request_timeout_seconds: 45
      max_redirects: 4
      fail_when_none_acquired: false

  - id: synthesize_literature
    type: PaperQAEvidenceSynthesizerAgent
    config:
      documents: "{{acquire_research_sources.documents}}"
      llm_model: gpt-4o-2024-11-20
      summary_llm_model: gpt-4o-2024-11-20
      embedding_model: text-embedding-3-small
      evidence_k: 10
      max_claims: 15
      max_documents_per_claim: 12

  - id: verify_evidence
    type: ProposalEvidenceFactoryAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      candidates:
        - "{{deep_research.candidates}}"
        - "{{discover_candidates.candidates}}"
      documents: "{{acquire_research_sources.documents}}"
      search_audit:
        - "{{deep_research.search_audit}}"
        - "{{discover_candidates.search_audit}}"
      rejected_candidates: "{{acquire_research_sources.rejected_candidates}}"
      max_passages_per_document: 10

  - id: truth_graph
    type: ProposalTruthGraphAgent
    config:
      verified_claims: "{{verify_evidence.verified_claims}}"
      evidence_gaps: "{{verify_evidence.evidence_gaps}}"
      blocking_issues: "{{verify_evidence.blocking_issues}}"
      research_manifest: "{{deep_research.research_manifest}}"

  - id: call_coverage
    type: CallCoverageMatrixAgent
    config: {}

  - id: approve_evidence_report
    type: HumanInLoopAgent
    config:
      question: >-
        Human Gate 2 — review verified evidence, unresolved gaps, and call
        coverage before concept development begins. Only claims verified
        here become drafting authority; approve, reject, or request changes
        before the concept-evolution stage spends any further budget.
      context_fields:
        - truth_graph.truth_graph
        - truth_graph.human_review_queue
        - verify_evidence.qa_report
        - verify_evidence.evidence_gaps
        - call_coverage
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
        - edit

  - id: concept_evolution
    type: ConceptAlternativesAgent
    selected_model: claude-opus-5
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
      - gpt-5.6-terra
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      judge_model: claude-opus-5
      concept_note: "{{load_concept.text}}"

  - id: select_concept
    type: HumanInLoopAgent
    config:
      question: >-
        Human Gate 3 — select and freeze ONE of the three independently
        generated, scored, and adversarially-judged concepts (conservative,
        balanced, ambitious). recommended_concept_id below defaults to the
        highest composite_score; edit it to a different alternative's id to
        override the recommendation. Review each alternative's critique
        before deciding.
      context_fields:
        - concept_evolution.alternatives
      editable_content_field: concept_evolution.recommended_concept_id
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
        - edit

  - id: freeze_concept
    type: ConceptFreezeAgent
    config:
      alternatives: "{{concept_evolution.alternatives}}"
      selected_concept_id: "{{select_concept.content.text}}"

  - id: methodology_engineering
    type: MethodologyEngineeringAgent
    selected_model: claude-opus-5
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
      - gpt-5.6-terra
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      research_briefs: "{{research_plan.research_briefs}}"
      selected_concept: "{{freeze_concept.selected_concept}}"
      max_objectives: 10
      max_skills_per_card: 2

  - id: approve_methodology
    type: HumanInLoopAgent
    config:
      question: >-
        Human Gate 4 — approve the proposed Method Cards (method, baseline
        or comparator, validation, uncertainty handling, failure condition)
        before proposal engineering begins. Edit any card below directly if
        a method needs correcting.
      context_fields:
        - methodology_engineering.method_cards
      editable_content_field: methodology_engineering.method_cards
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
        - edit

  - id: research_documentation
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 16000
      output_schema:
        cited_sources: list
        bibliography_formatted: str
        bounded_research_dossiers: list
        candidate_sources_considered: list
        citation_coverage_summary: object
        literature_synthesis_notes: list
      prompt_template: |
        Produce a standalone, audit-ready research-documentation record for
        this proposal run. This is not proposal text — it is the evidence
        paper trail: every bounded research question, skill bundle, cited
        source, verification result, qualification, rejection, and unresolved
        gap. Never invent a source, URL, DOI, or detail not present in the
        supplied records. A Deep Research dossier is candidate analysis, not
        verified evidence.

        cited_sources: one entry per citation ID in the verified citation
        registry — id, title, authors (if known), year, source type
        (official/peer_reviewed/standard/dataset/project/market/partner),
        URL or DOI, exact locator used, verification status, and the exact
        Part B subsection(s) it supports. Use [UNKNOWN] for any missing
        bibliographic field rather than guessing.

        bibliography_formatted: a clean, numbered reference list built only
        from cited_sources, ready to paste into an evidence annex.

        bounded_research_dossiers: one entry per research brief — brief ID,
        track, question, selected K-Dense Scientific Agent Skills, Deep
        Research model, maximum and actual tool calls, source count, and
        whether acquisition and verification produced usable evidence.
        Summarise limitations without copying dossier assertions into the
        proposal truth graph.

        candidate_sources_considered: discovery candidates that were found
        but never promoted to verified evidence, each with a rejection
        reason (unverified, contradicted, superseded, off-topic, duplicate).
        If more than ~40 candidates were considered, group by rejection
        reason with representative examples instead of listing every one.

        citation_coverage_summary: counts of candidates discovered,
        acquired in full text, verified, cited in the final citation
        registry, rejected, qualified, contradicted, excluded from the truth
        graph, and left for human review.

        literature_synthesis_notes: one entry per claim covered by the
        PaperQA2 literature synthesis below — claim ID, its synthesized
        answer, how many of the acquired documents actually contributed
        supporting context versus were acquired but unused, and any
        synthesis error. Label every entry [UNVERIFIED SYNTHESIS] — this is
        candidate literature analysis, not a verification result, and must
        never be treated as equivalent to an entry in VERIFIED CLAIMS.

        CITATION REGISTRY:
        {{verify_evidence.citation_registry}}

        VERIFIED CLAIMS:
        {{verify_evidence.verified_claims}}

        BOUNDED RESEARCH PLAN:
        {{research_plan}}

        DEEP RESEARCH DOSSIERS (CANDIDATE ANALYSIS ONLY):
        {{deep_research.dossiers}}

        CANDIDATE SOURCES (DEEP RESEARCH):
        {{deep_research.candidates}}

        SEARCH AND CONTRADICTION AUDIT (DEEP RESEARCH):
        {{deep_research.search_audit}}

        CANDIDATE SOURCES (SCHOLARLY DISCOVERY):
        {{discover_candidates.candidates}}

        SEARCH AND CONTRADICTION AUDIT (SCHOLARLY DISCOVERY):
        {{discover_candidates.search_audit}}

        SCHOLARLY DISCOVERY REPORT:
        {{discover_candidates.report}}

        ACQUISITION REJECTIONS:
        {{acquire_research_sources.rejected_candidates}}

        PAPERQA2 LITERATURE SYNTHESIS (CANDIDATE ANALYSIS ONLY):
        {{synthesize_literature.results}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        HUMAN REVIEW QUEUE:
        {{truth_graph.human_review_queue}}

        SUPPORTING IMAGE ANALYSIS:
        {{understand_supporting_image.analysis}}

        EVIDENCE QA:
        {{verify_evidence.qa_report}}

  - id: proposal_blueprint
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 34000
      output_schema:
        proposal_identity: object
        source_hierarchy_and_fact_ledger: object
        official_partb_structure: object
        hard_page_limit: int
        working_page_target: int
        section_page_budget: object
        objective_result_outcome_chain: object
        state_of_art_and_innovations: object
        methodology_and_validation: object
        impact_pathways_and_kpis: object
        work_packages_tasks_deliverables: object
        consortium_and_resources: object
        risks_and_mitigations: object
        cross_cutting_compliance: object
        figure_and_table_plan: object
        unresolved_inputs: list
        specific_objectives_table: object
        ambitions: object
        pilot_strategy: object
        linked_research_activities: object
        ssh_integration: object
        gender_dimension: object
        data_management_open_science: object
        pestel_analysis: object
        dissemination_communication_plan: object
        post_project_dissemination: object
        exploitation_strategy: object
        policy_impact_strategy: object
        impact_summary: object
        work_plan_timing: object
      prompt_template: |
        Treat FROZEN CONCEPT below as the selected project concept and scope
        — it was chosen at Human Gate 3 from three independently generated,
        scored, and adversarially-judged alternatives. The raw concept note
        is supplementary source material only; where it conflicts with the
        frozen concept's scope, scientific_advance, or assumptions, the
        frozen concept wins. Create the master blueprint only for the
        Horizon Europe RIA/IA Part B technical description. Follow the
        official 2026 headings exactly, down to every numbered subsection
        below — each maps to the output field named after it, and none may
        be silently skipped:
        1.1 Objectives and ambition
          1.1.1 Overall project objective: one row per approved objective —
          never force the count to match a template's blank SO1-SO5
          placeholders — each giving SO id, specific objective, target
          outcome, KPI, baseline, target value, verification route and the
          call requirement it answers -> specific_objectives_table
          (the causal objective -> result -> outcome -> impact chain itself
          still belongs in objective_result_outcome_chain).
          1.1.2 Ambitions: the central ambition (A1), state of the art, and
          what goes beyond it -> ambitions.
        1.2 Methodology
          1.2.1 Concept, 1.2.2 pilot strategy -> pilot_strategy, and
          1.2.3 overall methodology and approach all belong in
          methodology_and_validation. Ground 1.2.3 in the supplied METHOD
          CARDS (approved at Human Gate 4): synthesize each into prose but
          preserve every method_id, baseline_or_comparator, validation,
          uncertainty_method, and failure_condition — do not restate them
          as a bare bullet list, and do not invent a method not present in
          the supplied cards. 1.2.4 linked research and innovation
          activities this project builds on -> linked_research_activities.
          1.2.5 interdisciplinary approach and SSH integration ->
          ssh_integration. 1.2.6 gender dimension -> gender_dimension: treat
          gender relevance in research content (variables, disaggregation,
          bias controls) as its own topic, separate from workforce/team
          balance.
          1.2.7 data management and open science practices ->
          data_management_open_science (cover data types, FAIR handling and
          planned open-access routes).
        2.1 Project's pathways towards impact
          2.1.1-2.1.2 contribution to expected outcomes and impacts belong in
          impact_pathways_and_kpis. 2.1.3 requirements and potential barriers
          beyond the project's scope: run a concrete PESTEL (Political,
          Economic, Social, Technological, Environmental, Legal) analysis
          naming factors specific to this call and domain, never generic
          boilerplate -> pestel_analysis. Give each barrier a category, the
          external condition, likelihood, consequence, project response and a
          responsible monitor. These are external conditions beyond the
          project's control; never restate one as an internal implementation
          risk in risks_and_mitigations, and vice versa.
        2.2 Measures to maximise impact – dissemination, exploitation and
        communication
          2.2.1 dissemination strategy and measures and 2.2.2 communication
          strategy -> dissemination_communication_plan. 2.2.3 dissemination
          and communication activities after the project ends ->
          post_project_dissemination. 2.2.4 exploitation strategy ->
          exploitation_strategy: one key exploitable result (KER) per row,
          each with an owner, target users, value proposition,
          protection/IPR route, exploitation route and time to uptake.
          2.2.5 multi-level policy impact strategy -> policy_impact_strategy.
          Close section 2 with a short summary of impact -> impact_summary.
        optional 2.3 Summary
        3.1 Work plan and resources
          3.1.1 timing of work packages -> work_plan_timing. 3.1.2 overall
          structure of the work package set and 3.1.3 detailed work
          description both belong in work_packages_tasks_deliverables.
        3.2 Capacity of participants and consortium as a whole ->
        consortium_and_resources.
        Do not create sections 1.3, 3.3, 3.4, Part A, ethics forms, security
        forms, budget forms or submission instructions. Treat any blank
        placeholder label (e.g. an empty "SO1"/"A1" slot) or example/template
        project name found in a supplied document as a structural cue only,
        never as approved content — do not let either leak into the
        blueprint.

        Determine the hard page limit from the call metadata and template,
        not by default: a confirmed lump-sum RIA/IA topic gets a 45-page hard
        limit with a 44-page working target (front matter 1; 1.1 = 4; 1.2 =
        13; 2.1 = 3; 2.2 = 3; optional 2.3 = 1; 3.1 = 16; 3.2 = 3). A standard
        (non-lump-sum) full proposal gets the normal 40-page hard limit with
        a 39-page working target (front matter 1; 1.1 = 5; 1.2 = 12; 2.1 =
        4.5; 2.2 = 3; optional 2.3 = 0.5; 3.1 = 11.5; 3.2 = 2.5). If the
        funding model cannot be confirmed from the supplied call documents,
        default to the stricter 40-page profile and record the ambiguity in
        unresolved_inputs. Retain one page of safety against rendering
        variation. If section 2.3 is omitted, reallocate its page only where
        evaluator value is highest.

        In figure_and_table_plan, for each planned figure give a short stable
        slug (used later to match a generated image to its slot) and the exact
        evaluator-relevant content it must show. Plan only evaluator-useful
        figures — never decoration.

        Map every call requirement to a Part B subsection, result, owner,
        evidence claim, KPI, WP, task, deliverable, milestone and risk where
        grounded. Build an explicit objective -> result -> outcome -> impact chain.
        Use [INPUT NEEDED: exact item] for missing facts; never invent partner,
        budget, KPI, TRL, timeline, pilot, source or evidence details.

        FROZEN CONCEPT (approved at Human Gate 3 — authoritative scope):
        {{freeze_concept.selected_concept}}

        METHOD CARDS (approved at Human Gate 4):
        {{methodology_engineering.method_cards}}

        CONCEPT NOTE (supplementary source material only):
        {{load_concept.text}}

        PROPOSAL METADATA:
        {{partb_metadata.parsed}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

        CALL COVERAGE:
        {{call_coverage}}

        NORMALISED SOURCE:
        {{normalise_source_graph.report}}
        {{normalise_source_graph.warnings}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

        VERIFIED EVIDENCE (citation-annotated narrative markdown of verified
        claims):
        {{verify_evidence.proposal_ready_cited_markdown}}

        APPROVED DRAFTING SOURCE — PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        TRUTH-GRAPH INTEGRITY SHA-256:
        {{truth_graph.integrity_sha256}}

        Raw Deep Research dossiers are deliberately unavailable as drafting
        authority. Use only truth-graph claims and supplied authoritative
        project/call facts. Preserve every qualification and
        [INPUT NEEDED] item.

edges:
  - from: load_concept
    to: load_documents
  - from: load_documents
    to:
      - partb_metadata
      - call_intelligence
      - understand_supporting_image
  - from: call_intelligence
    to: normalise_source_graph
  - from: partb_metadata
    to: normalise_source_graph
  - from: normalise_source_graph
    to: approve_call_interpretation
  - from: approve_call_interpretation
    to:
      - research_plan
      - discover_candidates
  - from: research_plan
    to: deep_research
  - from: deep_research
    to: acquire_research_sources
  - from: discover_candidates
    to: acquire_research_sources
  - from: acquire_research_sources
    to:
      - verify_evidence
      - synthesize_literature
  - from: verify_evidence
    to:
      - call_coverage
      - truth_graph
  - from: deep_research
    to: research_documentation
  - from: synthesize_literature
    to: research_documentation
  - from: understand_supporting_image
    to: research_documentation
  - from: truth_graph
    to:
      - research_documentation
      - proposal_blueprint
      - approve_evidence_report
  - from: call_coverage
    to:
      - proposal_blueprint
      - approve_evidence_report
  - from: approve_evidence_report
    to: concept_evolution
  - from: concept_evolution
    to: select_concept
  - from: select_concept
    to: freeze_concept
  - from: freeze_concept
    to:
      - methodology_engineering
