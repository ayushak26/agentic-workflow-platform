name: EU Proposal Evidence Pipeline
description: >-
  Normalise a Horizon concept, discover and verify evidence, build the
  requirement-coverage matrix, generate three concept alternatives, pause for
  human approvals, and run an independent two-provider Horizon evaluation.
version: "2.0"
use_case: eu_proposal
inputs:
  concept_note:
    type: file
    description: Upload the internal proposal concept note.
    required: true
    multiple: true
    max_files: 10
    accept: [pdf, document, markdown, presentation, spreadsheet, code]
  call_facts:
    type: file
    description: Upload the authoritative call requirements and expected outcomes.
    required: true
    multiple: true
    max_files: 10
    accept: [pdf, document, markdown, presentation, spreadsheet]
  proposal_text:
    type: file
    description: Upload the Part B draft to evaluate after concept approval.
    required: true
    multiple: true
    max_files: 10
    accept: [pdf, document, markdown, presentation]
nodes:
  - id: load_concept_note
    type: WorkflowFileLoader
    config:
      files: "{{inputs.concept_note}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true
  - id: load_call_facts
    type: WorkflowFileLoader
    config:
      files: "{{inputs.call_facts}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true
  - id: normalise_concept
    type: GraphNormalizer
    config:
      model: claude-opus-5
      max_tokens: 16384
      concept_note: "{{load_concept_note.text}}"
      call_facts: "{{load_call_facts.text}}"
  - id: discover_evidence
    type: ScholarlyCandidateDiscoveryAgent
    config:
      model: claude-sonnet-4-5
      max_results_per_source: 2
      max_candidates_per_claim: 8
      claim_types: [state_of_art, problem, impact, method]
      require_contradiction_search: true
  - id: acquire_full_text
    type: FullTextEvidenceAcquirer
    config:
      candidates: "{{discover_evidence.candidates}}"
      fail_when_none_acquired: false
  - id: verify_evidence
    type: ProposalEvidenceFactoryAgent
    config:
      model: claude-sonnet-4-5
      candidates: "{{discover_evidence.candidates}}"
      documents: "{{acquire_full_text.documents}}"
      search_audit: "{{discover_evidence.search_audit}}"
      rejected_candidates: "{{acquire_full_text.rejected_candidates}}"
  - id: scientific_synthesis
    type: ScientificSkillAgent
    config:
      model: claude-sonnet-4-5
      skills:
        - literature-review
        - scientific-critical-thinking
        - research-grants
      auto_select: false
      max_skills: 3
      objective: >-
        Synthesize the verified evidence for a Horizon Europe proposal. Identify
        robust state-of-the-art conclusions, contradictions, evidence gaps,
        unsupported proposal claims, and implications for scientific ambition
        and feasibility. Use only the supplied records; never invent a source.
        Verified claims: {{verify_evidence.verified_claims}}.
        Evidence QA: {{verify_evidence.qa_report}}.
        Blocking issues: {{verify_evidence.blocking_issues}}.
        Discovery report: {{discover_evidence.report}}.
  - id: call_coverage
    type: CallCoverageMatrixAgent
    config: {}
  - id: approve_evidence
    type: HumanInLoopAgent
    config:
      question: Approve the verified evidence pack and call-coverage matrix?
      context_fields:
        - verify_evidence.findings
        - call_coverage.blocking_requirement_ids
      editable_content_field: verify_evidence.findings
      allowed_actions: [approve, reject, edit]
  - id: concept_alternatives
    type: ConceptAlternativesAgent
    config:
      model: claude-opus-5
      concept_note: "{{load_concept_note.text}}"
  - id: approve_concept
    type: HumanInLoopAgent
    config:
      question: Select and approve one concept posture before drafting?
      context_fields:
        - concept_alternatives.alternatives
      editable_content_field: concept_alternatives.alternatives
      allowed_actions: [approve, reject, edit]
  - id: load_proposal
    type: WorkflowFileLoader
    config:
      files: "{{inputs.proposal_text}}"
      max_chars_per_file: 1000000
      fail_on_unreadable: true
  - id: horizon_evaluation
    type: HorizonEvaluationAgent
    config:
      proposal_text: "{{load_proposal.text}}"
      generator_model: claude-opus-5
      evaluator_models:
        - claude-sonnet-4-5
        - gpt-5
      criterion_threshold: 3.0
      total_threshold: 10.0
  - id: render_proposal
    type: HorizonHTMLProposalRenderer
    config:
      content: "{{load_proposal.text}}"
      content_format: markdown
      metadata:
        proposal_title: Horizon Europe Proposal
        part_label: Part B
        version: Evidence-verified draft
      citation_registry: "{{verify_evidence.citation_registry}}"
      evidence_qa: "{{verify_evidence.qa_report}}"
      evidence_blockers: "{{verify_evidence.blocking_issues}}"
      include_toc: true
      include_bibliography: true
      include_evidence_annex: true
      page_limit: 45
      enforce_page_limit: false
  - id: render_proposal_docx
    type: HorizonDOCXProposalRenderer
    config:
      content: "{{load_proposal.text}}"
      content_format: markdown
      metadata:
        proposal_title: Horizon Europe Proposal
        part_label: Part B
        version: Evidence-verified draft
      citation_registry: "{{verify_evidence.citation_registry}}"
      evidence_qa: "{{verify_evidence.qa_report}}"
      evidence_blockers: "{{verify_evidence.blocking_issues}}"
      include_toc: true
      include_bibliography: true
      include_evidence_annex: true
      page_limit: 45
      enforce_page_limit: false
edges:
  - from: load_concept_note
    to: load_call_facts
  - from: load_call_facts
    to: normalise_concept
  - from: normalise_concept
    to: discover_evidence
  - from: discover_evidence
    to: acquire_full_text
  - from: acquire_full_text
    to: verify_evidence
  - from: verify_evidence
    to: scientific_synthesis
  - from: scientific_synthesis
    to: call_coverage
  - from: call_coverage
    to: approve_evidence
  - from: approve_evidence
    to: concept_alternatives
  - from: concept_alternatives
    to: approve_concept
  - from: approve_concept
    to: load_proposal
  - from: load_proposal
    to: horizon_evaluation
  - from: horizon_evaluation
    to: render_proposal
  - from: render_proposal
    to: render_proposal_docx
entry: load_concept_note
exit: render_proposal_docx
output:
  include_input: false
  nodes:
    - node_id: call_coverage
      flatten: false
    - node_id: scientific_synthesis
      flatten: false
    - node_id: concept_alternatives
      flatten: false
    - node_id: horizon_evaluation
      flatten: false
    - node_id: verify_evidence
      flatten: false
    - node_id: render_proposal
      flatten: false
    - node_id: render_proposal_docx
      flatten: false
