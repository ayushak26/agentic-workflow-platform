name: Pump Manufacturer Multilingual Customer Case Routing
description: >-
  Multilingual industrial B2B intake for a pump manufacturer. The LLM is used only to understand and
  structure the incoming customer message. CRM/ERP facts are retrieved through Dynamics 365 MCP. All
  ownership and team routing is then performed by deterministic RouterAgent rules, with human triage
  for uncertain or uncategorised cases.
version: '1.1'
use_case: industrial_customer_operations
inputs:
  message:
    type: text
    required: true
  subject:
    type: text
    required: false
  sender_email:
    type: text
    required: false
  source_channel:
    type: text
    required: false
entry: understand_message
exit:
  - manual_low_confidence
  - route_safety
  - route_production_stoppage
  - rfq_named_kam
  - rfq_kam_queue
  - rfq_named_territory_owner
  - rfq_inside_sales_queue
  - rfq_named_sales_engineer
  - rfq_sales_engineering_queue
  - rfq_named_application_specialist
  - rfq_application_engineering_queue
  - order_customer_not_found
  - order_commercial_review
  - order_technical_review
  - order_credit_hold
  - order_supply_chain_review
  - order_management_ready
  - status_missing_reference
  - status_order_not_found
  - status_material_shortage
  - status_production_delay
  - status_quality_hold
  - status_dispatched
  - status_normal
  - change_order_not_found
  - change_production_started
  - change_commercial
  - change_order_admin
  - technical_named_sales_engineer
  - technical_sales_engineering_queue
  - technical_need_serial
  - technical_named_service_owner
  - technical_service_queue
  - complaint_transport_damage
  - complaint_delivery
  - complaint_product_quality
  - complaint_warranty
  - complaint_commercial
  - complaint_documentation
  - complaint_other
  - spare_parts_need_serial
  - spare_parts_named_owner
  - spare_parts_queue
  - document_ga_drawing
  - document_certificate
  - document_manual
  - document_datasheet
  - document_other
  - invoice_finance
  - manual_other_case
  - route_dual_intent
  - change_commercial_and_engineering
  - customer_ambiguous
  - order_missing_quote_reference
  - order_product_not_identified
  - order_customer_system_unavailable
  - order_credit_unknown
  - status_system_unavailable
  - status_fulfilment_unknown
  - change_system_unavailable
  - change_production_status_unknown
  - installed_unit_identity_conflict
  - complaint_warranty_lapsed
  - routing_operations_queue
nodes:
  - id: understand_message
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      temperature: 0
      system_prompt: >-
        You are an industrial B2B customer-intake analyst for a pump manufacturer. Interpret
        multilingual customer messages accurately, but do not decide who should own the case.
        Extract facts only. When information is absent, use empty strings, false, UNKNOWN, or OTHER
        as appropriate. Do not invent order, quotation, customer, product, delivery, or technical
        facts.
      prompt_template: |
        SUBJECT:
        {{inputs.subject}}

        SENDER:
        {{inputs.sender_email}}

        CHANNEL:
        {{inputs.source_channel}}

        CUSTOMER MESSAGE:
        {{inputs.message}}

        Extract the following fields using exactly the allowed values where listed.

        intent:
          RFQ | NEW_ORDER | ORDER_STATUS | ORDER_CHANGE | TECHNICAL_SUPPORT |
          COMPLAINT | SPARE_PARTS | DOCUMENT_REQUEST | INVOICE | OTHER

        secondary_intents:
          A LIST of the other allowed intent values present in this message, or [] when
          there is only one ask.

          A single business message often carries two genuinely separate asks - for
          example a request for new equipment AND a spare-parts request against an
          old order. They are separate asks when they need different work by
          different people, not merely two sentences. Set intent to the commercially
          larger ask and list every other distinct ask in secondary_intents.

          Use [] when the message has only one ask, or when a later sentence merely
          supports the first rather than being a distinct request.

          Example: 'Pump P-100 is leaking. Also send us the certificate and please
          quote two replacement pumps.' has intent=COMPLAINT and
          secondary_intents=[DOCUMENT_REQUEST, RFQ] — three separate pieces of work
          owned by three different teams.

        secondary_reference:
          The order, PO or quotation reference belonging to the secondary ask, when it
          names one - e.g. 'spare parts for old order: PO 231706' gives 'PO 231706'.
          Empty string when there is no secondary ask, or none names a reference.

        technical_complexity:
          standard | technical | complex

        lifecycle_stage:
          presales | order_execution | installed_base | unknown

        complaint_type:
          transport_damage | delivery | product_quality | warranty | commercial |
          documentation | other | none

        requested_document_type:
          DATASHEET | GA_DRAWING | CERTIFICATE | MANUAL | OTHER | NONE

        Also extract:
        - language: ISO-like language name/code
        - english_summary: concise English summary
        - customer_name
        - contact_name
        - quotation_reference
        - customer_po_reference
        - sales_order_reference
        - pump_model
        - serial_number
        - requested_delivery_date
        - requested_quantity
        - requested_action
        - confidence: 0.0 to 1.0
        - has_safety_issue: true only for credible personal/environmental safety risk
        - production_stoppage: true when the customer's plant/process is stopped or
          critically unable to operate
        - technical_deviation_requested: true when requested specification differs
          from quoted/standard specification
        - price_or_terms_changed: true when customer asks to change price, payment,
          Incoterms, cancellation, or other commercial terms
        - order_reference_present: true when an SO/order number is present
        - serial_number_present: true when a serial number is present
        - missing_information: list of material missing facts
      output_schema:
        language: str
        english_summary: str
        intent: str
        secondary_intents: list
        secondary_reference: str
        customer_name: str
        contact_name: str
        quotation_reference: str
        customer_po_reference: str
        sales_order_reference: str
        pump_model: str
        serial_number: str
        requested_delivery_date: str
        requested_quantity: str
        requested_action: str
        confidence: float
        has_safety_issue: bool
        production_stoppage: bool
        technical_complexity: str
        lifecycle_stage: str
        complaint_type: str
        requested_document_type: str
        technical_deviation_requested: bool
        price_or_terms_changed: bool
        order_reference_present: bool
        serial_number_present: bool
        missing_information: list
  - id: emergency_customer_lookup
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_customer
      fail_on_error: false
      arguments:
        customer_name: '{{outputs.understand_message.parsed.customer_name?}}'
        limit: 5
      timeout_seconds: 5
  - id: emergency_ownership_lookup
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_account_ownership
      fail_on_error: false
      arguments:
        account_id: '{{outputs.emergency_customer_lookup.first.account_id?}}'
      timeout_seconds: 5
  - id: stoppage_customer_lookup
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_customer
      fail_on_error: false
      arguments:
        customer_name: '{{outputs.understand_message.parsed.customer_name?}}'
        limit: 5
      timeout_seconds: 5
  - id: stoppage_ownership_lookup
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_account_ownership
      fail_on_error: false
      arguments:
        account_id: '{{outputs.stoppage_customer_lookup.first.account_id?}}'
      timeout_seconds: 5
  - id: find_customer
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_customer
      fail_on_error: false
      arguments:
        customer_name: '{{outputs.understand_message.parsed.customer_name}}'
        limit: 5
  - id: customer_match_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: AMBIGUOUS
          description: Several customer accounts match the name in the message.
          when:
            operator: and
            conditions:
              - field: find_customer.count
                operator: greater_than
                value: 1
      fallback: CONTINUE
  - id: customer_ambiguous
    type: HumanInLoopAgent
    config:
      question: >-
        More than one Dynamics 365 customer matches the name in this message. Confirm which account
        the case belongs to before it is routed — the owner, credit position and order history all
        differ between them. Approve once the correct account is confirmed; reject to correct the
        extracted customer name and rerun.
      context_fields:
        - inputs.message
        - understand_message.parsed.customer_name
        - find_customer.count
        - find_customer.data
      allow_document_override: false
      allowed_actions:
        - approve
        - reject
  - id: customer_confirmed
    type: DataTransformAgent
    config:
      operations:
        - target: account_id
          operation: copy
          source: find_customer.first.account_id
        - target: account_name
          operation: copy
          source: find_customer.first.account_name
        - target: match_count
          operation: copy
          source: find_customer.count
  - id: get_ownership
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_account_ownership
      fail_on_error: false
      arguments:
        account_id: '{{outputs.find_customer.first.account_id?}}'
  - id: get_credit
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_credit_status
      fail_on_error: false
      arguments:
        account_id: '{{outputs.find_customer.first.account_id?}}'
  - id: get_quote
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_quote
      fail_on_error: false
      arguments:
        quotation_number: '{{outputs.understand_message.parsed.quotation_reference?}}'
        purchase_order_number: '{{outputs.understand_message.parsed.customer_po_reference?}}'
        account_id: '{{outputs.find_customer.first.account_id?}}'
  - id: get_sales_order
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_sales_order
      fail_on_error: false
      arguments:
        order_number: '{{outputs.understand_message.parsed.sales_order_reference?}}'
  - id: get_fulfilment
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_order_fulfilment_status
      fail_on_error: false
      arguments:
        order_number: '{{outputs.understand_message.parsed.sales_order_reference?}}'
  - id: get_availability
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_inventory_availability
      fail_on_error: false
      arguments:
        pump_model: '{{outputs.understand_message.parsed.pump_model?}}'
  # An order placed against a quotation names no pump model in the message — the
  # quotation carries it. Without this second lookup the model is known (from the
  # quote) but its availability never is, so the case reaches Order Management
  # with stock unchecked. Skips itself when no quotation was matched.
  - id: get_quoted_model_availability
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_inventory_availability
      fail_on_error: false
      arguments:
        pump_model: '{{outputs.get_quote.first.pump_model?}}'
  - id: get_installed_unit
    type: MCPToolAgent
    config:
      server_id: dynamics365_finance_scm
      tool: find_installed_unit
      fail_on_error: false
      arguments:
        serial_number: '{{outputs.understand_message.parsed.serial_number?}}'
        account_id: '{{outputs.find_customer.first.account_id?}}'
  - id: serial_identity_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: IDENTITY_CONFLICT
          description: The quoted serial number belongs to a different customer.
          when:
            operator: and
            conditions:
              - field: get_installed_unit.found
                operator: is_true
              - field: get_installed_unit.first.belongs_to_customer
                operator: is_false
      fallback: CONTINUE
  - id: warranty_status_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: WARRANTY_LAPSED
          description: The installed unit's warranty period appears to have ended.
          when:
            operator: and
            conditions:
              - field: get_installed_unit.found
                operator: is_true
              - field: get_installed_unit.first.belongs_to_customer
                operator: is_true
              - field: get_installed_unit.first.warranty_active
                operator: is_false
      fallback: IN_WARRANTY
  - id: installed_unit_identity_conflict
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            CASE: SERIAL NUMBER DOES NOT BELONG TO THIS CUSTOMER
            Team: Service Support — human review required

            Serial quoted by the customer: {{understand_message.parsed.serial_number?}}
            Belongs to this customer: {{get_installed_unit.first.belongs_to_customer?}}

            What is deliberately not shown:
            Which customer does own this unit, where it is installed, and what it is.
            Answering a serial number back to whoever asked would disclose another
            customer's equipment and site to them.

            Why this is not simply a wrong number:
            It is usually a transcription error, occasionally a unit bought second-hand,
            and rarely something worse. All three need a person, and none of them should
            be resolved by quoting the record back.

            Action:
            Confirm the correct serial with the customer directly. Do not describe the
            unit on file until identity is resolved.

            Automatic technical response: BLOCKED.

            Contact: {{understand_message.parsed.contact_name?}}
            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
  - id: complaint_warranty_lapsed
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: >
            CASE: WARRANTY CLAIM - COVER PERIOD APPEARS TO HAVE ENDED

            Team: Service / Warranty — commercial decision required

            Commercial owner: {{get_ownership.first.account_owner_name?}}


            Unit: {{get_installed_unit.first.pump_model?}} (serial
            {{understand_message.parsed.serial_number?}})

            Site: {{get_installed_unit.first.site_or_location?}}

            Warranty active in Dynamics 365: {{get_installed_unit.first.warranty_active?}}

            Warranty end date on file: {{get_installed_unit.first.warranty_end_date?}}


            What this workflow has NOT decided:

            Whether the claim is refused. An expiry date on file is evidence, not a

            contractual ruling — the claim may still be met on goodwill, under a service

            agreement, or because the fault predates expiry. That judgement is Service

            and Commercial's to make, not this workflow's.


            Action:

            Assess the claim on its merits with the expiry date as one input, and reply

            to the customer with a decision a person has taken.


            Contact: {{understand_message.parsed.contact_name?}}

            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}

            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
  - id: confidence_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: MANUAL_REVIEW
          condition: understand_message.parsed.confidence < 0.8
        - name: CONTINUE
          default: true
  - id: safety_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: SAFETY
          condition: understand_message.parsed.has_safety_issue == true
        - name: CONTINUE
          default: true
  - id: stoppage_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: PRODUCTION_STOPPAGE
          condition: understand_message.parsed.production_stoppage == true
        - name: CONTINUE
          default: true
  - id: second_ask_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: DUAL
          description: The message carries more than one distinct ask.
          when:
            operator: and
            conditions:
              - field: understand_message.parsed.secondary_intents
                operator: is_not_empty
      fallback: CONTINUE
  - id: route_dual_intent
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            CASE: SEVERAL SEPARATE ASKS IN ONE MESSAGE - PARENT CASE

            Primary ask: {{understand_message.parsed.intent?}}
            Additional asks: {{understand_message.parsed.secondary_intents?}}
            Reference given for a secondary ask: {{understand_message.parsed.secondary_reference?}}

            Each ask below is a separate piece of work with its own owner. This
            case is not complete until every one of them has been answered, and
            answering only the primary ask leaves the customer waiting on the rest.

            Who owns which kind of ask:
              RFQ / NEW_ORDER          New Equipment Sales — {{get_ownership.first.account_owner_name?}}
              TECHNICAL_SUPPORT        Sales Engineering — {{get_ownership.first.sales_engineer_name?}}
              SPARE_PARTS              Aftermarket / Spare Parts — {{get_ownership.first.service_owner_name?}}
              COMPLAINT                Quality / Service — {{get_ownership.first.service_owner_name?}}
              DOCUMENT_REQUEST         Documentation / Quality
              ORDER_STATUS / CHANGE    Order Management
              INVOICE                  Finance

            Action:
            Open one child work item per ask, assign each to the owner above, and
            coordinate a single combined reply to the customer.

            Summary: {{understand_message.parsed.english_summary}}

            Contact: {{understand_message.parsed.contact_name?}}
            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
        - target: work_items
          operation: object
          value:
            parent_summary: $understand_message.parsed.english_summary
            primary_ask: $understand_message.parsed.intent
            additional_asks: $understand_message.parsed.secondary_intents
            secondary_reference: $understand_message.parsed.secondary_reference
            customer: $find_customer.first.account_name
            commercial_owner: $get_ownership.first.account_owner_name
            service_owner: $get_ownership.first.service_owner_name
            sales_engineer: $get_ownership.first.sales_engineer_name
  - id: change_deviation_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: DUAL
          condition: understand_message.parsed.technical_deviation_requested == true
        - name: SINGLE
          default: true
  - id: change_commercial_and_engineering
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            CASE: ORDER CHANGE - TECHNICAL DEVIATION AND COMMERCIAL CHANGE

            Primary team: Sales Engineering
            Primary owner: {{get_ownership.first.sales_engineer_name?}}

            Second team: Order Administration
            Commercial owner: {{get_ownership.first.account_owner_name?}}

            Order: {{understand_message.parsed.sales_order_reference?}}

            Second team required: Order Administration

            Why both teams are required:
            This change request alters both the technical specification and the commercial
            terms. Engineering feasibility and order repricing are separate approvals, and
            applying one without the other produces an order that either cannot be built or
            cannot be invoiced.

            Primary team is expected to:
            Confirm whether the deviation is technically feasible and what it changes in
            scope, lead time and build.

            Second team is expected to:
            Reprice, amend the order and confirm the revised commercial terms once
            feasibility is confirmed.

            Contact: {{understand_message.parsed.contact_name?}}
            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
  - id: intent_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: RFQ
          condition: understand_message.parsed.intent == 'RFQ'
        - name: NEW_ORDER
          condition: understand_message.parsed.intent == 'NEW_ORDER'
        - name: ORDER_STATUS
          condition: understand_message.parsed.intent == 'ORDER_STATUS'
        - name: ORDER_CHANGE
          condition: understand_message.parsed.intent == 'ORDER_CHANGE'
        - name: TECHNICAL_SUPPORT
          condition: understand_message.parsed.intent == 'TECHNICAL_SUPPORT'
        - name: COMPLAINT
          condition: understand_message.parsed.intent == 'COMPLAINT'
        - name: SPARE_PARTS
          condition: understand_message.parsed.intent == 'SPARE_PARTS'
        - name: DOCUMENT_REQUEST
          condition: understand_message.parsed.intent == 'DOCUMENT_REQUEST'
        - name: INVOICE
          condition: understand_message.parsed.intent == 'INVOICE'
        - name: OTHER
          default: true
  - id: rfq_complexity_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: COMPLEX
          condition: understand_message.parsed.technical_complexity == 'complex'
        - name: TECHNICAL
          condition: understand_message.parsed.technical_complexity == 'technical'
        - name: STANDARD
          default: true
  - id: rfq_standard_key_account_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: KEY_ACCOUNT
          condition: find_customer.first.key_account == true
        - name: TERRITORY
          default: true
  - id: rfq_kam_owner_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: NAMED_KAM
          condition: get_ownership.first.account_owner_name != ''
        - name: KAM_QUEUE
          default: true
  - id: rfq_territory_owner_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: NAMED_TERRITORY_OWNER
          condition: get_ownership.first.territory_sales_owner_name != ''
        - name: INSIDE_SALES_QUEUE
          default: true
  - id: rfq_technical_owner_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: NAMED_SALES_ENGINEER
          condition: get_ownership.first.sales_engineer_name != ''
        - name: SALES_ENGINEERING_QUEUE
          default: true
  - id: rfq_complex_owner_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: NAMED_APPLICATION_SPECIALIST
          condition: get_ownership.first.application_specialist_name != ''
        - name: APPLICATION_ENGINEERING_QUEUE
          default: true
  - id: order_customer_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: CUSTOMER_SYSTEM_UNAVAILABLE
          description: The customer lookup did not answer.
          when:
            operator: and
            conditions:
              - field: find_customer.status
                operator: in
                value:
                  - error
                  - denied
                  - needs_approval
        - route: CUSTOMER_NOT_FOUND
          description: The lookup answered and found no such customer.
          when:
            operator: and
            conditions:
              - field: find_customer.found
                operator: is_false
      fallback: CONTINUE
  - id: order_quote_match_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: NO_QUOTE_REFERENCE
          description: The message names no quotation to validate the PO against.
          when:
            operator: and
            conditions:
              - field: understand_message.parsed.quotation_reference
                operator: is_empty
        - route: COMMERCIAL_REVIEW
          description: >-
            A quotation was named but the PO does not match it, or the quote belongs to a different
            customer.
          when:
            operator: or
            conditions:
              - field: get_quote.first.po_matches_quote
                operator: is_false
              - field: get_quote.first.belongs_to_customer
                operator: is_false
      fallback: CONTINUE
  - id: order_technical_deviation_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: TECHNICAL_REVIEW
          condition: understand_message.parsed.technical_deviation_requested == true
        - name: CONTINUE
          default: true
  - id: order_credit_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: CREDIT_UNKNOWN
          description: The credit lookup did not answer.
          when:
            operator: and
            conditions:
              - field: get_credit.status
                operator: in
                value:
                  - error
                  - denied
                  - needs_approval
        - route: CREDIT_HOLD
          description: Finance has this customer on credit hold.
          when:
            operator: and
            conditions:
              - field: get_credit.first.credit_hold
                operator: is_true
      fallback: CONTINUE
  - id: order_availability_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: PRODUCT_NOT_IDENTIFIED
          description: >-
            Neither the message nor the quotation it references names a pump model,
            so there is nothing to identify the order by.
          when:
            operator: and
            conditions:
              - field: understand_message.parsed.pump_model
                operator: is_empty
              # An order placed against a quotation usually names no model at all —
              # the quote carries it. Asking the customer to confirm a model that is
              # on their own confirmed quotation is exactly the guess this workflow
              # exists to avoid, so the retrieved quote counts as an identification.
              - field: get_quote.first.pump_model
                operator: is_empty
        - route: SUPPLY_CHAIN_REVIEW
          description: Availability was checked and is not feasible.
          when:
            operator: or
            conditions:
              # Each half asks the same question of one lookup: did it actually run,
              # and did it come back anything other than feasible? The `skipped`
              # guard matters because a lookup that never ran leaves
              # availability_status absent, which "not FEASIBLE" would otherwise
              # read as a supply problem the ERP never reported.
              - operator: and
                conditions:
                  - field: get_availability.status
                    operator: not_equals
                    value: skipped
                  - field: get_availability.first.availability_status
                    operator: not_equals
                    value: FEASIBLE
              - operator: and
                conditions:
                  - field: get_quoted_model_availability.status
                    operator: not_equals
                    value: skipped
                  - field: get_quoted_model_availability.first.availability_status
                    operator: not_equals
                    value: FEASIBLE
      fallback: ORDER_MANAGEMENT
  - id: status_reference_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        # Gate on the reference the lookup actually uses, not on the model's
        # separate order_reference_present flag. A message that sets the flag but
        # leaves sales_order_reference empty made get_sales_order skip and the run
        # then told the customer their order was not found, which is a different
        # and untrue statement from "we need the reference".
        - name: MISSING_REFERENCE
          condition: understand_message.parsed.sales_order_reference == ''
        - name: CONTINUE
          default: true
  - id: status_order_found_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: ORDER_SYSTEM_UNAVAILABLE
          description: The order lookup did not answer.
          when:
            operator: and
            conditions:
              - field: get_sales_order.status
                operator: in
                value:
                  - error
                  - denied
                  - needs_approval
        - route: ORDER_NOT_FOUND
          description: The lookup answered and found no such order.
          when:
            operator: and
            conditions:
              - field: get_sales_order.found
                operator: is_false
      fallback: CONTINUE
  - id: fulfilment_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: FULFILMENT_UNKNOWN
          description: The fulfilment lookup did not answer.
          when:
            operator: and
            conditions:
              - field: get_fulfilment.status
                operator: in
                value:
                  - error
                  - denied
                  - needs_approval
        - route: MATERIAL_SHORTAGE
          description: The ERP reports MATERIAL_SHORTAGE.
          when:
            operator: and
            conditions:
              - field: get_fulfilment.first.fulfilment_status
                operator: equals
                value: MATERIAL_SHORTAGE
        - route: PRODUCTION_DELAY
          description: The ERP reports PRODUCTION_DELAY.
          when:
            operator: and
            conditions:
              - field: get_fulfilment.first.fulfilment_status
                operator: equals
                value: PRODUCTION_DELAY
        - route: QUALITY_HOLD
          description: The ERP reports QUALITY_HOLD.
          when:
            operator: and
            conditions:
              - field: get_fulfilment.first.fulfilment_status
                operator: equals
                value: QUALITY_HOLD
        - route: DISPATCHED
          description: The ERP reports DISPATCHED.
          when:
            operator: and
            conditions:
              - field: get_fulfilment.first.fulfilment_status
                operator: equals
                value: DISPATCHED
      fallback: NORMAL_STATUS
  - id: change_order_found_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: ORDER_SYSTEM_UNAVAILABLE
          description: The order lookup did not answer.
          when:
            operator: and
            conditions:
              - field: get_sales_order.status
