  - id: change_production_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: PRODUCTION_STATUS_UNKNOWN
          description: The order lookup did not answer, so the production state is unknown.
          when:
            operator: and
            conditions:
              - field: get_sales_order.status
                operator: in
                value:
