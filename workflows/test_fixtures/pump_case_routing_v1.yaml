            business fact could not be established, not because it was established.

            Summary: {{understand_message.parsed.english_summary}}

            Contact: {{understand_message.parsed.contact_name?}}
            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
  - id: ownership_availability_router
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: OWNERSHIP_UNAVAILABLE
          description: The ownership lookup did not answer.
          when:
            operator: and
            conditions:
              - field: get_ownership.status
                operator: in
                value:
                  - error
                  - denied
                  - needs_approval
      fallback: CONTINUE
  - id: routing_operations_queue
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            CASE: OWNERSHIP UNREADABLE - ROUTING OPERATIONS
            Team: Routing Operations

            Dynamics 365 ownership lookup: {{get_ownership.status?}}
            Reported error: {{get_ownership.error?}}

            What is unknown:
            Who owns this account. Not that nobody owns it — that we could not read it.

            Why this is not the same as an unassigned account:
            Falling through to a team queue would look identical to a genuinely
            unassigned customer, and the named owner would never learn the case
            arrived.

            Action:
            Retry the lookup, then route to the owner it returns.

            Summary: {{understand_message.parsed.english_summary}}

            Contact: {{understand_message.parsed.contact_name?}}
            Company (verified in Dynamics 365): {{find_customer.first.account_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}
