      allowed_actions:
        - approve
        - reject
  - id: route_safety
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            PRIORITY: CRITICAL SAFETY CASE

            Primary team: Service Emergency queue
            Supporting teams: Quality + EHS / Safety

            Reason: a credible safety risk was detected in the customer's own words.
            This route is decided from the message alone and does not wait for Dynamics
            365 — an enrichment failure must never delay an emergency.

            Summary: {{understand_message.parsed.english_summary}}

            Second team required: Service / QHSE, alongside the commercial owner

            Why both teams are required:
            The message reports a credible safety risk. Assessing that risk and handling
            the customer commercially are different responsibilities, and neither team
            can close the case on its own.

            Primary team is expected to:
            Assess the reported risk, decide containment and any field action, and supply
            the findings the commercial reply depends on.

            Second team is expected to:
            Hold any related open orders, own customer communication, and commit to no
            remedy or liability until QHSE has reported.

            Customer identity (enrichment only — not a routing input):
              Dynamics 365 lookup: {{emergency_customer_lookup.status?}} ({{emergency_customer_lookup.error_code?}})
              Resolved account: {{emergency_customer_lookup.first.account_name?}}
              Matching accounts: {{emergency_customer_lookup.count?}}
              Service owner: {{emergency_ownership_lookup.first.service_owner_name?}}
              Commercial owner: {{emergency_ownership_lookup.first.account_owner_name?}}

            Contact: {{understand_message.parsed.contact_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}

            Automatic commercial action: BLOCKED pending human review.
  - id: route_production_stoppage
    type: DataTransformAgent
    config:
      operations:
        - target: text
          operation: format
          value: |
            PRIORITY: URGENT PRODUCTION STOPPAGE

            Primary team: Service / Field Service emergency queue
            Supporting team: Sales (account owner visibility)

            Reason: the customer's production or process is stopped or critically
            unavailable. This route is decided from the message alone and does not wait
            for Dynamics 365.

            Summary: {{understand_message.parsed.english_summary}}

            Second team required: Sales, alongside Service / Field Support

            Why both teams are required:
            The customer's plant or process is stopped. Restoring production and owning
            the commercial consequences of the downtime are different jobs that have to
            run in parallel rather than one after the other.

            Primary team is expected to:
            Diagnose and restore production, and report the technical cause and expected
            recovery time back to Sales.

            Second team is expected to:
            Own escalation and priority, set customer expectations, and handle the
            commercial consequences of the downtime.

            Customer identity (enrichment only — not a routing input):
              Dynamics 365 lookup: {{stoppage_customer_lookup.status?}} ({{stoppage_customer_lookup.error_code?}})
              Resolved account: {{stoppage_customer_lookup.first.account_name?}}
              Matching accounts: {{stoppage_customer_lookup.count?}}
              Service owner: {{stoppage_ownership_lookup.first.service_owner_name?}}
              Commercial owner: {{stoppage_ownership_lookup.first.account_owner_name?}}

            Contact: {{understand_message.parsed.contact_name?}}
            Company (as stated by the customer): {{understand_message.parsed.customer_name?}}

            Automatic commercial action: BLOCKED pending human review.
