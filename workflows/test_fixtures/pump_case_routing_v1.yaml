  - id: manual_low_confidence
    type: HumanInLoopAgent
    config:
      question: >-
        Intake confidence is below 0.80. CRM / Customer Support must inspect the original message,
        extracted fields and live business context before assigning the case. Approve only after the
        case has been manually triaged; reject when the extraction must be corrected and rerun.
      context_fields:
        - inputs.message
        - understand_message.parsed
        - find_customer.first
        - find_customer.count
        - get_ownership.first
        - get_credit.first
        - get_quote.first
        - get_sales_order.first
