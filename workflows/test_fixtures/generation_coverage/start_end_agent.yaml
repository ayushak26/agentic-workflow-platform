name: Generation Coverage - StartAgent + EndAgent
description: >-
  Smallest valid workflow exercising StartAgent and EndAgent — used by
  tests/test_workflow_generation_node_coverage.py, not run in production.
version: "1.0"
nodes:
  - id: begin
    type: StartAgent
    config:
      mode: input_form
      title: Customer Question
      fields:
        - name: question
          label: Question
          type: string
          required: true
  - id: echo_question
    type: Echo
    config:
      template: '{{begin.data.question}}'
  - id: finish
    type: EndAgent
    config:
      mode: workflow_result
      outputs:
        - key: answer
          value_from: '{{echo_question.text}}'
edges:
  - from: begin
    to: echo_question
  - from: echo_question
    to: finish
entry: begin
exit: finish
