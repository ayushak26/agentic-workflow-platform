name: Workflow File Input Demo
description: >-
  Demonstrates secure multi-file workflow inputs. Text is extracted from
  supported PDF, DOCX, PPTX, Markdown, spreadsheet, and code files. Image
  uploads remain object-storage references for a multimodal node.
version: "1.0"
use_case: generic

inputs:
  source_files:
    type: file
    description: Add the source material the workflow should inspect.
    required: true
    multiple: true
    max_files: 10
    accept:
      - pdf
      - document
      - markdown
      - presentation
      - spreadsheet
      - code
      - image

nodes:
  - id: load_files
    type: WorkflowFileLoader
    config:
      files: "{{inputs.source_files}}"
      max_chars_per_file: 200000
      fail_on_unreadable: false

edges: []
entry: load_files
exit: load_files

output:
  include_input: false
  nodes:
    - node_id: load_files
      flatten: false
