name: "Summarize Meeting Notes"
description: "Take raw meeting notes, produce a structured digest."
version: "1.0"

inputs:
  notes:
    type: text

nodes:
  - id: summarize
    type: TransformAgent
    config:
      model: "claude-sonnet-4-5"
      prompt_template: |
        Summarize these meeting notes into a structured digest.

        Notes:
        {{inputs.notes}}
      output_schema:
        attendees: list
        key_decisions: list
        action_items: list
        followups: list

edges: []