  - research_documentation
output:
  include_input: false
  nodes:
    - node_id: call_coverage
      flatten: false
    - node_id: verify_evidence
      flatten: false
    - node_id: research_documentation
      flatten: false
    - node_id: evaluate_final
      flatten: false
    - node_id: submission_gate
      flatten: false
    - node_id: approve_submission
      flatten: false
    - node_id: render_submission_pdf
      flatten: false
