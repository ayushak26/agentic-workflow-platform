  - from: call_coverage
    to: approve_evidence
  - from: approve_evidence
    to: concept_alternatives
  - from: concept_alternatives
    to: select_concept
  - from: select_concept
    to: approve_concept
  - from: approve_concept
    to: proposal_blueprint
  - from: proposal_blueprint
    to:
      - draft_excellence
      - draft_impact
      - draft_implementation
      - draft_cross_cutting
      - generate_figure_oro_chain
      - generate_figure_impact_pathways
      - generate_figure_workplan
  - from: draft_excellence
    to: compile_excellence
  - from: draft_cross_cutting
    to:
      - compile_excellence
      - compile_impact
      - compile_implementation
  - from: draft_impact
    to: compile_impact
  - from: draft_implementation
    to: compile_implementation
  - from: compile_excellence
    to: compile_v1
  - from: compile_impact
    to: compile_v1
  - from: compile_implementation
