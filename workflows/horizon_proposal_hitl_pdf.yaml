  - from: evaluate_final
    to: submission_gate
  - from: consistency_gate
    to: submission_gate
  - from: submission_gate
    to: approve_submission
  - from: approve_submission
    to: figure_embedder
  - from: generate_figure_oro_chain
    to: figure_embedder
  - from: generate_figure_impact_pathways
    to: figure_embedder
  - from: generate_figure_workplan
    to: figure_embedder
  - from: figure_embedder
    to: render_submission_pdf
