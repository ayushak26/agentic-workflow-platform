name: Horizon Proposal Engineering - Human Reviewed PDF
description: >-
  Human-in-the-loop Horizon Europe proposal-engineering workflow from concept
  note to submission-style Part B PDF. It pauses for evidence approval, concept
  selection, editable full-draft review, and final submission approval. All LLM
  work uses task-aware Auto routing; independent evaluators remain explicitly
  separated by provider. Human approval never removes deterministic evidence,
  consistency, completeness, evaluation, or page-limit checks. Evidence is
  enriched with supplementary live web search and an optional supporting
  image's analysis (both visible to the evidence-approval gate, clearly
  separated from verified claims); three evaluator-relevant figures are
  generated and embedded in the rendered PDF.
version: "2.0"
use_case: eu_proposal
inputs:
  concept_note:
    type: file
    description: The proposal concept note and project idea.
    required: true
    multiple: true
    max_files: 5
    accept: [pdf, document, markdown, presentation]
  call_documents:
    type: file
    description: Authoritative topic text, conditions, Part B template, and guidance.
    required: true
    multiple: true
    max_files: 10
    accept: [pdf, document, markdown, presentation]
  consortium_documents:
    type: file
    description: Partner profiles, roles, countries, facilities, pilot sites, and person-month facts.
    required: true
    multiple: true
    max_files: 20
    accept: [pdf, document, markdown, presentation, spreadsheet]
  workplan_budget_documents:
    type: file
    description: Work packages, tasks, deliverables, milestones, timing, resources, risks, and budget facts.
    required: true
    multiple: true
    max_files: 20
    accept: [pdf, document, markdown, presentation, spreadsheet]
  proposal_metadata:
    type: json
    description: >-
      Renderer metadata object, for example proposal_title, acronym, call_id,
      action_type, consortium_name, part_label, and version.
    required: true
  supporting_image:
    type: file
    description: >-
      Optional single image worth understanding on its own — a diagram,
      scanned certificate/letter of support, org chart, or partner photo.
      Leave empty if none applies; nothing downstream depends on it.
    required: false
    multiple: false
    accept: [image]
nodes:
  - id: load_concept
    type: WorkflowFileLoader
    config:
      files: "{{inputs.concept_note}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: load_call
    type: WorkflowFileLoader
    config:
      files: "{{inputs.call_documents}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: load_consortium
    type: WorkflowFileLoader
    config:
      files: "{{inputs.consortium_documents}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: load_workplan_budget
    type: WorkflowFileLoader
    config:
      files: "{{inputs.workplan_budget_documents}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: understand_supporting_image
    type: KimiVisionAgent
    config:
      image: "{{inputs.supporting_image}}"
      prompt: >-
        Describe this image and extract anything relevant to a Horizon Europe
        Part B proposal: diagrams (architecture, methodology, work packages),
        organisation charts, data/results visualisations, certificates,
        letters of support, or similar. Separate what you observe directly
        from any inference. If the image carries no proposal-relevant
        information, say so plainly.
      vision_model: kimi-k3

  - id: call_intelligence
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - gpt-5.6-sol
      - gpt-5
      - gpt-5-mini
      - claude-opus-5
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 12000
      output_schema:
        call_identity: object
        expected_outcomes: list
        scope_requirements: list
        mandatory_conditions: list
        evaluation_priorities: list
        exclusions: list
        page_and_format_rules: object
        unresolved_call_questions: list
      prompt_template: |
        Extract an atomic, traceable Horizon call checklist from the supplied
        authoritative documents. Separate expected outcomes, scope,
        mandatory/eligibility conditions, evaluator priorities, exclusions,
        and page/format rules. Do not infer missing rules.

        CALL DOCUMENTS:
        {{load_call.text}}

  - id: research_context_query
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - gpt-5
      - gpt-5-mini
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: economy
      prefer_low_latency: true
    config:
      model: gpt-5-mini
      max_tokens: 500
      output_schema:
        query: str
      prompt_template: |
        Write exactly one concise, high-signal web search query (plain text,
        no quotes, no boolean operators) to find recent, publicly available
        context for this Horizon Europe proposal that scholarly databases are
        unlikely to surface well: things like adjacent open calls, relevant
        EU policy or strategy documents, funded projects working on a similar
        problem, or recent sector news. Base it on the actual topic below, not
        a generic template.

        CONCEPT NOTE:
        {{load_concept.text}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

  - id: web_search
    type: WebSearchAgent
    config:
      query: "{{research_context_query.parsed.query}}"
      provider: openai
      top_k: 8
      fallback_to_openai: true

  - id: normalise_source_graph
    type: GraphNormalizer
    selected_model: auto
    allowed_models:
      - gpt-5.6-sol
      - gpt-5
      - claude-opus-5
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 32000
      concept_note: |
        CONCEPT NOTE:
        {{load_concept.text}}

        CONSORTIUM FACTS:
        {{load_consortium.text}}

        WORK-PLAN AND BUDGET FACTS:
        {{load_workplan_budget.text}}
      call_facts: |
        CALL DOCUMENTS:
        {{load_call.text}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

  - id: discover_evidence
    type: ScholarlyCandidateDiscoveryAgent
    selected_model: auto
    allowed_models:
      - gpt-5
      - gpt-5-mini
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: balanced
      prefer_low_latency: true
    config:
      model: gpt-5
      max_results_per_source: 3
      max_candidates_per_claim: 10
      max_claims: 30
      claim_types: [state_of_art, problem, impact, method]
      require_contradiction_search: true

  - id: acquire_full_text
    type: ResearchSourceAcquirer
    config:
      candidates: "{{discover_evidence.candidates}}"
      fail_when_none_acquired: false

  - id: verify_evidence
    type: ProposalEvidenceFactoryAgent
    selected_model: auto
    allowed_models:
      - gpt-5.6-sol
      - gpt-5
      - claude-opus-5
      - claude-sonnet-4-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      candidates: "{{discover_evidence.candidates}}"
      documents: "{{acquire_full_text.documents}}"
      search_audit: "{{discover_evidence.search_audit}}"
      rejected_candidates: "{{acquire_full_text.rejected_candidates}}"
      max_passages_per_document: 10

  - id: call_coverage
    type: CallCoverageMatrixAgent
    config: {}

  - id: research_documentation
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 16000
      output_schema:
        cited_sources: list
        bibliography_formatted: str
        web_search_references: list
        candidate_sources_considered: list
        citation_coverage_summary: object
      prompt_template: |
        Produce a standalone, audit-ready research-documentation record for
        this proposal run. This is not proposal text — it is the evidence
        paper trail: every research source cited, every web link consulted,
        and what was found but not used. Never invent a source, URL, DOI, or
        detail not present in the supplied records.

        cited_sources: one entry per citation ID in the verified citation
        registry — id, title, authors (if known), year, source type
        (official/peer_reviewed/standard/dataset/project/market/partner),
        URL or DOI, exact locator used, verification status, and the exact
        Part B subsection(s) it supports. Use [UNKNOWN] for any missing
        bibliographic field rather than guessing.

        bibliography_formatted: a clean, numbered reference list built only
        from cited_sources, ready to paste into an evidence annex.

        web_search_references: one entry per web-search result actually
        surfaced in the supplementary web context — the query that found it,
        title, URL, why it was consulted, and whether it ended up informing
        the proposal. Label these clearly as situational/contextual, never
        as citable evidence.

        candidate_sources_considered: discovery candidates that were found
        but never promoted to verified evidence, each with a rejection
        reason (unverified, contradicted, superseded, off-topic, duplicate).
        If more than ~40 candidates were considered, group by rejection
        reason with representative examples instead of listing every one.

        citation_coverage_summary: counts of candidates discovered,
        acquired in full text, verified, cited in the final citation
        registry, rejected, and web-search-only references.

        CITATION REGISTRY:
        {{verify_evidence.citation_registry}}

        VERIFIED CLAIMS:
        {{verify_evidence.verified_claims}}

        DISCOVERY CANDIDATES:
        {{discover_evidence.candidates}}

        SEARCH AUDIT:
        {{discover_evidence.search_audit}}

        WEB SEARCH RESULTS:
        {{web_search.results}}

        EVIDENCE QA:
        {{verify_evidence.qa_report}}

  - id: approve_evidence
    type: HumanInLoopAgent
    config:
      question: >-
        Review the verified evidence pack, rejected sources, contradictions,
        evidence blockers, call coverage, and any supplementary web/image
        context. Approve, reject, or edit the proposal-safe synthesis before
        concept selection?
      context_fields:
        - verify_evidence.qa_report
        - verify_evidence.blocking_issues
        - verify_evidence.rejected_candidates
        - call_coverage.rows
        - verify_evidence.proposal_ready_cited_markdown
        - web_search.results
        - understand_supporting_image.analysis
      editable_content_field: verify_evidence.proposal_ready_cited_markdown
      allowed_actions: [approve, reject, edit]

  - id: concept_alternatives
    type: ConceptAlternativesAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      concept_note: "{{load_concept.text}}"

  - id: select_concept
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 8000
      output_schema:
        selected_concept_id: str
        selection_rationale: str
        retained_strengths: list
        risks_to_control: list
        assumptions_requiring_evidence: list
      prompt_template: |
        Recommend the strongest credible concept posture. Prioritise complete
        call coverage, verified ambition, consortium capability, feasibility,
        and evaluator strength. Do not select an option whose required
        capabilities or evidence are absent.

        ALTERNATIVES:
        {{concept_alternatives.alternatives}}

        CALL COVERAGE:
        {{call_coverage}}

        APPROVED EVIDENCE SYNTHESIS:
        {{verify_evidence.proposal_ready_cited_markdown}}

  - id: approve_concept
    type: HumanInLoopAgent
    config:
      question: >-
        Review the recommended concept posture, alternatives, assumptions, and
        call coverage. Approve, reject, or edit the selected concept record
        before the Part B architecture is created?
      context_fields:
        - concept_alternatives.alternatives
        - select_concept.parsed
        - call_coverage.blocking_requirement_ids
      editable_content_field: select_concept.parsed
      allowed_actions: [approve, reject, edit]

  - id: proposal_blueprint
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 34000
      output_schema:
        identity_and_narrative: object
        objective_result_outcome_chain: object
        state_of_art_and_innovations: object
        methodology_and_validation: object
        impact_pathways_and_kpis: object
        work_packages_tasks_deliverables: object
        consortium_and_resources: object
        risks_and_mitigations: object
        cross_cutting_compliance: object
        section_page_budget: object
        figure_and_table_plan: object
        unresolved_inputs: list
        specific_objectives_table: object
        ambitions: object
        pilot_strategy: object
        linked_research_activities: object
        ssh_integration: object
        gender_dimension: object
        data_management_open_science: object
        pestel_analysis: object
        dissemination_communication_plan: object
        post_project_dissemination: object
        exploitation_strategy: object
        policy_impact_strategy: object
        impact_summary: object
        work_plan_timing: object
      prompt_template: |
        Build the master Horizon Part B blueprint for the human-approved
        concept. Map each call requirement to sections, results, owners,
        verified evidence, KPIs, work packages, tasks, deliverables,
        milestones, dependencies and risks where grounded. Plan
        evaluator-useful tables and figures. Mark missing facts
        [INPUT NEEDED: exact item].

        Determine the hard page limit from the call metadata, not by
        default: a confirmed lump-sum RIA/IA topic gets a 45-page hard limit
        with a 44-page working target; a standard (non-lump-sum) full
        proposal gets the normal 40-page hard limit with a 39-page working
        target. If the funding model cannot be confirmed, default to the
        stricter 40-page profile and record the ambiguity in
        unresolved_inputs.

        Cover every one of these subsections explicitly — each maps to the
        output field named after it, and none may be silently skipped:
        1.1.1 one row per approved objective — never force the count to
        match a template's blank SO1-SO5 placeholders — each giving SO id,
        specific objective, target outcome, KPI, baseline, target value,
        verification route and the call requirement it answers ->
        specific_objectives_table. 1.1.2 ambitions: the central ambition,
        state of the art, and what goes beyond it -> ambitions. 1.2.2 pilot
        strategy -> pilot_strategy. 1.2.4 linked research and innovation
        activities this project builds on -> linked_research_activities.
        1.2.5 interdisciplinary approach and SSH integration ->
        ssh_integration. 1.2.6 gender dimension -> gender_dimension: treat
        gender relevance in research content (variables, disaggregation,
        bias controls) as its own topic, separate from workforce/team
        balance. 1.2.7 data management and open science practices (data
        types, FAIR handling, open-access routes) ->
        data_management_open_science. 2.1.3 requirements and potential
        barriers beyond the project's scope: a concrete PESTEL (Political,
        Economic, Social, Technological, Environmental, Legal) analysis
        specific to this call, never generic boilerplate -> pestel_analysis,
        with each barrier carrying a category, the external condition,
        likelihood, consequence, project response and a responsible monitor
        — these are external conditions beyond the project's control, never
        to be restated as an internal implementation risk in
        risks_and_mitigations, and vice versa. 2.2.1-2.2.2 dissemination
        strategy, measures and communication strategy ->
        dissemination_communication_plan. 2.2.3 activities after the project
        ends -> post_project_dissemination. 2.2.4 exploitation strategy ->
        exploitation_strategy: one key exploitable result (KER) per row,
        each with an owner, target users, value proposition, protection/IPR
        route, exploitation route and time to uptake. 2.2.5 multi-level
        policy impact strategy -> policy_impact_strategy, closing with a
        short summary of impact -> impact_summary. 3.1.1 timing of work
        packages -> work_plan_timing.

        Treat any blank placeholder label (e.g. an empty "SO1"/"A1" slot) or
        example/template project name found in a supplied document as a
        structural cue only, never as approved content — do not let either
        leak into the blueprint.

        In figure_and_table_plan, for each planned figure give a short stable
        slug (used later to match a generated image to its slot) and the exact
        evaluator-relevant content it must show. Plan only evaluator-useful
        figures — never decoration.

        APPROVED CONCEPT:
        {{select_concept.parsed}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

        APPROVED EVIDENCE (verified, citation-annotated narrative from
        verify_evidence):
        {{verify_evidence.proposal_ready_cited_markdown}}

        CONSORTIUM:
        {{load_consortium.text}}

        WORK PLAN AND BUDGET:
        {{load_workplan_budget.text}}

  - id: generate_figure_oro_chain
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the causal chain from project objectives
        through results and outcomes to wider impact, using ONLY this grounded
        content — do not invent additional boxes, labels or numbers:

        {{proposal_blueprint.parsed.objective_result_outcome_chain}}

  - id: generate_figure_impact_pathways
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the pathway from project results to outcomes to
        the topic's expected impacts, using ONLY this grounded content — do
        not invent additional boxes, labels or numbers:

        {{proposal_blueprint.parsed.impact_pathways_and_kpis}}

  - id: generate_figure_workplan
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the work-package structure and dependencies
        (boxes and arrows only, no dates/Gantt bars unless explicitly present
        below), using ONLY this grounded content — do not invent additional
        work packages, labels or numbers:

        {{proposal_blueprint.parsed.work_packages_tasks_deliverables}}

  - id: draft_excellence
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 32000
      prompt_template: |
        Draft proposal-ready Markdown for the full Excellence section:
        objectives and ambition, relation to the work programme, state of the
        art and advances, and detailed methodology. Build the objective table
        directly from proposal_blueprint.parsed.specific_objectives_table
        (columns: SO | Specific objective | Target outcome | KPI | Baseline |
        Target value | Verification | Call requirement) — one row per
        approved objective; never force the count to match blank SO1-SO5
        placeholders in any supplied template. Use only verified citation
        IDs. Cover interdisciplinarity, validation, open science, SSH and the
        gender dimension where relevant — treat the gender dimension as
        research-content relevance (variables, disaggregation, bias
        controls), a separate topic from workforce or team gender balance.
        Preserve [INPUT NEEDED] markers.

        Where the objective -> result -> outcome -> impact chain diagram
        belongs, insert exactly this marker on its own line, unmodified:
        [[IMAGE PROMPT: Figure 1 - Objective-Result-Outcome-Impact Chain]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT: {{proposal_blueprint.parsed}}
        EVIDENCE: {{verify_evidence.proposal_ready_cited_markdown}}
        CITATIONS: {{verify_evidence.citation_registry}}

  - id: draft_impact
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 32000
      prompt_template: |
        Draft proposal-ready Markdown for the full Impact section: credible
        pathways to every call outcome, scale and significance, KPIs,
        barriers and assumptions, dissemination, exploitation, communication,
        IP and uptake. Ground the barriers analysis in
        proposal_blueprint.parsed.pestel_analysis (the six-category PESTEL
        record: political, economic, social, technological, environmental,
        legal) — these are external conditions only; never restate one as an
        internal implementation risk (those belong solely in the
        Implementation section). For exploitation, give each key exploitable
        result (KER) in proposal_blueprint.parsed.exploitation_strategy its
        own owner, target users, value proposition, protection/IPR route and
        exploitation route. Each quantitative KPI needs baseline, target,
        unit, source, owner and date or [INPUT NEEDED].

        Where the impact-pathways diagram belongs, insert exactly this marker
        on its own line, unmodified:
        [[IMAGE PROMPT: Figure 2 - Impact Pathways]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT: {{proposal_blueprint.parsed}}
        CALL OUTCOMES: {{call_intelligence.parsed.expected_outcomes}}
        EVIDENCE: {{verify_evidence.proposal_ready_cited_markdown}}

  - id: draft_implementation
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 32000
      prompt_template: |
        Draft proposal-ready Markdown for the full Implementation section:
        work plan, WPs, tasks, deliverables, milestones, dependencies, critical
        path, consortium complementarity, resources, lump-sum coherence,
        governance, quality, data and risk. These implementation risks must
        be distinct from the external PESTEL barriers already captured in
        the Impact section — do not duplicate them. Preserve exact partner
        and numeric facts. Add readable tables. Missing facts remain
        [INPUT NEEDED].

        Where the work-package structure diagram belongs (after the WP list),
        insert exactly this marker on its own line, unmodified:
        [[IMAGE PROMPT: Figure 3 - Work Package Structure]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT: {{proposal_blueprint.parsed}}
        CONSORTIUM: {{load_consortium.text}}
        WORK PLAN AND BUDGET: {{load_workplan_budget.text}}

  - id: draft_cross_cutting
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 16000
      prompt_template: |
        Draft the cross-cutting material to integrate into the three scored
        sections: multi-actor approach, gender, SSH, open science/FAIR, DMP,
        ethics, GDPR, security, DNSH, standardisation, synergies, policy
        alignment, and practice abstracts where the call requires them. Treat
        gender as research-content relevance (variables, disaggregation, bias
        controls), a separate topic from workforce or team gender balance.
        Missing evidence or implementation detail remains [INPUT NEEDED].

        CALL CHECKLIST: {{call_intelligence.parsed}}
        BLUEPRINT: {{proposal_blueprint.parsed}}
        SOURCE WARNINGS: {{normalise_source_graph.warnings}}

  # ---- Compilation is split by evaluated criterion (Excellence / Impact /
  # Implementation) instead of one monolithic pass. A ~40-45 page proposal
  # is realistically 30,000-45,000+ output tokens once tables and figures
  # are counted, which exceeds what a single TransformAgent call can safely
  # emit without silent truncation (TransformAgent has no way to detect a
  # cut-off response when no output_schema is set). Each compile_*/revise_*
  # stage below only has to hold its own criterion's page budget (well under
  # its max_tokens), and the actual "compile_v1"/"final_revision" documents
  # are produced by TextAssemblerAgent - a deterministic, non-LLM join - so
  # the full-document assembly step itself can never truncate. The
  # cross-cutting draft is fanned into all three compiles since its content
  # (multi-actor, gender, SSH, open science, DMP, ethics, GDPR, security,
  # DNSH, standardisation, synergies, policy, practice abstracts) belongs
  # spread across all three criteria, not merged as a fourth section.
  - id: compile_excellence
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 20000
      prompt_template: |
        Assemble the coherent "1 Excellence" section only. Fold in the
        interdisciplinarity, SSH and gender-dimension material from
        CROSS-CUTTING that belongs in Excellence. Remove duplication, align
        identifiers and terminology, retain citations and all [INPUT NEEDED]
        markers, and do not add facts. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Start with the "# 1 Excellence"
        heading.

        EXCELLENCE:
        {{draft_excellence.raw}}

        CROSS-CUTTING (use only the parts relevant to Excellence):
        {{draft_cross_cutting.raw}}

  - id: compile_impact
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 12000
      prompt_template: |
        Assemble the coherent "2 Impact" section only. Fold in the
        multi-actor, policy-alignment and practice-abstract material from
        CROSS-CUTTING that belongs in Impact. Remove duplication, align
        identifiers and terminology, retain citations and all [INPUT NEEDED]
        markers, and do not add facts. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Start with the "# 2 Impact" heading.

        IMPACT:
        {{draft_impact.raw}}

        CROSS-CUTTING (use only the parts relevant to Impact):
        {{draft_cross_cutting.raw}}

  - id: compile_implementation
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 20000
      prompt_template: |
        Assemble the coherent "3 Implementation" section only. Fold in the
        open science/FAIR, DMP, ethics, GDPR, security, DNSH,
        standardisation and synergies material from CROSS-CUTTING that
        belongs in Implementation. Remove duplication, align identifiers
        and terminology, retain citations and all [INPUT NEEDED] markers,
        and do not add facts. Preserve every `[[IMAGE PROMPT: ...]]` marker
        exactly as it appears, verbatim, on its own line — never paraphrase,
        reformat, or drop it. Start with the "# 3 Implementation" heading.

        IMPLEMENTATION:
        {{draft_implementation.raw}}

        CROSS-CUTTING (use only the parts relevant to Implementation):
        {{draft_cross_cutting.raw}}

  - id: compile_v1
    type: TextAssemblerAgent
    config:
      separator: "\n\n"
      parts:
        - "{{compile_excellence.raw}}"
        - "{{compile_impact.raw}}"
        - "{{compile_implementation.raw}}"

  - id: approve_full_draft
    type: HumanInLoopAgent
    config:
      question: >-
        Review and edit the complete first Part B draft. Confirm scientific
        accuracy, partner commitments, work-plan ownership, KPIs, resources,
        ethics, call compliance, and remaining INPUT NEEDED markers before
        independent evaluation?
      context_fields:
        - compile_v1.text
        - verify_evidence.qa_report
        - call_coverage.blocking_requirement_ids
      editable_content_field: compile_v1.text
      max_edit_chars: 2000000
      allowed_actions: [approve, reject, edit]

  - id: evaluate_v1
    type: HorizonEvaluationAgent
    config:
      proposal_text: "{{compile_v1.text}}"
      generator_model: auto
      evaluator_models:
        - claude-sonnet-4-5
        - gpt-5
      criterion_threshold: 4.0
      total_threshold: 12.0

  - id: red_team_v1
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - gpt-5.6-sol
      - claude-opus-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 12000
      output_schema:
        blocking_gaps: list
        excellence_risks: list
        impact_risks: list
        implementation_risks: list
        evidence_and_citation_risks: list
        numerical_inconsistencies: list
        page_budget_actions: list
        safe_revision_instructions: list
      prompt_template: |
        Red-team the human-approved draft. Check call coverage, scientific and
        impact logic, citation fit, partner/WP/task consistency, KPI and budget
        contradictions, deliverables, milestones, risks, ethics, gender, SSH,
        open science, and page density. Confirm PESTEL barriers (Impact
        section) are never duplicated as implementation risks (Implementation
        section) and vice versa; confirm every KER has a distinct owner,
        target users, value proposition and exploitation route; confirm the
        gender-dimension content addresses research-content relevance, not
        only team or workforce balance. Give only actionable corrections. Tag
        each finding to its owning criterion so it lands in the matching
        *_risks list (excellence_risks, impact_risks, implementation_risks) -
        cross-cutting findings that do not belong to one criterion (evidence,
        numerical, page-budget) go in their own dedicated lists instead.

        DRAFT: {{compile_v1.text}}
        COVERAGE: {{call_coverage}}
        EVIDENCE QA: {{verify_evidence.qa_report}}

  # ---- Revision is likewise split per criterion. Each stage sees the whole
  # human-approved/edited draft (compile_v1.text, patched in place by
  # approve_full_draft if the human edited it) so no edit is lost, but is
  # instructed to return only its own section - so no single LLM call has to
  # hold the entire final ~40-45 page document in its output. final_revision
  # then deterministically joins the three revised sections.
  - id: revise_excellence
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 20000
      prompt_template: |
        From the human-approved draft below, produce the final submission
        candidate for ONLY the "1 Excellence" section. Apply independent
        evaluator and red-team recommendations relevant to this section only
        when grounded in the approved draft, source documents, or verified
        evidence. Improve logic, consistency, specificity and section
        balance. Never fabricate a partner fact, source, number, KPI, TRL,
        result, budget or timeline. Preserve unresolved [INPUT NEEDED]
        markers and valid citation IDs. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Return only the Excellence section -
        do not draft Impact or Implementation.

        HUMAN-APPROVED DRAFT (full document - extract and revise only
        Excellence):
        {{compile_v1.text}}

        EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the excellence_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to Excellence):
        {{red_team_v1.parsed}}

        CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: revise_impact
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 12000
      prompt_template: |
        From the human-approved draft below, produce the final submission
        candidate for ONLY the "2 Impact" section. Apply independent
        evaluator and red-team recommendations relevant to this section only
        when grounded in the approved draft, source documents, or verified
        evidence. Improve logic, consistency, specificity and section
        balance. Never fabricate a partner fact, source, number, KPI, TRL,
        result, budget or timeline. Preserve unresolved [INPUT NEEDED]
        markers and valid citation IDs. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Return only the Impact section - do
        not draft Excellence or Implementation.

        HUMAN-APPROVED DRAFT (full document - extract and revise only
        Impact):
        {{compile_v1.text}}

        EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the impact_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to Impact):
        {{red_team_v1.parsed}}

        CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: revise_implementation
    type: TransformAgent
    selected_model: auto
    allowed_models:
      - claude-opus-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: maximum
    config:
      model: claude-opus-5
      max_tokens: 20000
      prompt_template: |
        From the human-approved draft below, produce the final submission
        candidate for ONLY the "3 Implementation" section. Apply independent
        evaluator and red-team recommendations relevant to this section only
        when grounded in the approved draft, source documents, or verified
        evidence. Improve logic, consistency, specificity and section
        balance. Never fabricate a partner fact, source, number, KPI, TRL,
        result, budget or timeline. Preserve unresolved [INPUT NEEDED]
        markers and valid citation IDs. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Return only the Implementation
        section - do not draft Excellence or Impact.

        HUMAN-APPROVED DRAFT (full document - extract and revise only
        Implementation):
        {{compile_v1.text}}

        EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the implementation_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to Implementation):
        {{red_team_v1.parsed}}

        CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: final_revision
    type: TextAssemblerAgent
    config:
      separator: "\n\n"
      parts:
        - "{{revise_excellence.raw}}"
        - "{{revise_impact.raw}}"
        - "{{revise_implementation.raw}}"

  - id: evaluate_final
    type: HorizonEvaluationAgent
    config:
      proposal_text: "{{final_revision.text}}"
      generator_model: auto
      evaluator_models:
        - claude-sonnet-4-5
        - gpt-5
      criterion_threshold: 4.0
      total_threshold: 12.0

  - id: consistency_gate
    type: ConsistencyChecker
    config:
      block_on_warn: false

  - id: submission_gate
    type: ProposalSubmissionGate
    config:
      proposal_text: "{{final_revision.text}}"
      evidence_blockers: "{{verify_evidence.blocking_issues}}"
      consistency_gate: "{{consistency_gate.gate}}"
      consistency_findings: "{{consistency_gate.findings}}"
      evaluation_threshold_passed: "{{evaluate_final.threshold_passed}}"
      evaluation_total_score: "{{evaluate_final.total_score}}"
      evaluation_blockers: "{{evaluate_final.deterministic_blockers}}"
      minimum_proposal_characters: 20000
      require_evaluation_pass: true
      block_on_input_needed: true

  - id: approve_submission
    type: HumanInLoopAgent
    config:
      question: >-
        Final submission review: inspect the complete proposal, deterministic
        release-gate report, evidence blockers, independent scores, and
        remaining warnings. Approve, reject, or edit the final content before
        the submission PDF is generated?
      context_fields:
        - final_revision.text
        - submission_gate.report
        - evaluate_final.criteria
        - verify_evidence.qa_report
      editable_content_field: final_revision.text
      max_edit_chars: 2000000
      allowed_actions: [approve, reject, edit]

  - id: figure_embedder
    type: FigureEmbedder
    config:
      content: "{{final_revision.text}}"
      figures:
        - marker: "Figure 1 - Objective-Result-Outcome-Impact Chain"
          image: "{{generate_figure_oro_chain}}"
          alt_text: "Objective-result-outcome-impact chain diagram"
        - marker: "Figure 2 - Impact Pathways"
          image: "{{generate_figure_impact_pathways}}"
          alt_text: "Impact pathways diagram"
        - marker: "Figure 3 - Work Package Structure"
          image: "{{generate_figure_workplan}}"
          alt_text: "Work package structure diagram"

  - id: render_submission_pdf
    type: HorizonHTMLProposalRenderer
    config:
      content: "{{figure_embedder.content}}"
      content_format: markdown
      metadata: "{{inputs.proposal_metadata}}"
      citation_registry: "{{verify_evidence.citation_registry}}"
      evidence_qa: "{{verify_evidence.qa_report}}"
      evidence_blockers: "{{submission_gate.blockers}}"
      include_toc: true
      include_bibliography: true
      include_evidence_annex: true
      page_limit: 45
      enforce_page_limit: true

