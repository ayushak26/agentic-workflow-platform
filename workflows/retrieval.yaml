name: Retrieval Test
description: Exercises embedder + hybrid retrieval + rerank + compression via a RAG node.
version: '1.0'
inputs:
  question:
    type: text
  industry:
    type: text
nodes:
  - id: retrieve
    type: RAGAgent
    config:
      model: claude-sonnet-4-5
      query: "{{inputs.question}}"
      filters:
        industry: "{{inputs.industry}}"
      top_k_candidates: 25
      top_n_final: 5
edges: []