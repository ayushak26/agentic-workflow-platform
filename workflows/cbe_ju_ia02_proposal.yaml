name: "CBE JU IA-02 Proposal Generation"
description: >
  Generates a Horizon Europe Part B proposal for CBE JU topic
  HORIZON-JU-CBE-2026-IA-02 (Bio-based additives as alternatives to unlock and
  increase recyclability and/or biodegradability). Fan-out over the three
  official Part B sections (Excellence / Impact / Implementation), grounded by
  RAG retrieval over the ingested CBE JU AWP topic text + General Annexes, and
  informed by a web state-of-the-art scan. Produces a FULL illustrative draft:
  every section written at length, project-specific facts marked [TO CONFIRM].
  Fully automated, no human-in-loop gates. Template chain removed for this run.
version: "1.3"

# Explicit entry point. The compiler defaults to nodes[0]; sota_scan is listed
# first, so without this it would wrongly become the entry and call_intel would
# never run. Pin call_intel as the single root.
entry: call_intel

inputs:
  concept_note:
    type: text
    description: Applicant's project specifics. May be sparse or empty; drafters then write illustrative prose and mark unknowns [TO CONFIRM].
  annexes_collection_id:
    type: text
    description: Weaviate collection_id holding the ingested CBE JU AWP topic text + Horizon Europe General Annexes. RAG filters to this only.

nodes:

  # 0. Web state-of-the-art scan (MCP Agent over the MCP server). ------------
  #    The agent sees ALL server tools and chooses; system_prompt steers it to
  #    search_web. Output is fixed by the node: .answer holds the briefing.
  #    Until WEB_SEARCH_BACKEND is set, search_web returns [STUB RESULT] rows.
  - id: sota_scan
    type: MCPAgent
    config:
      model: claude-opus-4-8
      max_iterations: 5
      system_prompt: >
        You are a research agent. Use the search_web tool to gather recent
        state-of-the-art evidence. Prefer search_web over the document tools
        for this task. Return a concise briefing and include the source URLs
        you relied on. Mark anything uncertain.
      objective: >
        Gather recent state-of-the-art context for bio-based additives that
        unlock or increase recyclability and/or biodegradability of plastics
        and packaging: current additive chemistries, feedstocks, recycling
        compatibility, biodegradation standards, EU circular-economy and SSbD
        policy direction, and competing or prior approaches.

  # 1. Parse the call into a structured requirement set. ----------------------
  - id: call_intel
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        You are a Horizon Europe proposal analyst. Read the CBE JU topic
        HORIZON-JU-CBE-2026-IA-02 ("Bio-based additives as alternatives to
        unlock and increase recyclability and/or biodegradability"), an
        Innovation Action.

        Applicant concept note (MAY be sparse or empty):
        ---
        {{inputs.concept_note}}
        ---

        Extract a structured requirement set the proposal MUST satisfy. IA =>
        expected TRL 6-7 at project end. Hard constraints for this topic:
        multi-actor approach (waste management, product manufacturers, brand
        owners, consumers, from early stages); demonstrate at least TRL 6
        compatibility/processability of the bio-based additive; validate the
        chosen circular end-of-life route (mechanical, chemical, organic or
        enzymatic recycling, and/or biodegradation in soil/water per
        EU/international standards); prevent release of harmful chemicals across
        the life cycle; Safe and Sustainable by Design (SSbD).
        Where the concept note does not specify something, still list the
        requirement and note it as applicant-to-decide.
      output_schema:
        topic_id: str
        action_type: str
        target_trl: str
        mandatory_requirements: list
        eol_route_in_scope: list
        multi_actor_roles: list
        ssbd_obligations: list
        expected_impacts: list

  # 2. Retrieve binding rules from the ingested Annexes. ---------------------
  - id: rules_retrieval
    type: RAGAgent
    config:
      model: claude-opus-4-8
      filters:
        collection_id: "{{inputs.annexes_collection_id}}"
      top_k: 12
      query: >
        Part B page limit and structure, evaluation criteria (excellence,
        impact, implementation), TRL definitions, eligibility and consortium
        composition, ethics and security, gender equality plan, open science,
        budget categories and funding rate for Innovation Actions in CBE JU /
        Horizon Europe General Annexes.

  # 3a-c. Three Part B section drafters, fan-out in parallel. -----------------
  - id: draft_excellence
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft Section 1 (EXCELLENCE) of a Horizon Europe Part B for CBE JU
        topic {{call_intel.parsed.topic_id}} (Innovation Action). Write the FULL
        section at length, target ~15 pages of substantive prose.

        Concept note (may be sparse): {{inputs.concept_note}}
        Structured requirements: {{call_intel.parsed}}
        Binding rules retrieved: {{rules_retrieval.answer}}
        Web state-of-the-art briefing (BACKGROUND only, cite URLs when used):
        {{sota_scan.answer}}

        Cover in full:
        1.1 Objectives and ambition - the bio-based additive(s), target
            material/product, the circularity bottleneck, measurable objectives,
            and ambition beyond the state of the art (use the SOTA briefing).
        1.2 Methodology - technical approach, additive chemistry and feedstock,
            processability, EoL route validation plan, SSbD assessment, risk
            methodology, interdisciplinary and multi-actor approach, gender
            dimension where relevant.

        DRAFT MODE: write realistic, detailed illustrative prose throughout. Do
        not leave any sub-section thin. Tag every project-specific fact not
        given in the concept note as [TO CONFIRM: ...]. Cite a source URL when
        you rely on a web finding; never present web background as a project
        fact. Output Markdown with proper sub-headings.
      output_schema:
        section_title: str
        markdown: str
        page_estimate: int
        to_confirm: list

  - id: draft_impact
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft Section 2 (IMPACT) of the Part B for CBE JU topic
        {{call_intel.parsed.topic_id}}. Write the FULL section, target ~12 pages.

        Concept note (may be sparse): {{inputs.concept_note}}
        Structured requirements: {{call_intel.parsed}}
        Expected impacts: {{call_intel.parsed.expected_impacts}}
        Binding rules retrieved: {{rules_retrieval.answer}}
        Web state-of-the-art / market briefing (BACKGROUND only):
        {{sota_scan.answer}}

        Cover in full:
        2.1 Pathways towards impact - link results to the call's expected
            outcomes and to circular bioeconomy / SSbD policy goals.
        2.2 Measures to maximise impact - dissemination, exploitation,
            communication, IP strategy, market acceptance via the multi-actor
            approach.
        2.3 Summary impact canvas (scale, significance, timeframe, KPIs).

        DRAFT MODE: full illustrative prose. Tag project-specific metrics and
        claims not given as [TO CONFIRM: ...]. Cite URLs for web-sourced market
        or policy context. Output Markdown.
      output_schema:
        section_title: str
        markdown: str
        page_estimate: int
        to_confirm: list

  - id: draft_implementation
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft Section 3 (IMPLEMENTATION) of the Part B for CBE JU topic
        {{call_intel.parsed.topic_id}}. Write the FULL section, target ~10 pages.

        Concept note (may be sparse): {{inputs.concept_note}}
        Structured requirements: {{call_intel.parsed}}
        Multi-actor roles required: {{call_intel.parsed.multi_actor_roles}}
        Binding rules retrieved: {{rules_retrieval.answer}}

        Cover in full:
        3.1 Work plan and resources - work package structure, deliverables,
            milestones, PERT/Gantt narrative, effort table, resource
            justification for an IA.
        3.2 Consortium - partner ROLES covering the mandatory multi-actor set
            (waste management, manufacturer, brand owner, consumer), with
            complementarity and TRL-6 demonstration capacity.

        DRAFT MODE: write full illustrative work packages and an illustrative
        consortium structure described by ROLE. CRITICAL: the applicant has not
        chosen partners or budget yet - tag every specific partner name, budget
        figure and date as [TO CONFIRM: ...]. Describe what each role must do;
        do NOT invent named organisations as if real. Represent tables as
        Markdown tables. Output Markdown.
      output_schema:
        section_title: str
        markdown: str
        page_estimate: int
        to_confirm: list

  # 4. Fan-in: compile + QA, emit per-section parsed output. ------------------
  - id: compile_and_qa
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        You are doing a QA pass over a Horizon Europe Part B whose three
        sections have already been drafted. DO NOT reproduce the sections -
        they flow to the renderer directly. Produce ONLY a submission-readiness
        assessment.

        Excellence:     {{draft_excellence.parsed.markdown}}
        Impact:         {{draft_impact.parsed.markdown}}
        Implementation: {{draft_implementation.parsed.markdown}}
        Binding rules:  {{rules_retrieval.answer}}

        Produce a single Markdown "readiness" assessment covering:
        - Coverage: does the draft address every mandatory requirement and
          expected impact? List any gaps.
        - Page budget: ~45 pages total; flag any over/under-length section.
        - To-Confirm Checklist: collate ALL [TO CONFIRM: ...] tags into one
          list - the project-specific decisions the applicant must fill
          (additive specifics, KPIs, partners, budget, dates).
        - Compliance: confirm multi-actor approach, TRL 6+ demonstration, EoL
          validation and SSbD framing are each present; flag if missing.

        Return ONLY the readiness field. Keep it concise - it is an assessment,
        not a copy of the proposal.
      output_schema:
        readiness: str

  # 5. Render the styled PDF. ------------------------------------------------
  #    Section bodies flow straight from the drafters (they already produced
  #    the finalised markdown); compile_and_qa supplies only the readiness
  #    assessment. This avoids one giant call re-emitting ~40 pages.
  - id: generate_pdf
    type: PDFProposalRenderer
    config:
      sections:
        "1. Excellence": "{{draft_excellence.parsed.markdown}}"
        "2. Impact": "{{draft_impact.parsed.markdown}}"
        "3. Implementation": "{{draft_implementation.parsed.markdown}}"
        "Submission Readiness": "{{compile_and_qa.parsed.readiness}}"
      template: corporate
      proposal_title: "CBE JU IA-02 - Bio-based Additives Proposal (Part B) - DRAFT"
      client_name: "CBE JU / Horizon Europe"

# ---------------------------------------------------------------------------
# Edges
#   call_intel -> rules_retrieval ---+
#   sota_scan -----------------------+--> [3 drafters] -> compile -> pdf
#   call_intel is the SINGLE root (compiler wires START to one entry).
#   Both rules_retrieval and sota_scan descend from it, then fan into drafters.
# ---------------------------------------------------------------------------
edges:
  - from: call_intel
    to: rules_retrieval
  - from: call_intel
    to: sota_scan

  - from: rules_retrieval
    to: draft_excellence
  - from: sota_scan
    to: draft_excellence

  - from: rules_retrieval
    to: draft_impact
  - from: sota_scan
    to: draft_impact

  - from: rules_retrieval
    to: draft_implementation

  - from: draft_excellence
    to: compile_and_qa
  - from: draft_impact
    to: compile_and_qa
  - from: draft_implementation
    to: compile_and_qa

  - from: compile_and_qa
    to: generate_pdf