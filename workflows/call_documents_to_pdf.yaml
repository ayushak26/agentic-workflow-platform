name: Call Documents to PDF
description: >-
  Load uploaded call documents (PDF, DOCX, spreadsheets, Markdown), normalise them into a single
  structured Markdown brief, then render a clean, paginated PDF with cover page and table of
  contents.
version: '1.0'
use_case: document_conversion
inputs:
  call_documents:
    type: file
  document_title:
    type: text
  organisation:
    type: text
entry: load_call_documents
exit: render_call_pdf
nodes:
  - id: load_call_documents
    type: WorkflowFileLoader
    config:
      files: '{{inputs.call_documents}}'
      max_chars_per_file: 120000
      fail_on_unreadable: false
  - id: structure_call_text
    type: TransformAgent
    config:
      model: gpt-5
      system_prompt: >-
        You are a proposal engineering assistant. You reorganise raw call documentation into a
        faithful, well-structured Markdown document. You never invent facts, deadlines, budgets, or
        eligibility rules that are not present in the source text. If information is missing, write
        "Not stated in the call documents."
      prompt_template: |
        Convert the following raw call document text into a single clean
        Markdown document suitable for PDF rendering.

        Required structure:
        # {{inputs.document_title}}
        ## 1. Call Identification (call ID, topic, programme, type of action)
        ## 2. Scope and Expected Outcomes
        ## 3. Eligibility and Consortium Requirements
        ## 4. Budget and Funding Rate
        ## 5. Deadlines and Submission Process
        ## 6. Evaluation Criteria
        ## 7. Key Obligations and Annexes
        ## 8. Open Questions / Missing Information

        Rules:
        - Preserve exact figures, dates, and identifiers verbatim.
        - Use tables for budget, deadlines, and evaluation criteria.
        - Use bullet lists for requirements.
        - Do not add commentary outside the structure above.

        RAW CALL DOCUMENT TEXT:
        {{load_call_documents.text}}
      temperature: 0.1
      max_tokens: 8000
      max_retries: 2
    selected_model: auto
    model_routing:
      accuracy_priority: maximum
      prefer_low_latency: false
  - id: render_call_pdf
    type: HorizonHTMLProposalRenderer
    config:
      content: '{{structure_call_text.parsed}}'
      content_format: markdown
      metadata:
        title: '{{inputs.document_title}}'
        organisation: '{{inputs.organisation}}'
        document_type: Call Documentation Summary
      include_toc: true
      include_bibliography: false
      include_evidence_annex: false
      enforce_page_limit: false
      max_content_characters: 400000
edges:
  - from: load_call_documents
    to: structure_call_text
  - from: structure_call_text
    to: render_call_pdf
