name: Database Lookup Smoke Test
description: >-
  Standalone smoke test for StructuredDatasetRetrieverAgent and the
  PublicDatabaseLookupService (Eurostat client). StructuredDatasetRetrieverAgent
  only accepts queries whose claim_id exists in the Proposal Graph, so
  seed_claim (a minimal GraphNormalizer call) first extracts exactly one
  testable claim from a literal fixture concept note; database_lookup then
  auto-plans and executes a bounded Eurostat query against that claim.
  Inspect database_lookup.records, .audit (count_reconciliation, row hashes,
  snapshot_object_key), and .unresolved_questions in the run output —
  records_retrieved should be > 0 and audit[0].count_reconciliation.complete
  should be true.
version: "1.0"
use_case: platform_validation

inputs: {}

nodes:
  - id: seed_claim
    type: GraphNormalizer
    config:
      model: gpt-5-mini
      max_tokens: 3000
      concept_note: |
        CONCEPT NOTE (TEST FIXTURE — single claim only):
        This pilot project's proposal claims that real GDP per capita in
        Germany and France differs measurably between 2023 and 2024,
        according to official Eurostat national accounts data (dataset
        nama_10_gdp, unit CLV10_MEUR, geo DE and FR). Extract exactly this
        one factual claim; do not invent objectives, partners, or other
        graph objects.
      call_facts: |
        TEST CALL CONTEXT:
        No official call template applies. This is a standalone smoke test
        for the official-database evidence retrieval pipeline; treat the
        concept note above as the only source of truth.

  - id: database_lookup
    type: StructuredDatasetRetrieverAgent
    selected_model: gpt-5-mini
    config:
      queries: []
      research_briefs:
        - brief_id: RB-TEST-DB-1
          track: state_of_art
          question: >-
            What is real GDP per capita for Germany and France for 2023 and
            2024 according to Eurostat dataset nama_10_gdp?
          purpose: >-
            Smoke-test bounded Eurostat retrieval, row hashing, and count
            reconciliation.
          required_source_types: [official, dataset]
      candidate_context: []
      auto_plan_queries: true
      model: gpt-5-mini
      max_queries: 2
      max_api_calls: 3
      max_records: 50
      max_response_bytes: 5242880
      request_timeout_seconds: 30
      fail_when_no_records: false

edges:
  - from: seed_claim
    to: database_lookup

entry: seed_claim
exit: database_lookup

output:
  include_input: false
  nodes:
    - node_id: seed_claim
      flatten: false
    - node_id: database_lookup
      flatten: true
