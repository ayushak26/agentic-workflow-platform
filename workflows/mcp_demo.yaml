name: "MCP Demo"
description: "MCPAgent answering the same kind of question as RAGAgent — for comparison."
version: "1.0"

inputs:
  user_question:
    type: text

nodes:
  - id: research
    type: MCPAgent
    config:
      model: "claude-sonnet-4-5"
      objective: "{{inputs.user_question}}"
      max_iterations: 5

edges: []