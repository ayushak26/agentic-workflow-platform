name: "Biomass Monitoring Proposal — Excellence (tech + non-tech)"
description: "HE Cluster 6 biomass Part B: Excellence + Objectives & Ambition, technical + non-technical, RAG-grounded. Sequential edges (drafters wait for retrieval)."
version: "2.3-rag"

entry: call_intel

inputs:
  concept_note:
    type: text
    description: Applicant project specifics. May be sparse; drafters mark unknowns [TO CONFIRM].
  collection_id:
    type: text
    description: Pre-registered corpus scope. Use "biomass_monitoring".
  session_id:
    type: text
    description: Isolation boundary. Use "demo-biomass".

nodes:
  - id: call_intel
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        You are a Horizon Europe proposal strategist. Given the call and the
        applicant Concept Note, extract the spine for Section 1 Excellence /
        Objectives & Ambition.

        CALL (Cluster 6 biomass monitoring) required activities: administration-
        light biomass monitoring & modelling digital tools at regional/national/
        continental scale; updated EU biomass supply/demand estimate to 2050 with
        scenarios; biomass reporting across >=10 European countries. Cross-cutting:
        sustainability, biodiversity, air/water/soil pollution, food-security guardrail.

        APPLICANT CONCEPT NOTE:
        {{inputs.concept_note}}

        Extract:
        - objectives: specific objectives vs the call; if sparse, infer and tag [TO CONFIRM].
        - ambition: beyond state of the art.
        - methodology_spine: monitoring + modelling, remote sensing / AI, 2050 scenarios.
        - cross_cutting: sustainability, biodiversity, pollution, food-security.
      output_schema:
        objectives: str
        ambition: str
        methodology_spine: str
        cross_cutting: str

  - id: rules_retrieval
    type: RAGAgent
    config:
      model: claude-opus-4-8
      filters:
        collection_id: "{{inputs.collection_id}}"
        doc_types: [report]
      top_k: 10
      query: >
        EU biomass supply and demand, sustainability and biodiversity tensions,
        forest carbon sink decline, biomass flows monitoring; HE Part B Excellence
        and Objectives & Ambition requirements.

  - id: draft_technical
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft Part B Section 1 Excellence + Objectives & Ambition (~6 pages) for a
        SCIENTIFIC / EVALUATOR audience. Precise, methodological, rigorous.

        Objectives: {{call_intel.parsed.objectives}}
        Ambition: {{call_intel.parsed.ambition}}
        Methodology spine: {{call_intel.parsed.methodology_spine}}
        Cross-cutting: {{call_intel.parsed.cross_cutting}}
        Grounded EU biomass evidence: {{rules_retrieval.answer}}

        ## 1. Excellence
        ### 1.1 Objectives and Ambition
        (measurable objectives mapped to required activities; beyond-SOTA argument
        with named methods, datasets, quantified targets)
        ### 1.2 Methodology (high level)
        (multi-scale monitoring + modelling, remote sensing + AI, 2050 scenario
        method; sustainability / biodiversity / pollution / food-security)

        GitHub-flavoured markdown, pipe tables for objectives -> methods -> targets.
        Tag gaps [TO CONFIRM].
      output_schema:
        markdown: str

  - id: draft_nontechnical
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft the same Section 1 Excellence + Objectives & Ambition (~6 pages) for a
        NON-TECHNICAL audience — executives, policy, board. Plain English, no jargon.

        Objectives: {{call_intel.parsed.objectives}}
        Ambition: {{call_intel.parsed.ambition}}
        Methodology spine: {{call_intel.parsed.methodology_spine}}
        Cross-cutting: {{call_intel.parsed.cross_cutting}}
        Grounded EU biomass evidence: {{rules_retrieval.answer}}

        ## 1. Excellence (in plain terms)
        ### 1.1 Objectives and Ambition
        (what the project achieves and why it is ambitious, plainly)
        ### 1.2 How we will do it
        (the approach for a non-expert; what sustainability, biodiversity and
        "no harm to food security" mean in practice)

        GitHub-flavoured markdown. Short paragraphs, at most one simple table.
        Tag gaps [TO CONFIRM].
      output_schema:
        markdown: str

  - id: compile_and_qa
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Submission reviewer. Two ~6-page drafts (technical, non-technical) of the
        same Excellence + Objectives & Ambition section. Do NOT reproduce them.
        Produce a readiness assessment.

        Technical: {{draft_technical.parsed.markdown}}
        Non-technical: {{draft_nontechnical.parsed.markdown}}

        Assess coverage of required activities; consistency between variants;
        ~6-page length; collate all [TO CONFIRM] tags; confirm food-security
        guardrail + biodiversity/pollution in both.

        Return ONLY the readiness field. Concise.
      output_schema:
        readiness: str

  - id: generate_docx
    type: DOCXProposalRenderer
    config:
      sections:
        "Technical — Excellence & Objectives": "{{draft_technical.parsed.markdown}}"
        "Non-Technical — Excellence & Objectives": "{{draft_nontechnical.parsed.markdown}}"
        "Submission Readiness": "{{compile_and_qa.parsed.readiness}}"
      template: corporate
      proposal_title: "Biomass Monitoring — Excellence & Objectives (tech + non-tech) — DRAFT"
      client_name: "Horizon Europe / Cluster 6"

edges:
  - from: call_intel
    to: rules_retrieval
  - from: rules_retrieval
    to: draft_technical
  - from: rules_retrieval
    to: draft_nontechnical
  - from: draft_technical
    to: compile_and_qa
  - from: draft_nontechnical
    to: compile_and_qa
  - from: compile_and_qa
    to: generate_docx
