name: Horizon Europe Part B - Autonomous DOCX
description: >-
  Fully autonomous workflow focused exclusively on the Horizon Europe RIA/IA
  Part B technical description. It converts a concept note and supporting
  documents into an evidence-verified, independently evaluated, editable DOCX.
  It follows the official 2026 Part B headings and the 45-page limit applicable
  to lump-sum topics. Missing facts remain visible and prevent the proposal
  from being marked submission-ready. Curated Scientific Agent Skills guide
  bounded Deep Research, canonical sources are acquired and verified, and
  only the integrity-stamped proposal truth graph becomes drafting authority.
  An optional supporting image is analysed and three evaluator-relevant
  figures are generated and embedded in the rendered DOCX.
  See workflows/horizon_partb_evidence.yaml, horizon_partb_drafts.yaml and
  horizon_partb_drafts_to_docx.yaml (chained by
  workflows/pipelines/pipeline.yaml) for the recommended gated pipeline
  staged so each phase is independently inspectable and retryable.
version: "4.0"
use_case: eu_proposal
inputs:
  concept_note:
    type: file
    description: The selected project concept note. This is the concept to develop; the workflow does not replace it with alternative concepts.
    required: true
    multiple: true
    max_files: 5
    accept: [pdf, document, markdown, presentation]
  documents:
    type: file
    description: >-
      Supporting proposal documents in any mixture: official call/topic text,
      the downloaded Part B template, consortium profiles, work plan, budget,
      pilot information, prior research, technical material, and guidance.
    required: true
    multiple: true
    max_files: 20
    accept: [pdf, document, markdown, presentation, spreadsheet]
  supporting_image:
    type: file
    description: >-
      Optional single image worth understanding on its own — a diagram,
      scanned certificate/letter of support, org chart, or partner photo.
      Leave empty if none applies; nothing downstream depends on it.
    required: false
    multiple: false
    accept: [image]
nodes:
  - id: load_concept
    type: WorkflowFileLoader
    config:
      files: "{{inputs.concept_note}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: load_documents
    type: WorkflowFileLoader
    config:
      files: "{{inputs.documents}}"
      max_chars_per_file: 500000
      fail_on_unreadable: true

  - id: understand_supporting_image
    type: KimiVisionAgent
    config:
      image: "{{inputs.supporting_image}}"
      prompt: >-
        Describe this image and extract anything relevant to a Horizon Europe
        Part B proposal: diagrams (architecture, methodology, work packages),
        organisation charts, data/results visualisations, certificates,
        letters of support, or similar. Separate what you observe directly
        from any inference. If the image carries no proposal-relevant
        information, say so plainly.
      vision_model: kimi-k3

  - id: partb_metadata
    type: TransformAgent
    selected_model: gpt-5-mini
    allowed_models:
      - gpt-5-mini
      - gpt-5.6-luna
      - gpt-4o-mini
      - gpt-5.6-terra
      - gpt-5
      - gpt-5.6-sol
    model_routing:
      accuracy_priority: economy
      prefer_low_latency: true
      quality_scores:
        gpt-5-mini: 0.95
        gpt-5.6-luna: 0.90
        gpt-4o-mini: 0.85
        gpt-5.6-terra: 0.70
        gpt-5: 0.60
        gpt-5.6-sol: 0.25
    config:
      model: gpt-5-mini
      max_tokens: 4000
      output_schema:
        proposal_title: str
        acronym: str
        call_id: str
        action_type: str
        funding_model: str
        consortium_name: str
        part_label: str
        version: str
        unresolved_metadata: list
      prompt_template: |
        Extract renderer metadata from the concept note and supporting
        documents. Use only explicit facts. Use an empty string for an unknown
        display field and list the exact missing item in unresolved_metadata.
        part_label must be "Part B – Technical Description". Do not invent a
        title, acronym, call identifier, action type, consortium or version.

        CONCEPT NOTE:
        {{load_concept.text}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: call_intelligence
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - o4-mini
      - gpt-5.6-sol
      - gpt-5
      - gpt-5-mini
    model_routing:
      accuracy_priority: balanced
    config:
      model: gpt-5.6-terra
      max_tokens: 12000
      output_schema:
        call_identity: object
        expected_outcomes: list
        scope_requirements: list
        mandatory_conditions: list
        evaluation_priorities: list
        exclusions: list
        page_and_format_rules: object
        unresolved_call_questions: list
      prompt_template: |
        Identify the authoritative call/topic and template material within the
        supporting documents, then extract an atomic, traceable Horizon Europe
        checklist. Separate expected outcomes, scope, admissibility or
        eligibility conditions, evaluator priorities, exclusions, and
        page/format rules. Label the source and locator for every requirement.
        Do not treat concept-note claims or partner documents as call rules.
        Put absent or ambiguous authoritative information in
        unresolved_call_questions. For a lump-sum RIA/IA, apply 45 pages only
        when the supplied official template or topic conditions support it.

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: normalise_source_graph
    type: GraphNormalizer
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - o4-mini
      - gpt-5.6-sol
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 32000
      concept_note: |
        CONCEPT NOTE:
        {{load_concept.text}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}
      call_facts: |
        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

        ATOMIC CALL CHECKLIST:
        {{call_intelligence.parsed}}

  - id: research_plan
    type: ScientificResearchPlannerAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - o4-mini
      - gpt-5.6-sol
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      call_context: "{{call_intelligence.parsed}}"
      concept_context: "{{load_concept.text}}"
      max_briefs: 8
      max_total_tool_calls: 72
      standard_tool_calls: 7
      critical_tool_calls: 11
      standard_research_model: o4-mini-deep-research
      critical_research_model: o3-deep-research
      max_skills_per_brief: 4

  - id: deep_research
    type: BoundedDeepResearchAgent
    config:
      research_briefs: "{{research_plan.research_briefs}}"
      max_jobs: 8
      max_parallel_jobs: 2
      max_total_tool_calls: 72
      max_tool_calls_per_job: 16
      max_citations_per_brief: 20
      max_candidates_per_claim: 12
      enable_code_interpreter: false
      background: true

  - id: acquire_research_sources
    type: ResearchSourceAcquirer
    config:
      candidates: "{{deep_research.candidates}}"
      max_concurrent_requests: 6
      max_sources_per_claim: 4
      max_total_sources: 60
      request_timeout_seconds: 45
      max_redirects: 4
      fail_when_none_acquired: false

  - id: verify_evidence
    type: ProposalEvidenceFactoryAgent
    selected_model: o3
    allowed_models:
      - o3
      - o4-mini
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: o3
      candidates: "{{deep_research.candidates}}"
      documents: "{{acquire_research_sources.documents}}"
      search_audit: "{{deep_research.search_audit}}"
      rejected_candidates: "{{acquire_research_sources.rejected_candidates}}"
      max_passages_per_document: 10

  - id: truth_graph
    type: ProposalTruthGraphAgent
    config:
      verified_claims: "{{verify_evidence.verified_claims}}"
      evidence_gaps: "{{verify_evidence.evidence_gaps}}"
      blocking_issues: "{{verify_evidence.blocking_issues}}"
      research_manifest: "{{deep_research.research_manifest}}"

  - id: call_coverage
    type: CallCoverageMatrixAgent
    config: {}

  - id: research_documentation
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-terra
      - gpt-5.6-luna
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 16000
      output_schema:
        cited_sources: list
        bibliography_formatted: str
        bounded_research_dossiers: list
        candidate_sources_considered: list
        citation_coverage_summary: object
      prompt_template: |
        Produce a standalone, audit-ready research-documentation record for
        this proposal run. This is not proposal text — it is the evidence
        paper trail: every bounded research question, skill bundle, source,
        verification result, qualification, rejection and unresolved gap.
        Never invent a source, URL, DOI or detail not present in the supplied
        records. A Deep Research dossier is candidate analysis, not evidence.

        cited_sources: one entry per citation ID in the verified citation
        registry — id, title, authors (if known), year, source type
        (official/peer_reviewed/standard/dataset/project/market/partner),
        URL or DOI, exact locator used, verification status, and the exact
        Part B subsection(s) it supports. Use [UNKNOWN] for any missing
        bibliographic field rather than guessing.

        bibliography_formatted: a clean, numbered reference list built only
        from cited_sources, ready to paste into an evidence annex.

        bounded_research_dossiers: one entry per research brief — brief ID,
        track, question, selected K-Dense Scientific Agent Skills, model,
        maximum and actual tool calls, source count and verification outcome.

        candidate_sources_considered: discovery candidates that were found
        but never promoted to verified evidence, each with a rejection
        reason (unverified, contradicted, superseded, off-topic, duplicate).
        If more than ~40 candidates were considered, group by rejection
        reason with representative examples instead of listing every one.

        citation_coverage_summary: counts of candidates discovered,
        acquired in full text, verified, cited in the final citation
        registry, rejected, qualified, contradicted, excluded from the truth
        graph and left for human review.

        CITATION REGISTRY:
        {{verify_evidence.citation_registry}}

        VERIFIED CLAIMS:
        {{verify_evidence.verified_claims}}

        BOUNDED RESEARCH PLAN:
        {{research_plan}}

        DEEP RESEARCH DOSSIERS (CANDIDATE ANALYSIS ONLY):
        {{deep_research.dossiers}}

        CANDIDATE SOURCES:
        {{deep_research.candidates}}

        SEARCH AND CONTRADICTION AUDIT:
        {{deep_research.search_audit}}

        ACQUISITION REJECTIONS:
        {{acquire_research_sources.rejected_candidates}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        HUMAN REVIEW QUEUE:
        {{truth_graph.human_review_queue}}

        SUPPORTING IMAGE ANALYSIS:
        {{understand_supporting_image.analysis}}

        EVIDENCE QA:
        {{verify_evidence.qa_report}}

  - id: proposal_blueprint
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 34000
      output_schema:
        proposal_identity: object
        source_hierarchy_and_fact_ledger: object
        official_partb_structure: object
        hard_page_limit: int
        working_page_target: int
        section_page_budget: object
        objective_result_outcome_chain: object
        state_of_art_and_innovations: object
        methodology_and_validation: object
        impact_pathways_and_kpis: object
        work_packages_tasks_deliverables: object
        consortium_and_resources: object
        risks_and_mitigations: object
        cross_cutting_compliance: object
        figure_and_table_plan: object
        unresolved_inputs: list
        specific_objectives_table: object
        ambitions: object
        pilot_strategy: object
        linked_research_activities: object
        ssh_integration: object
        gender_dimension: object
        data_management_open_science: object
        pestel_analysis: object
        dissemination_communication_plan: object
        post_project_dissemination: object
        exploitation_strategy: object
        policy_impact_strategy: object
        impact_summary: object
        work_plan_timing: object
      prompt_template: |
        Treat the supplied concept note as the selected project concept. Create
        the master blueprint only for the Horizon Europe RIA/IA Part B technical
        description. Follow the official 2026 headings exactly, down to every
        numbered subsection below — each maps to the output field named after
        it, and none may be silently skipped:
        1.1 Objectives and ambition
          1.1.1 Overall project objective: one row per approved objective —
          never force the count to match a template's blank SO1-SO5
          placeholders — each giving SO id, specific objective, target
          outcome, KPI, baseline, target value, verification route and the
          call requirement it answers -> specific_objectives_table
          (the causal objective -> result -> outcome -> impact chain itself
          still belongs in objective_result_outcome_chain).
          1.1.2 Ambitions: the central ambition (A1), state of the art, and
          what goes beyond it -> ambitions.
        1.2 Methodology
          1.2.1 Concept, 1.2.2 pilot strategy -> pilot_strategy, and
          1.2.3 overall methodology and approach all belong in
          methodology_and_validation. 1.2.4 linked research and innovation
          activities this project builds on -> linked_research_activities.
          1.2.5 interdisciplinary approach and SSH integration ->
          ssh_integration. 1.2.6 gender dimension -> gender_dimension: treat
          gender relevance in research content (variables, disaggregation,
          bias controls) as its own topic, separate from workforce/team
          balance.
          1.2.7 data management and open science practices ->
          data_management_open_science (cover data types, FAIR handling and
          planned open-access routes).
        2.1 Project's pathways towards impact
          2.1.1-2.1.2 contribution to expected outcomes and impacts belong in
          impact_pathways_and_kpis. 2.1.3 requirements and potential barriers
          beyond the project's scope: run a concrete PESTEL (Political,
          Economic, Social, Technological, Environmental, Legal) analysis
          naming factors specific to this call and domain, never generic
          boilerplate -> pestel_analysis. Give each barrier a category, the
          external condition, likelihood, consequence, project response and a
          responsible monitor. These are external conditions beyond the
          project's control; never restate one as an internal implementation
          risk in risks_and_mitigations, and vice versa.
        2.2 Measures to maximise impact – dissemination, exploitation and
        communication
          2.2.1 dissemination strategy and measures and 2.2.2 communication
          strategy -> dissemination_communication_plan. 2.2.3 dissemination
          and communication activities after the project ends ->
          post_project_dissemination. 2.2.4 exploitation strategy ->
          exploitation_strategy: one key exploitable result (KER) per row,
          each with an owner, target users, value proposition,
          protection/IPR route, exploitation route and time to uptake.
          2.2.5 multi-level policy impact strategy -> policy_impact_strategy.
          Close section 2 with a short summary of impact -> impact_summary.
        optional 2.3 Summary
        3.1 Work plan and resources
          3.1.1 timing of work packages -> work_plan_timing. 3.1.2 overall
          structure of the work package set and 3.1.3 detailed work
          description both belong in work_packages_tasks_deliverables.
        3.2 Capacity of participants and consortium as a whole ->
        consortium_and_resources.
        Do not create sections 1.3, 3.3, 3.4, Part A, ethics forms, security
        forms, budget forms or submission instructions. Treat any blank
        placeholder label (e.g. an empty "SO1"/"A1" slot) or example/template
        project name found in a supplied document as a structural cue only,
        never as approved content — do not let either leak into the
        blueprint.

        Determine the hard page limit from the call metadata and template,
        not by default: a confirmed lump-sum RIA/IA topic gets a 45-page hard
        limit with a 44-page working target (front matter 1; 1.1 = 4; 1.2 =
        13; 2.1 = 3; 2.2 = 3; optional 2.3 = 1; 3.1 = 16; 3.2 = 3). A standard
        (non-lump-sum) full proposal gets the normal 40-page hard limit with
        a 39-page working target (front matter 1; 1.1 = 5; 1.2 = 12; 2.1 =
        4.5; 2.2 = 3; optional 2.3 = 0.5; 3.1 = 11.5; 3.2 = 2.5). If the
        funding model cannot be confirmed from the supplied call documents,
        default to the stricter 40-page profile and record the ambiguity in
        unresolved_inputs. Retain one page of safety against rendering
        variation. If section 2.3 is omitted, reallocate its page only where
        evaluator value is highest.

        In figure_and_table_plan, for each planned figure give a short stable
        slug (used later to match a generated image to its slot) and the exact
        evaluator-relevant content it must show. Plan only evaluator-useful
        figures — never decoration.

        Map every call requirement to a Part B subsection, result, owner,
        evidence claim, KPI, WP, task, deliverable, milestone and risk where
        grounded. Build an explicit objective -> result -> outcome -> impact chain.
        Use [INPUT NEEDED: exact item] for missing facts; never invent partner,
        budget, KPI, TRL, timeline, pilot, source or evidence details.

        CONCEPT NOTE:
        {{load_concept.text}}

        PROPOSAL METADATA:
        {{partb_metadata.parsed}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

        CALL COVERAGE:
        {{call_coverage}}

        NORMALISED SOURCE:
        {{normalise_source_graph.report}}
        {{normalise_source_graph.warnings}}

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

        VERIFIED EVIDENCE (citation-annotated narrative):
        {{verify_evidence.proposal_ready_cited_markdown}}

        APPROVED DRAFTING SOURCE — PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        TRUTH-GRAPH INTEGRITY SHA-256:
        {{truth_graph.integrity_sha256}}

        Raw Deep Research dossiers are deliberately unavailable as drafting
        authority. Use only truth-graph claims and authoritative project/call
        facts. Preserve qualifications and [INPUT NEEDED] items.

  - id: generate_figure_oro_chain
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the causal chain from project objectives
        through results and outcomes to wider impact, using ONLY this grounded
        content — do not invent additional boxes, labels or numbers:

        {{proposal_blueprint.parsed.objective_result_outcome_chain}}

  - id: generate_figure_impact_pathways
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the pathway from project results to outcomes to
        the topic's expected impacts, using ONLY this grounded content — do
        not invent additional boxes, labels or numbers:

        {{proposal_blueprint.parsed.impact_pathways_and_kpis}}

  - id: generate_figure_workplan
    type: OpenAIImageGenerationAgent
    config:
      backend: openai
      image_model: gpt-image-2-2026-04-21
      output_format: png
      size: auto
      quality: auto
      prompt: |
        Flat vector diagram for a Horizon Europe grant proposal figure, EU
        institutional report style, white background, no photorealism, short
        text labels only. Show the work-package structure and dependencies
        (boxes and arrows only, no dates/Gantt bars unless explicitly present
        below), using ONLY this grounded content — do not invent additional
        work packages, labels or numbers:

        {{proposal_blueprint.parsed.work_packages_tasks_deliverables}}

  - id: draft_1_1_objectives_ambition
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 16000
      prompt_template: |
        Draft only official subsection "1.1 Objectives and ambition" in polished
        proposal-ready Markdown, targeting 4 pages. Define measurable,
        verifiable and realistically achievable objectives and show their
        pertinence to the topic. Build the objective table directly from
        proposal_blueprint.parsed.specific_objectives_table (columns: SO |
        Specific objective | Target outcome | KPI | Baseline | Target value |
        Verification | Call requirement) — one row per approved objective;
        never force the count to match blank SO1-SO5 placeholders in any
        supplied template. Compare the project with the state of the art
        and available solutions using proposal_blueprint.parsed.ambitions,
        identify the precise advance and ambition, and
        state R&I maturity or start/end TRLs only when grounded. Use only
        verified citation IDs. Preserve missing facts as
        [INPUT NEEDED: exact item]. Do not draft methodology or create 1.3.

        Where the objective -> result -> outcome -> impact chain diagram
        belongs, insert exactly this marker on its own line, unmodified:
        [[IMAGE PROMPT: Figure 1 - Objective-Result-Outcome-Impact Chain]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        VERIFIED EVIDENCE:
        {{verify_evidence.proposal_ready_cited_markdown}}

        CITATION REGISTRY:
        {{verify_evidence.citation_registry}}

  - id: draft_1_2_methodology
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 32000
      prompt_template: |
        Draft only official subsection "1.2 Methodology" in proposal-ready
        Markdown, targeting 13 pages. Present the overall methodology as a
        coherent narrative, not a repetition of work packages. Explain
        concepts, models, assumptions, methods, data, validation, uncertainty,
        methodological challenges and mitigation; how relevant national or
        international R&I results feed the project; interdisciplinarity; SSH
        integration where required; the gender dimension in R&I content; open
        science, FAIR research-output management and stakeholder/end-user
        engagement. Integrate the multi-actor approach where the call requires
        it. Base 1.2.4-1.2.7 on proposal_blueprint.parsed.linked_research_activities,
        proposal_blueprint.parsed.ssh_integration,
        proposal_blueprint.parsed.gender_dimension and
        proposal_blueprint.parsed.data_management_open_science respectively.
        Treat the gender dimension as research-content relevance (variables,
        disaggregation, bias controls) — a separate topic from workforce or
        team gender balance. Use only verified citations and supplied facts.
        Preserve missing details as [INPUT NEEDED: exact item].

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        VERIFIED EVIDENCE:
        {{verify_evidence.proposal_ready_cited_markdown}}

        CITATION REGISTRY:
        {{verify_evidence.citation_registry}}

  - id: draft_2_1_pathways
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 16000
      prompt_template: |
        Draft only official subsection "2.1 Project's pathways towards impact"
        in proposal-ready Markdown, targeting 3 pages. Give a concise causal
        narrative from specific needs through project results, target groups and
        uptake mechanisms to every expected topic outcome and wider destination
        impact. Provide quantified estimates only when meaningful and grounded.
        Ground the barriers subsection in
        proposal_blueprint.parsed.pestel_analysis (the six-category PESTEL
        record: political, economic, social, technological, environmental,
        legal) — identify external requirements, assumptions and barriers,
        how they may evolve, and mitigation within or beyond the project.
        These are external conditions only; never restate one as an internal
        implementation risk here or duplicate it in 3.1's risk table. Every
        number must have a baseline, target, unit, source, owner and time
        horizon or remain [INPUT NEEDED: exact item].

        Where the impact-pathways diagram belongs, insert exactly this marker
        on its own line, unmodified:
        [[IMAGE PROMPT: Figure 2 - Impact Pathways]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        CALL OUTCOMES:
        {{call_intelligence.parsed.expected_outcomes}}

        VERIFIED EVIDENCE:
        {{verify_evidence.proposal_ready_cited_markdown}}

  - id: draft_2_2_measures_and_2_3_summary
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 16000
      prompt_template: |
        Draft official subsection "2.2 Measures to maximise impact –
        Dissemination, exploitation and communication" in proposal-ready
        Markdown, targeting 3 pages. Provide the first plan for dissemination,
        exploitation and communication with differentiated objectives, target
        groups, messages, measures, channels, timing, ownership and KPIs.
        Cover post-project uptake, policy feedback, standardisation, result
        ownership, IP protection and access rights where relevant. Do not mix
        open-science methodology with communication.

        For 2.2.4 exploitation, give each key exploitable result (KER) in
        proposal_blueprint.parsed.exploitation_strategy its own owner,
        target users, value proposition, protection/IPR route and
        exploitation route — do not describe exploitation only in general
        terms.

        Add official optional subsection "2.3 Summary" only when it improves
        evaluator comprehension. If used, keep it to one page as a compact
        impact canvas covering specific needs, expected results, D/E/C measures,
        target groups, outcomes and impacts. If it cannot fit the working page
        target, omit it completely. Preserve missing facts as
        [INPUT NEEDED: exact item].

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: draft_3_1_workplan_resources
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 32000
      prompt_template: |
        Draft only official subsection "3.1 Work plan and resources" in
        proposal-ready Markdown, targeting 16 pages including all tables.
        Include: work-plan logic; timing; a Gantt placeholder; a PERT/dependency
        placeholder; WP/task descriptions with quantified activities,
        participants, effort and resources; governance and decision controls;
        quality assurance; data management; dissemination/exploitation/
        communication implementation; milestones; implementation risks and
        mitigations; and lump-sum resource coherence. Implementation risks
        here must be distinct from the external PESTEL barriers already
        captured in 2.1.3 — do not duplicate them.

        Produce the official tables exactly as applicable:
        3.1a list of work packages; 3.1b description of each work package;
        3.1c deliverables; 3.1d milestones; 3.1e critical risks; 3.1f staff
        effort; 3.1g subcontracting costs; and 3.1h major equipment purchase
        costs above the applicable threshold. Preserve exact identifiers and
        numbers from the documents. Missing leads, dates, person-months, costs,
        owners or quantities remain [INPUT NEEDED: exact item]. Never fabricate
        a balanced budget or partner allocation.

        Where the work-package structure diagram belongs (after the WP list,
        before 3.1b), insert exactly this marker on its own line, unmodified:
        [[IMAGE PROMPT: Figure 3 - Work Package Structure]]
        Do not draw or describe the diagram yourself; do not omit the marker.

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  - id: draft_3_2_consortium
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 16000
      prompt_template: |
        Draft only official subsection "3.2 Capacity of participants and
        consortium as a whole" in proposal-ready Markdown, targeting 3 pages.
        Do not repeat the Part A organisation descriptions. Demonstrate how the
        consortium collectively matches the objectives, combines disciplinary
        and interdisciplinary expertise, covers SSH/open science/gender
        capabilities where relevant, accesses critical infrastructure, covers
        the value chain and target groups, and assigns complementary roles.
        Explain any affiliated entities, associated partners or international
        participants only when documented. Integrate multi-actor co-creation
        capacity when required by the call. Preserve absent partner or facility
        facts as [INPUT NEEDED: exact item].

        BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        Use external factual claims only when present in the truth graph.
        Preserve qualifications; raw research dossiers are not drafting input.

        SUPPORTING DOCUMENTS:
        {{load_documents.text}}

  # ---- Compilation is split by evaluated criterion (Excellence / Impact /
  # Implementation) instead of one monolithic pass. A ~40-44 page proposal
  # is realistically 30,000-45,000+ output tokens once tables and figures
  # are counted, which exceeds what a single TransformAgent call can safely
  # emit without silent truncation (TransformAgent has no way to detect a
  # cut-off response when no output_schema is set). Each compile_* /
  # revise_* stage below only has to hold its own criterion's page budget
  # (well under its max_tokens), and the actual "compile_v1"/"final_revision"
  # documents are produced by TextAssemblerAgent - a deterministic, non-LLM
  # join - so the full-document assembly step itself can never truncate.
  - id: compile_excellence
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 20000
      prompt_template: |
        Assemble the coherent "1. Excellence" section (1.1 and 1.2 only) of
        the Horizon Europe Part B Markdown document from the two supplied
        drafts. Do not add Part A, annexes or extra numbered sections.
        Remove duplication between 1.1 and 1.2, align objectives/results/
        terminology, retain every valid citation and [INPUT NEEDED] marker,
        and add no facts. Preserve every `[[IMAGE PROMPT: ...]]` marker
        exactly as it appears, verbatim, on its own line — never paraphrase,
        reformat, or drop it. Start with the "# 1. Excellence" heading.

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        1.1:
        {{draft_1_1_objectives_ambition.raw}}

        1.2:
        {{draft_1_2_methodology.raw}}

  - id: compile_impact
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 12000
      prompt_template: |
        Assemble the coherent "2. Impact" section (2.1, 2.2 and optional 2.3
        only) of the Horizon Europe Part B Markdown document from the two
        supplied drafts. Do not add Part A, annexes or extra numbered
        sections. Remove duplication, align terminology, retain every valid
        citation and [INPUT NEEDED] marker, and add no facts. Preserve every
        `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on
        its own line — never paraphrase, reformat, or drop it. Start with the
        "# 2. Impact" heading.

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        2.1:
        {{draft_2_1_pathways.raw}}

        2.2 AND OPTIONAL 2.3:
        {{draft_2_2_measures_and_2_3_summary.raw}}

  - id: compile_implementation
    type: TransformAgent
    selected_model: gpt-5.6-terra
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-terra
      max_tokens: 20000
      prompt_template: |
        Assemble the coherent "3. Quality and efficiency of the
        implementation" section (3.1 and 3.2 only) of the Horizon Europe
        Part B Markdown document from the two supplied drafts. Do not add
        Part A, annexes or extra numbered sections. Remove duplication,
        align WPs/tasks/deliverables/milestones/risks/KPIs/partners, retain
        every valid citation, [INPUT NEEDED] marker and official Tables
        3.1a-3.1h exactly, and add no facts. Preserve every
        `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on
        its own line — never paraphrase, reformat, or drop it. Start with the
        "# 3. Quality and efficiency of the implementation" heading.

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        3.1:
        {{draft_3_1_workplan_resources.raw}}

        3.2:
        {{draft_3_2_consortium.raw}}

  - id: compile_v1
    type: TextAssemblerAgent
    config:
      separator: "\n\n"
      parts:
        - "{{compile_excellence.raw}}"
        - "{{compile_impact.raw}}"
        - "{{compile_implementation.raw}}"

  - id: scientific_peer_review
    type: ScientificSkillAgent
    selected_model: o3
    allowed_models:
      - o3
      - o4-mini
      - gpt-5.6-sol
      - gpt-5.6-terra
    model_routing:
      accuracy_priority: maximum
    config:
      model: o3
      skills:
        - peer-review
        - scientific-critical-thinking
        - research-grants
        - scientific-writing
      auto_select: false
      max_skills: 4
      temperature: 0.0
      max_tokens: 12000
      system_prompt: >-
        Act as a skeptical scientific peer reviewer of a Horizon Europe Part B
        proposal. Check overstatement, contradictory evidence, causal errors,
        missing validation or uncertainty, and claims outside the proposal
        truth graph. Produce actionable findings only; do not rewrite or add
        facts and citations.
      objective: |
        Review the compiled proposal against the proposal truth graph, verified
        claims, call checklist and evidence QA. Tag every issue to a Part B
        subsection and distinguish scientific defects, missing inputs,
        unsupported claims and presentation issues.

        COMPILED PROPOSAL:
        {{compile_v1.text}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        VERIFIED CLAIMS:
        {{verify_evidence.verified_claims}}

        CALL CHECKLIST:
        {{call_intelligence.parsed}}

        EVIDENCE QA:
        {{verify_evidence.qa_report}}

  - id: evaluate_v1
    type: HorizonEvaluationAgent
    config:
      proposal_text: "{{compile_v1.text}}"
      generator_model: auto
      evaluator_models:
        - o3
        - gpt-5.6-sol
      criterion_threshold: 4.0
      total_threshold: 12.0

  - id: red_team_v1
    type: TransformAgent
    selected_model: o3
    allowed_models:
      - o3
      - o4-mini
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: o3
      max_tokens: 12000
      output_schema:
        blocking_gaps: list
        excellence_risks: list
        impact_risks: list
        implementation_risks: list
        evidence_and_citation_risks: list
        numerical_inconsistencies: list
        page_budget_actions: list
        safe_revision_instructions: list
      prompt_template: |
        Red-team this draft as a strict Horizon evaluator and proposal engineer.
        Find only concrete, actionable defects. Check call coverage, causal logic,
        measurable ambition, evidence/citation fit, partner and work-package
        consistency, person-month and budget contradictions, official Tables
        3.1a-3.1h, milestones, risks, gender dimension, SSH, open science,
        multi-actor requirements and page density. Confirm PESTEL barriers
        (2.1.3) are never duplicated as implementation risks (3.1) and vice
        versa; confirm every KER (2.2.4) has a distinct owner, target users,
        value proposition and exploitation route; confirm the
        gender-dimension content (1.2.6) addresses research-content
        relevance, not only team or workforce balance. Flag any non-official
        section, any content outside Part B, any likely breach of the 44-page
        target or 45-page limit, and any misuse of Part A information. A missing
        fact is a blocker or input request, not permission to invent. Tag each
        finding to its owning criterion so it lands in the matching
        *_risks list (excellence_risks, impact_risks, implementation_risks) -
        cross-cutting findings that do not belong to one criterion (evidence,
        numerical, page-budget) go in their own dedicated lists instead.

        DRAFT:
        {{compile_v1.text}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        K-DENSE-GUIDED SCIENTIFIC PEER REVIEW:
        {{scientific_peer_review.answer}}

        CALL COVERAGE:
        {{call_coverage}}

        EVIDENCE QA:
        {{verify_evidence.qa_report}}

  # ---- Revision is likewise split per criterion. Each stage only rewrites
  # its own chunk (using the whole red-team/evaluation output, since
  # cross-cutting findings such as evidence/numerical/page-budget issues can
  # affect any section), then final_revision deterministically joins the
  # three revised chunks - so, again, no single LLM call has to hold the
  # entire ~40-44 page final document in its output.
  - id: revise_excellence
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 20000
      prompt_template: |
        Produce the final submission candidate for ONLY the "1. Excellence"
        section (1.1 and 1.2). Apply evaluator and red-team recommendations
        relevant to this section only when they can be resolved from
        supplied content or verified evidence. Improve logic, specificity,
        consistency and evaluator readability. Never fabricate a missing
        number, partner fact, result, source, KPI, TRL, budget or timeline.
        Preserve unresolved facts as [INPUT NEEDED: ...]. Keep all valid
        citation identifiers intact. Preserve every `[[IMAGE PROMPT: ...]]`
        marker exactly as it appears, verbatim, on its own line — never
        paraphrase, reformat, or drop it. Preserve the exact official
        headings. Return only this section - do not draft Impact or
        Implementation.

        SECTION DRAFT:
        {{compile_excellence.raw}}

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        INDEPENDENT EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the excellence_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to 1.1/1.2):
        {{red_team_v1.parsed}}

        VERIFIED CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: revise_impact
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 12000
      prompt_template: |
        Produce the final submission candidate for ONLY the "2. Impact"
        section (2.1, 2.2 and optional 2.3). Apply evaluator and red-team
        recommendations relevant to this section only when they can be
        resolved from supplied content or verified evidence. Improve logic,
        specificity, consistency and evaluator readability. Never fabricate
        a missing number, partner fact, result, source, KPI, TRL, budget or
        timeline. Preserve unresolved facts as [INPUT NEEDED: ...]. Keep all
        valid citation identifiers intact. Preserve every
        `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on
        its own line — never paraphrase, reformat, or drop it. Preserve the
        exact official headings. Return only this section - do not draft
        Excellence or Implementation.

        SECTION DRAFT:
        {{compile_impact.raw}}

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        INDEPENDENT EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the impact_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to 2.1/2.2/2.3):
        {{red_team_v1.parsed}}

        VERIFIED CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: revise_implementation
    type: TransformAgent
    selected_model: gpt-5.6-sol
    allowed_models:
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5
    model_routing:
      accuracy_priority: maximum
    config:
      model: gpt-5.6-sol
      max_tokens: 20000
      prompt_template: |
        Produce the final submission candidate for ONLY the "3. Quality and
        efficiency of the implementation" section (3.1 and 3.2). Apply
        evaluator and red-team recommendations relevant to this section only
        when they can be resolved from supplied content or verified
        evidence. Improve logic, specificity, consistency and evaluator
        readability. Never fabricate a missing number, partner fact, result,
        source, KPI, TRL, budget or timeline. Preserve unresolved facts as
        [INPUT NEEDED: ...]. Keep all valid citation identifiers and the
        official Tables 3.1a-3.1h intact. Preserve every
        `[[IMAGE PROMPT: ...]]` marker exactly as it appears, verbatim, on
        its own line — never paraphrase, reformat, or drop it. Preserve the
        exact official headings. Return only this section - do not draft
        Excellence or Impact.

        SECTION DRAFT:
        {{compile_implementation.raw}}

        LOCKED BLUEPRINT:
        {{proposal_blueprint.parsed}}

        PROPOSAL TRUTH GRAPH:
        {{truth_graph.truth_graph}}

        INDEPENDENT EVALUATION:
        {{evaluate_v1}}

        RED TEAM (full report - apply only the implementation_risks,
        evidence_and_citation_risks, numerical_inconsistencies and
        page_budget_actions entries relevant to 3.1/3.2):
        {{red_team_v1.parsed}}

        VERIFIED CITATIONS:
        {{verify_evidence.citation_registry}}

  - id: final_revision
    type: TextAssemblerAgent
    config:
      separator: "\n\n"
      parts:
        - "{{revise_excellence.raw}}"
        - "{{revise_impact.raw}}"
        - "{{revise_implementation.raw}}"

  - id: evaluate_final
    type: HorizonEvaluationAgent
    config:
      proposal_text: "{{final_revision.text}}"
      generator_model: auto
      evaluator_models:
        - o3
        - gpt-5.6-sol
      criterion_threshold: 4.0
      total_threshold: 12.0

  - id: consistency_gate
    type: ConsistencyChecker
    config:
      block_on_warn: false

  - id: submission_gate
    type: ProposalSubmissionGate
    config:
      proposal_text: "{{final_revision.text}}"
      evidence_blockers: "{{verify_evidence.blocking_issues}}"
      consistency_gate: "{{consistency_gate.gate}}"
      consistency_findings: "{{consistency_gate.findings}}"
      evaluation_threshold_passed: "{{evaluate_final.threshold_passed}}"
      evaluation_total_score: "{{evaluate_final.total_score}}"
      evaluation_blockers: "{{evaluate_final.deterministic_blockers}}"
      minimum_proposal_characters: 20000
      require_evaluation_pass: true
      block_on_input_needed: true

  - id: figure_embedder
    type: FigureEmbedder
    config:
      content: "{{final_revision.text}}"
      figures:
        - marker: "Figure 1 - Objective-Result-Outcome-Impact Chain"
          image: "{{generate_figure_oro_chain}}"
          alt_text: "Objective-result-outcome-impact chain diagram"
        - marker: "Figure 2 - Impact Pathways"
          image: "{{generate_figure_impact_pathways}}"
          alt_text: "Impact pathways diagram"
        - marker: "Figure 3 - Work Package Structure"
          image: "{{generate_figure_workplan}}"
          alt_text: "Work package structure diagram"

  - id: render_submission_docx
    type: HorizonDOCXProposalRenderer
    config:
      content: "{{figure_embedder.content}}"
      content_format: markdown
      metadata: "{{partb_metadata.parsed}}"
      citation_registry: "{{verify_evidence.citation_registry}}"
      evidence_qa: "{{verify_evidence.qa_report}}"
      evidence_blockers: "{{submission_gate.blockers}}"
      include_toc: false
      include_bibliography: true
      include_evidence_annex: false
      page_limit: 45
      enforce_page_limit: true

