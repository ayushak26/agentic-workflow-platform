name: Human Review Editor Demo
description: >
  Demonstrates editable HITL content, rich-text review, and document override.
  Saved edits replace draft.value before the downstream node runs.
version: "1.0"
use_case: generic
inputs: {}
nodes:
  - id: draft
    type: Literal
    config:
      value: |
        Project concept

        This is the initial draft. Edit it in the human-review node or replace
        it with an uploaded PDF, DOCX, PPTX, Markdown, text, or code file.
  - id: human_review
    type: HumanInLoopAgent
    config:
      question: Review and approve the project concept.
      context_fields:
        - draft.value
      editable_content_field: draft.value
      allow_document_override: true
      max_edit_chars: 1000000
      allowed_actions:
        - approve
        - reject
        - edit
  - id: use_reviewed_content
    type: Echo
    config:
      template: "{{draft.value}}"
edges:
  - from: draft
    to: human_review
  - from: human_review
    to: use_reviewed_content
entry: draft
exit: use_reviewed_content
output:
  include_input: false
  nodes:
    - node_id: human_review
      flatten: false
    - node_id: use_reviewed_content
      flatten: false
