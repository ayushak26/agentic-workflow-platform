name: Personalized Outbound Campaigning
description: >-
  Looks up a prospect's recent public activity (posts, announcements,
  financial reports) via live web search, then drafts a short, tailored
  cold-outreach email that references that activity to pitch an offering.
version: "1.0"
use_case: sales_outbound

inputs:
  prospect_name:
    type: text
    required: true
    description: Full name of the prospect being contacted.

  company_name:
    type: text
    required: true
    description: Company the prospect works for.

  offering:
    type: text
    required: true
    description: What you are selling or pitching to the prospect.

nodes:
  - id: search_for_recent_activity
    type: WebSearchAgent
    config:
      query: >-
        {{ inputs.prospect_name }} {{ inputs.company_name }} recent news,
        posts, announcements, or financial report
      provider: auto
      top_k: 8
      fallback_to_openai: true

  - id: draft_personalized_email
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      system_prompt: >-
        You are a sales development representative who writes short,
        specific, non-generic cold outreach emails. You never invent facts
        about the prospect - you only reference activity actually present in
        the supplied search results.
      prompt_template: >-
        Prospect: {{ inputs.prospect_name }} at {{ inputs.company_name }}

        What we are pitching: {{ inputs.offering }}

        Recent public activity found via web search (query:
        "{{ search_for_recent_activity.query }}"):
        {{ search_for_recent_activity.results }}

        Write a short cold outreach email (under 150 words) to the prospect
        that:
        - Opens with a specific, genuine reference to one piece of their
          recent public activity above (if the results are empty or
          irrelevant, open with a relevant industry observation instead).
        - Connects that reference naturally to why the offering is relevant
          to them right now.
        - Ends with a low-friction call to action (e.g. a short call).
        - Has no generic filler or over-the-top flattery.
      output_schema:
        subject_line: str
        email_body: str
      temperature: 0.4
      max_tokens: 1024
      max_retries: 1

edges:
  - from: search_for_recent_activity
    to: draft_personalized_email

entry: search_for_recent_activity
exit: draft_personalized_email

output:
  nodes:
    - node_id: draft_personalized_email
