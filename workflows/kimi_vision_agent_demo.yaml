name: Kimi K3 Vision Demo
description: Analyse one uploaded image with Kimi K3 without storing bytes in workflow state.
version: "1.0"
use_case: generic

inputs:
  image:
    type: file
    description: PNG, JPEG, GIF, WebP, BMP, HEIC, or HEIF image to analyse.
    required: true
    multiple: false
    accept:
      - .bmp
      - .gif
      - .heic
      - .heif
      - .jpeg
      - .jpg
      - .png
      - .webp

nodes:
  - id: understand_image
    type: KimiVisionAgent
    config:
      image: "{{inputs.image}}"
      prompt: Describe the image, extract important details, and separate observations from inferences.
      vision_model: kimi-k3
      max_completion_tokens: 8192

edges: []
entry: understand_image
exit: understand_image

output:
  include_input: false
  nodes:
    - node_id: understand_image
      flatten: true
