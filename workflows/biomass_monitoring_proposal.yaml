name: "Biomass Monitoring Proposal — Excellence (tech + non-tech)"
description: >
  Two-variant opening of a Horizon Europe Part B for the Cluster 6 biomass-
  monitoring topic: Section 1 Excellence + Objectives & Ambition, ~6 pages each,
  technical and non-technical. Concept Note is the workflow INPUT. NO RAG and NO
  MCP in this version — grounding is the call text (baked into call_intel) plus
  model knowledge. This is the minimal, cannot-fail-on-retrieval build; add RAG
  back as a separate step once the biomass corpus is ingested.
version: "3.0"

entry: call_intel

inputs:
  concept_note:
    type: text
    description: Applicant's project specifics. May be sparse; drafters write illustrative prose and mark unknowns [TO CONFIRM].

nodes:
  - id: call_intel
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        You are a Horizon Europe proposal strategist. Given (a) the binding call
        and (b) the applicant's Concept Note, extract the spine for a Section 1
        "Excellence" draft focused on Objectives & Ambition.

        CALL (Cluster 6 / bioeconomy biomass monitoring) — required activities:
        develop innovative, administration-light biomass monitoring and
        modelling/assessment digital tools at regional/national/continental
        scale (attention to untapped sustainable biomass); deliver an updated EU
        biomass supply/demand estimate to 2050 with scenarios; demonstrate
        biomass reporting across >=10 European countries. Cross-cutting:
        sustainability, biodiversity, air/water/soil pollution, and the
        food-security guardrail ("without undermining food security").

        APPLICANT CONCEPT NOTE:
        {{inputs.concept_note}}

        Extract:
        - objectives: specific objectives reconciling the Note with the call's
          required activities. If the Note is sparse, infer reasonable objectives
          and tag gaps [TO CONFIRM].
        - ambition: what is novel / beyond state of the art.
        - methodology_spine: high-level methodology (monitoring + modelling,
          remote sensing / AI, 2050 scenario approach).
        - cross_cutting: how sustainability, biodiversity, pollution and the
          food-security guardrail are addressed.
      output_schema:
        objectives: str
        ambition: str
        methodology_spine: str
        cross_cutting: str

  - id: draft_technical
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft Part B Section 1 "Excellence" + "Objectives & Ambition" (~6 pages)
        for a SCIENTIFIC / EVALUATOR audience. Precise, methodological, rigorous;
        credible beyond-SOTA claims.

        Objectives: {{call_intel.parsed.objectives}}
        Ambition: {{call_intel.parsed.ambition}}
        Methodology spine: {{call_intel.parsed.methodology_spine}}
        Cross-cutting: {{call_intel.parsed.cross_cutting}}

        Structure:
        ## 1. Excellence
        ### 1.1 Objectives and Ambition
        (measurable objectives mapped to the call's required activities; the
        beyond-SOTA argument with named methods, datasets, quantified targets)
        ### 1.2 Methodology (high level)
        (multi-scale monitoring + modelling, remote sensing + AI, 2050 scenario
        method; sustainability / biodiversity / pollution / food-security
        handled methodologically)

        GitHub-flavoured markdown with pipe tables for objectives -> methods ->
        targets. Tag applicant-specific gaps [TO CONFIRM].
      output_schema:
        markdown: str

  - id: draft_nontechnical
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        Draft the same Section 1 "Excellence" + "Objectives & Ambition"
        (~6 pages) for a NON-TECHNICAL audience — executives, policy, board.
        Plain English, no jargon; lead with why it matters and the public value.
        Credible, not dumbed down.

        Objectives: {{call_intel.parsed.objectives}}
        Ambition: {{call_intel.parsed.ambition}}
        Methodology spine: {{call_intel.parsed.methodology_spine}}
        Cross-cutting: {{call_intel.parsed.cross_cutting}}

        Structure:
        ## 1. Excellence (in plain terms)
        ### 1.1 Objectives and Ambition
        (what the project achieves and why it is ambitious, told plainly)
        ### 1.2 How we will do it
        (the approach for a non-expert; what sustainability, biodiversity and
        "no harm to food security" mean in practice)

        GitHub-flavoured markdown. Short paragraphs, at most one simple table.
        Tag gaps [TO CONFIRM].
      output_schema:
        markdown: str

  - id: compile_and_qa
    type: TransformAgent
    config:
      model: claude-opus-4-8
      prompt_template: |
        You are the submission reviewer. Two ~6-page drafts of the same
        Excellence + Objectives & Ambition section: one technical, one
        non-technical. Do NOT reproduce them. Produce a readiness assessment.

        Technical: {{draft_technical.parsed.markdown}}
        Non-technical: {{draft_nontechnical.parsed.markdown}}

        Assess: coverage of the call's required activities (monitoring tools;
        2050 estimate; >=10-country demonstration); consistency between the two
        variants; ~6-page length each; collate all [TO CONFIRM] tags; confirm
        food-security guardrail + biodiversity/pollution appear in both.

        Return ONLY the readiness field. Concise.
      output_schema:
        readiness: str

  - id: generate_docx
    type: DOCXProposalRenderer
    config:
      sections:
        "Technical — Excellence & Objectives": "{{draft_technical.parsed.markdown}}"
        "Non-Technical — Excellence & Objectives": "{{draft_nontechnical.parsed.markdown}}"
        "Submission Readiness": "{{compile_and_qa.parsed.readiness}}"
      template: corporate
      proposal_title: "Biomass Monitoring — Excellence & Objectives (tech + non-tech) — DRAFT"
      client_name: "Horizon Europe / Cluster 6"

edges:
  - from: call_intel
    to: draft_technical
  - from: call_intel
    to: draft_nontechnical
  - from: draft_technical
    to: compile_and_qa
  - from: draft_nontechnical
    to: compile_and_qa
  - from: compile_and_qa
    to: generate_docx