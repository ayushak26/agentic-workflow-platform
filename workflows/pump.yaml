use_case: generic
inputs:
  Source:
    type: text
    required: false
    description: Email, or Message or Contact Form
  Subject:
    type: text
    required: false
    description: The incoming customer enquiry
  input_1:
    type: text
    required: false
    description: ''
  input_2:
    type: text
    required: false
    description: ''
  input_3:
    type: text
    required: false
    description: ''
  input_4:
    type: text
    required: false
    description: ''
static_variables: []
nodes:
  - id: understanding_message
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: null
      input_fields:
        - name: Subject
          description: The incoming customer enquiry
          type: string
          value: '{{inputs.Subject}}'
        - name: Source
          description: Email, or Message or Contact Form
          type: string
          value: '{{inputs.Source}}'
      instructions: >-
        Use the incoming customer enquiry in Subject and, where relevant, its channel in Source.
        Source indicates whether the enquiry came by Email, Message, or Contact Form; do not use the
        channel to invent information or change the customer’s requested outcome.


        Return exactly four logical outputs:


        - Category

        - Customer Problem

        - Company Action Item(s)

        - References


        Return valid JSON only, using this structure:


        {
          "category": "",
          "customer_problem": "",
          "company_action_items": [],
          "references": {}
        }


        Category


        Select exactly one category from this controlled list:


        - new_pump_quote_or_rfq

        - existing_quote_enquiry

        - product_selection_or_application

        - product_information

        - new_order_or_purchase

        - existing_order_enquiry

        - delivery_or_shipment_enquiry

        - delivery_problem

        - technical_support

        - service_or_repair_request

        - spare_parts_request

        - replacement_pump_request

        - warranty_enquiry

        - invoice_or_billing_enquiry

        - payment_or_credit_enquiry

        - product_quality_issue

        - return_request

        - complaint

        - contract_or_commercial_terms

        - customer_account_or_master_data

        - general_information

        - unknown


        Do not create new category names. Use unknown when the message cannot reasonably be matched
        to one controlled category.


        Choose the category that best describes the customer’s overall situation, not the department
        or role that should handle it. If several situations appear, use the category representing
        the main customer problem; use the more specific problem category when one clearly applies.
        For example, a leaking pump with a request to inspect it is service_or_repair_request, even
        if the customer also asks whether it is covered by warranty. Use warranty_enquiry when
        warranty status or coverage is the main subject and no more specific service or repair
        request is central.


        Customer Problem


        Describe what is happening to the customer in short, simple, factual business language.
        State the customer’s need, issue, or request without adding assumptions.


        Examples:


        - The customer's Dura 35 pump is leaking again.

        - The customer's shipment has not arrived.

        - The customer needs a pump for a hydrochloric acid application.


        Do not describe internal routing, departments, roles, or decisions about who should perform
        the work.


        Company Action Item(s)


        Identify every distinct action the customer expects the company to perform. Use only these
        controlled values:


        - create_quote

        - revise_quote

        - select_pump

        - provide_product_information

        - check_order_status

        - check_delivery_status

        - expedite_delivery

        - diagnose_problem

        - schedule_service_visit

        - check_warranty

        - investigate_invoice

        - send_invoice_copy

        - identify_spare_part

        - register_complaint

        - manual_review


        A message may contain multiple action items. List each applicable action once. Do not create
        new action names or determine which department should perform an action.


        Use these distinctions when they apply:


        - Use create_quote for a new quotation or RFQ, including when pump selection is also
        requested.

        - Use revise_quote when the customer asks to change or update an existing quotation.

        - Use select_pump when the customer needs help choosing a pump for an application.

        - Use provide_product_information for a request for product details without a clear request
        to select a pump.

        - Use check_order_status for the status of an order.

        - Use check_delivery_status for the status or expected arrival of a shipment or delivery.

        - Use expedite_delivery when the customer asks the company to speed up or prioritize a
        delivery.

        - Use diagnose_problem when the customer asks what may be wrong with a product or system.

        - Use schedule_service_visit when the customer asks for someone to inspect, repair, or visit
        the site.

        - Use check_warranty when the customer asks whether a product or problem is covered by
        warranty.

        - Use investigate_invoice for a disputed, incorrect, or unclear invoice.

        - Use send_invoice_copy when the customer asks for a copy of an invoice.

        - Use identify_spare_part when the customer needs help identifying a spare or replacement
        part.

        - Use register_complaint when the customer is making a complaint and expects it to be
        formally recorded.

        - Use manual_review when the requested work cannot be mapped to any other controlled action.


        If the customer asks for work that cannot be mapped to one of these actions, use
        manual_review rather than inventing an action.


        Examples:


        Customer:

        "Our pump is leaking. Can you check the warranty and send someone to inspect it?"


        Company Action Items:

        - check_warranty

        - schedule_service_visit


        Customer:

        "We need a pump for hydrochloric acid and would like a quotation."


        Company Action Items:

        - select_pump

        - create_quote


        References


        Extract useful business references and technical specifications explicitly provided by the
        customer. References may later be used for CRM, ERP, product, service, or other database
        lookups.


        Include only references actually found in the customer enquiry. Do not guess, infer
        unsupported values, calculate engineering values, or add missing technical specifications.


        Business references may include:


        - customer_name

        - company_name

        - contact_name

        - product_name

        - pump_model

        - product_family

        - serial_number

        - order_number

        - purchase_order_number

        - quotation_number

        - invoice_number

        - shipment_number

        - service_case_number

        - contract_number

        - site_or_location

        - quantity


        Technical specifications must also be included in references when explicitly provided.
        Relevant fields include:


        - fluid

        - chemical

        - flow_rate

        - pressure

        - temperature

        - viscosity

        - density

        - required_head

        - suction_pressure

        - discharge_pressure

        - differential_pressure

        - solids_content

        - particle_size

        - pipe_size

        - connection_size

        - connection_type

        - motor_power

        - motor_speed

        - voltage

        - frequency

        - pump_speed

        - required_capacity

        - operating_hours

        - duty_cycle

        - material_requirement

        - seal_requirement

        - hose_requirement

        - impeller_requirement

        - hazardous_area_requirement

        - atex_requirement

        - installation_type

        - indoor_or_outdoor

        - existing_pump_model

        - existing_pump_manufacturer

        - existing_pump_performance


        You may use a descriptive technical field name when the customer provides an important
        technical specification that does not exactly match these examples. Preserve the customer’s
        stated value and units where available. If a value is described as approximate, current,
        expected, required, or normal, reflect that distinction in the field name or value rather
        than presenting it as a different fact.


        Example 1 — New Pump RFQ


        Customer Message:

        Please quote four pumps suitable for hydrochloric acid at 60°C.

        We need approximately 20 m3/h at 5 bar.


        Output:

        {
          "category": "new_pump_quote_or_rfq",
          "customer_problem": "The customer needs four pumps for a hydrochloric acid application.",
          "company_action_items": [
            "select_pump",
            "create_quote"
          ],
          "references": {
            "quantity": 4,
            "technical_specifications": {
              "fluid": "hydrochloric acid",
              "temperature": "60°C",
              "flow_rate": "20 m3/h",
              "pressure": "5 bar"
            }
          }
        }


        Example 2 — Delivery Enquiry


        Customer Message:

        PO 45882 still hasn't arrived.

        Can you tell me when it will be delivered?


        Output:

        {
          "category": "delivery_or_shipment_enquiry",
          "customer_problem": "The customer's delivery has not arrived.",
          "company_action_items": [
            "check_delivery_status"
          ],
          "references": {
            "purchase_order_number": "45882"
          }
        }


        Example 3 — Technical Support


        Customer Message:

        Our Dura 35, serial D35-8821, is only producing 12 m3/h.

        It normally operates at around 20 m3/h and 4 bar.

        The fluid is sodium hydroxide at approximately 50°C.

        Can you check what may be wrong?


        Output:

        {
          "category": "technical_support",
          "customer_problem": "The customer's Dura 35 pump is producing significantly less flow than expected.",
          "company_action_items": [
            "diagnose_problem"
          ],
          "references": {
            "pump_model": "Dura 35",
            "serial_number": "D35-8821",
            "technical_specifications": {
              "fluid": "sodium hydroxide",
              "temperature": "50°C",
              "current_flow_rate": "12 m3/h",
              "expected_flow_rate": "20 m3/h",
              "pressure": "4 bar"
            }
          }
        }


        Example 4 — Warranty + Service


        Customer Message:

        Our Dura 35 pump, serial D35-8821, is leaking again.

        Can you check whether it is under warranty and arrange someone to inspect it?


        Output:

        {
          "category": "service_or_repair_request",
          "customer_problem": "The customer's Dura 35 pump is leaking again.",
          "company_action_items": [
            "check_warranty",
            "schedule_service_visit"
          ],
          "references": {
            "pump_model": "Dura 35",
            "serial_number": "D35-8821"
          }
        }


