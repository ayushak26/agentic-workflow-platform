      separator: |+


        ---

  - id: generate_work_responsibilities
    type: TransformAgent
    config:
      mode: ai
      model: claude-sonnet-4-5
      prompt_template: null
      system_prompt: null
      input_fields:
        - name: input_1
          description: ''
          type: string
          value: '{{outputs.understanding_message.parsed.customer_problem}}'
        - name: input_2
          description: ''
          type: string
          value: '{{outputs.understanding_message.parsed.company_action_items}}'
        - name: input_3
          description: ''
          type: string
          value: '{{outputs.understanding_message.parsed.category}}'
        - name: input_4
          description: ''
          type: string
          value: '{{outputs.business_context.text}}'
      instructions: >-
        You are the Responsibility Resolver for an industrial B2B customer-enquiry workflow.


        Your task is to determine which specialized business responsibilities are required to handle
        a customer enquiry.


        You receive two sources of information:


        CUSTOMER CONTEXT

        category

        customer_problem

        company_action_items

        BUSINESS CONTEXT

        customer state

        quotation state

        order state

        shipment state

        service-case state

        existing ownership


        Your job is ONLY to select one or more responsibilities from the controlled responsibility
        catalogue.


        Do not select:


        department

        role

        employee

        team

        final owner


        These are determined downstream.


        Core decision principle


        Determine responsibility from:


        what the customer wants

        +

        what already exists in the business


        Company action items identify the work that needs to happen.


        Business context determines whether that work is:


        new;

        already in progress;

        associated with an existing record;

        missing a required business record;

        or should continue with an existing process.

        Important rules

        Existing service case


        If:


        service_case.found = true

        AND

        service_case.status = open


        and the customer asks for technical help related to that issue:


        Prefer:


        continue_existing_technical_case


        instead of:


        technical_diagnosis


        when the work is already represented by the existing case.


        For a requested service visit with an existing open case, prefer:


        field_service_coordination


        For a new request with no service case, use:


        new_field_service_request

        Existing quotation


        If the customer requests:


        revise_quote


        and an existing quotation is found and still editable/open:


        Use:


        quotation_revision


        If the quotation cannot be found:


        Use:


        quotation_identification


        If the quotation is already accepted/confirmed and the customer requests a commercial
        change:


        Use:


        commercial_change_review

        New quotation


        If:


        create_quote


        and the customer already exists:


        Use:


        quotation_management


        If the customer does not exist:


        Use:


        new_customer_rfq_handling


        or, when customer creation is independently required:


        customer_identification_or_creation

        Pump selection


        For:


        select_pump


        use:


        pump_application_selection


        If the enquiry is specifically a replacement pump:


        replacement_pump_selection


        If quotation work is also requested, return the additional quotation responsibility.


        Example:


        select_pump

        +

        create_quote


        may return:


        pump_application_selection

        quotation_management

        Orders


        For:


        check_order_status


        and an order exists:


        order_status_information


        If the order cannot be found:


        order_identification


        For a new order:


        sales_order_processing


        If customer creation/intake is required first:


        customer_creation_and_order_intake

        Delivery and shipment


        For:


        check_delivery_status


        if an actual shipment exists:


        shipment_tracking


        If the order exists but no shipment exists yet:


        delivery_schedule_information


        If the customer asks to accelerate delivery:


        delivery_escalation


        For a shipment-related problem:


        delivery_issue_investigation


        For a fulfilment/production delay before shipment:


        fulfilment_delay_investigation

        Technical support


        For:


        diagnose_problem


        with no relevant open service case:


        technical_diagnosis


        With an existing relevant open case:


        continue_existing_technical_case

        Spare parts


        For:


        identify_spare_part


        use:


        spare_part_identification

        Warranty


        For:


        check_warranty


        with no existing case:


        warranty_verification


        If there is an existing service case related to the issue:


        warranty_case_review

        Invoice


        For:


        investigate_invoice


        use:


        billing_investigation


        For:


        send_invoice_copy


        use:


        invoice_document_support

        Complaint


        For:


        register_complaint


        use:


        complaint_management


        Do not change the responsibility merely because the customer is a key account.


        Key-account status may affect downstream ownership or notification, not the fundamental work
        being performed.


        Quality


        For a product-quality issue use:


        product_quality_investigation

        Return


        For a return request use:


        return_authorization

        Commercial terms


        For contract or commercial-term questions use:


        commercial_terms_management

        Customer data


        For customer-account or master-data work use:


        customer_master_data_management

        Unknown work


        If the enquiry cannot be mapped safely to a controlled responsibility:


        manual_customer_enquiry_triage


        Never invent a new responsibility.


        5. Multiple Responsibilities


        A customer enquiry may legitimately require several responsibilities.


        Example:


        category: new_pump_quote_or_rfq


        company_action_items:
          - select_pump
          - create_quote

        Output:


        {
          "responsibilities": [
            "pump_application_selection",
            "quotation_management"
          ],
          "reasoning_summary": "The customer needs both technical pump selection and a commercial quotation."
        }


        Do not artificially force a multi-action enquiry into one responsibility.


        6. Example: Existing Technical Case


        Input:


        customer_context:
          category: technical_support

          customer_problem:
            Dura 25 pump is producing substantially less flow than expected.

          company_action_items:
            - diagnose_problem

        business_context:
          customer:
            found: true
            customer_id: ACC-1043
            customer_type: existing
            key_account: true
            account_owner: Markus Weber

          quotation:
            found: false
            status: null

          order:
            found: true
            status: fulfilled
            confirmed_date: 2024-09-18

          shipment:
            found: true
            status: delivered

          service_case:
            found: true
            status: open
            current_owner: Peter Janssen

        Output:


        {
          "responsibilities": [
            "continue_existing_technical_case"
          ],
          "reasoning_summary": "The customer requires technical diagnosis and a relevant open service case already exists, so the existing technical case should be continued."
        }

        7. Example: New Technical Problem


        Input:


        customer_context:
          category: technical_support

          customer_problem:
            Customer reports abnormal pump vibration.

          company_action_items:
            - diagnose_problem

        business_context:
          customer:
            found: true

          quotation:
            found: false
            status: null

          order:
            found: true
            status: fulfilled
            confirmed_date: 2025-04-20

          shipment:
            found: true
            status: delivered

          service_case:
            found: false
            status: null
            current_owner: null

        Output:


        {
          "responsibilities": [
            "technical_diagnosis"
          ],
          "reasoning_summary": "The customer requires technical diagnosis and there is no existing service case for the issue."
        }

        8. Example: Delivery Question


        Input:


        customer_context:
          category: delivery_or_shipment_enquiry

          customer_problem:
            Customer wants to know when the order will arrive.

          company_action_items:
            - check_delivery_status

        business_context:
          customer:
            found: true

          quotation:
            found: true
            status: accepted

          order:
            found: true
            status: confirmed
            confirmed_date: 2026-08-10

          shipment:
            found: false
            status: null

          service_case:
            found: false
            status: null
            current_owner: null

        Output:


        {
          "responsibilities": [
            "delivery_schedule_information"
          ],
          "reasoning_summary": "The order exists but has not yet produced a shipment, so the required work is to provide delivery scheduling information."
        }

        9. Example: Shipment Tracking


        Input:


        customer_context:
          category: delivery_or_shipment_enquiry

          customer_problem:
            Customer wants the current location of the dispatched order.

          company_action_items:
            - check_delivery_status

        business_context:
          order:
            found: true
            status: dispatched

          shipment:
            found: true
            status: in_transit

        Output:


        {
          "responsibilities": [
            "shipment_tracking"
          ],
          "reasoning_summary": "A shipment already exists and is in transit, so the required work is shipment tracking."
        }

        10. Example: Pump Selection + Quote


        Input:


        customer_context:
          category: new_pump_quote_or_rfq

          customer_problem:
            Customer needs a suitable pump and quotation for a new application.

          company_action_items:
            - select_pump
            - create_quote

        business_context:
          customer:
            found: true
            customer_type: existing

          quotation:
            found: false

        Output:


        {
          "responsibilities": [
            "pump_application_selection",
            "quotation_management"
          ],
          "reasoning_summary": "The enquiry requires both technical pump selection and creation of a new quotation for an existing customer."
        }
      output_fields:
        - name: responsibilities
          type: list
          description: >-
            Select every controlled specialized responsibility required to handle the customer's
            requested work. Base the selection on the category, company action items, and available
            business context. Do not select departments, roles, or employees.
          required: true
          nullable: false
          enum_values: []
          fields: []
          item_type: enum
          item_enum_values:
            - new_customer_rfq_handling
            - quotation_management
            - quotation_revision
            - quotation_identification
            - commercial_change_review
            - pump_application_selection
            - technical_product_information
            - sales_order_processing
            - customer_creation_and_order_intake
            - order_status_information
            - order_identification
            - delivery_schedule_information
            - shipment_tracking
            - delivery_escalation
            - delivery_issue_investigation
            - fulfilment_delay_investigation
            - technical_diagnosis
            - continue_existing_technical_case
            - new_field_service_request
            - field_service_coordination
            - spare_part_identification
            - replacement_pump_selection
            - replacement_quotation
            - warranty_verification
            - warranty_case_review
            - billing_investigation
            - invoice_document_support
            - payment_and_credit_management
            - product_quality_investigation
            - return_authorization
            - complaint_management
            - commercial_terms_management
            - customer_master_data_management
            - general_customer_support
            - customer_identification_or_creation
            - business_record_identification
            - manual_customer_enquiry_triage
            - reasoning_summary
          minimum: null
          maximum: null
        - name: reasoning_summary
          type: text
          description: >-
            Briefly explain which customer request and business facts caused the selected
            responsibilities. Use factual business language, do not mention chain-of-thought,
            probabilities, or internal model reasoning, and explain all selected responsibilities
            when multiple responsibilities apply.
          required: true
          nullable: false
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
      language: null
      temperature: 0.2
      max_tokens: 16384
      max_retries: 1
      fail_on_error: true
      operations: []
      omit_empty: false
    selected_model: auto
    model_routing:
      accuracy_priority: maximum
      prefer_low_latency: false
  - id: responsibilities_to_department_role
    type: DecisionAgent
    config:
      rules:
        - name: Rule 1
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: new_customer_rfq_handling
          then:
            - field: Department
              operation: merge
              value: Sales
            - field: Role
              operation: merge
              value: Inside Sales
        - name: ''
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: quotation_management
          then:
            - field: Department
              operation: merge
              value: Sales
            - field: Role
              operation: merge
              value: Inside Sales
        - name: Rule 3
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: pump_application_selection
          then:
            - field: Department
              operation: merge
              value: Sales Engineering
            - field: Role
              operation: merge
              value: Application Engineer
        - name: Rule 4
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: order_status_information
          then:
            - field: Department
              operation: merge
              value: Customer Service
            - field: Role
              operation: merge
              value: Customer Support Executive
        - name: Rule 5
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: shipment_tracking
          then:
            - field: Department
              operation: merge
              value: Supply Chain
            - field: Role
              operation: merge
              value: Logistics Coordinator
        - name: Rule 6
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: technical_diagnosis
          then:
            - field: Department
              operation: merge
              value: Service
            - field: Role
              operation: merge
              value: Technical Support Engineer
        - name: Rule 7
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: billing_investigation
          then:
            - field: Department
              operation: merge
              value: Finance
            - field: Role
              operation: merge
              value: Accounts Receivable Specialist
        - name: Rule 8
          description: ''
          when:
            operator: and
            conditions:
              - field: outputs.generate_work_responsibilities.parsed.responsibilities
                operator: contains
                value: spare_part_identification
          then:
            - field: Department
              operation: set
              value: Spare Parts and Product Service
            - field: Role
              operation: set
              value: Spare Parts Specialist
      declared_fields: []
