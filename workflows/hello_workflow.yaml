name: "Hello Workflow"
description: "Phase 4 smoke test — no LLMs, no retrieval, just the runtime."
version: "1.0"

inputs:
  who:
    type: text

nodes:
  - id: first
    type: Literal
    config:
      value: "world"

  - id: second
    type: Echo
    config:
      template: "Hello, {{first.value}}!"

edges:
  - from: first
    to: second