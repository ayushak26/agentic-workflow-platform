name: Hello Workflow
description: Generic runtime smoke test with no LLM or external service.
version: "1.0"
use_case: generic

inputs:
  who:
    type: text

nodes:
  - id: first
    type: Literal
    config:
      value: world

  - id: second
    type: Echo
    config:
      template: Hello, {{first.value}}!

edges:
  - from: first
    to: second