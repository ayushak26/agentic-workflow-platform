name: Multilingual Customer Request Triage
description: >-
  Understands an incoming customer communication in any language, extracts a structured business
  representation of it, decides deterministically whether it can be handled automatically, and
  routes it to the right department — with unclear or low-confidence cases going to a person.

  Every step here is one of the platform's generic primitives, configured. There is no node type in
  this workflow that is specific to customer triage, to a language, to a department, or to an
  industry: the schema, the intent labels, the escalation rules, the confidence threshold and the
  routing table are all configuration, so the next business process needs configuration too, not
  Python.

  Read the graph top to bottom and it is the business process:

      Incoming Request
              ↓
      Understand Customer Request        (AI: one call detects the language,
              ↓                           classifies, and extracts)
      Check Automation Safety            (deterministic: escalation rules)
              ↓
      Route Customer Request             (deterministic: intent → department)
        ┌─────┬────────┬─────────┬──────────────┐
      Sales  Support  Service  Customer Service  Human Review
version: '1.0'
use_case: customer_request_triage
library:
  title: Multilingual Customer Request Triage
  summary: >-
    Route incoming customer communications to the right department, in any language, escalating
    uncertain cases to a person.
  purpose:
    - Understand customer requests written in any language
    - Turn them into a structured, auditable business object
    - Route them deterministically, with an explainable reason
    - Escalate low-confidence, incomplete and sensitive cases to a person
  suitable_for:
    - Shared inbox triage for industrial / B2B customer communication
    - Requests that mix commercial and technical content
  not_suitable_for:
    - Sending replies without review (add a Human Review before any send)
  outputs:
    - Structured request representation
    - Chosen department and the reason for it
    - Escalation flags with the rule that set them
  input_types:
    - Customer email or message text
  human_reviews:
    count: 1
    labels:
      - Review uncertain requests
  visibility_status: draft
inputs:
  subject:
    type: text
    description: Subject line of the incoming communication.
    required: false
  message:
    type: text
    description: Full body of the incoming customer communication, in its original language. May mix languages.
    required: true
  customer_email:
    type: text
    description: Sender address, when known.
    required: false
entry: incoming_request
exit:
  - sales
  - technical_support
  - spare_parts
  - customer_service
  - human_review
output:
  include_input: false
  nodes:
    - node_id: understand_request
      flatten: false
    - node_id: automation_safety
      flatten: false
    - node_id: route_request
      flatten: false
nodes:
  - id: incoming_request
    type: WorkflowInputAgent
    config:
      source: email
      fields:
        - name: subject
          source: inputs.subject
          type: string
          description: Subject line as received.
        - name: message
          source: inputs.message
          type: text
          required: true
          description: Original message body, untranslated.
        - name: customer_email
          source: inputs.customer_email
          type: string
          description: Sender address.
    experience:
      display_name: Incoming Request
      purpose: Receive the customer communication and give it a known shape.
      contribution: Everything downstream reads the request from here.
      expected_output: The subject, message body and sender address.
      failure_message: No message text arrived. Paste a customer message and run again.
  - id: understand_request
    type: AITaskAgent
    config:
      task: extract
      model: auto
      fail_on_error: false
      instruction: >-
        Understand the incoming customer communication and extract the information described by the
        output schema.

        Extract only information that is explicitly stated or unambiguously implied. Never invent a
        value: if the customer did not state something, return null for it and name it in
        missing_information.

        A message can ask for more than one thing at once — for example urgent technical help AND a
        quotation. List every distinct request in request_types; never collapse several asks into
        one. Order request_types with what the customer cares about most first.

        Set production_stopped to true only when the customer states that production, a plant, a
        line or a process is currently stopped or down — not merely that something is faulty or
        slow.

        Judge urgency from stated business impact, not from tone or politeness. A polite "when you
        get a chance" is not evidence of low urgency any more than "urgent!!" is evidence of high
        urgency — judge only from what is actually at stake.

        Separate two different kinds of gap. blocking_missing_information is what a colleague could
        not proceed without at all (e.g. no product identified for a spare-part request).
        missing_information is the fuller list, including details that would help but are not
        strictly blocking (e.g. a serial number). Every blocking item must also appear in
        missing_information.

        ambiguities is for phrases that require interpretation rather than information that is
        simply absent — for example a vague timeframe, an unclear "another one of what we had before"
        reference, or wording that could support two different readings. Do not use it to restate
        missing information.

        suggested_actions are your recommendations for what should happen next, in business
        language. They are advisory only — the workflow's own rules decide what actually happens, so
        never assume a suggested action will be carried out.
      input: '{{outputs.incoming_request.data.message}}'
      context:
        Subject: '{{outputs.incoming_request.data.subject}}'
      language:
        input_language: auto
        process_in_original_language: true
        output_language: en
        preserve_original: true
      include_confidence: true
      output_fields:
        - name: language
          type: string
          required: true
          description: >-
            ISO 639-1 code of the language the customer wrote in (de, fr, nl, en, es …). Use the
            dominant language if several are mixed.
        - name: request_types
          type: list
          item_type: enum
          item_enum_values:
            - quotation_request
            - technical_support
            - spare_part_request
            - complaint
            - order_status
            - general_inquiry
            - other
          required: true
          description: >-
            Every distinct thing the customer wants from us, most important first. At least one
            value is required. Include every request the message actually contains — do not pick
            only one when several are present.
        - name: request_summary
          type: text
          required: true
          description: 'Two sentences in English: what the customer wants and why it matters to them.'
        - name: requestor
          type: object
          required: false
          description: The person writing, as far as the message states.
          fields:
            - name: name
              type: string
              required: false
              nullable: true
            - name: email
              type: string
              required: false
              nullable: true
            - name: phone
              type: string
              required: false
              nullable: true
        - name: organization
          type: string
          required: false
          nullable: true
          description: Company name as written in the message.
        - name: product
          type: string
          required: false
          nullable: true
          description: Product family or type as stated (e.g. "peristaltic pump"), not the exact model.
        - name: product_model
          type: string
          required: false
          nullable: true
          description: >-
            Model designation exactly as written (e.g. "Dura 15"). Never normalise or translate it.
        - name: serial_number
          type: string
          required: false
          nullable: true
        - name: quantity
          type: integer
          required: false
          nullable: true
          description: Number of units the request concerns, when stated.
        - name: medium
          type: string
          required: false
          nullable: true
          description: The substance being handled, when the customer states it (e.g. "sulfuric acid").
        - name: flow_rate
          type: string
          required: false
          nullable: true
          description: Flow rate exactly as written, including its unit (e.g. "18 m³/h").
        - name: production_stopped
          type: boolean
          required: true
          description: True only if the customer states that production or a process is currently stopped.
        - name: urgency
          type: enum
          required: true
          description: Business urgency implied by the stated impact.
          enum_values:
            - low
            - normal
            - high
            - critical
        - name: requested_action
          type: text
          required: true
          description: In one sentence, what the customer is asking us to do.
        - name: missing_information
          type: list
          item_type: string
          required: true
          description: >-
            Machine-readable names of information a colleague would still need before acting — for
            example product_model, serial_number, flow_rate, quantity, delivery_address. Includes
            every blocking_missing_information item plus anything else that would help. Empty list
            if nothing is missing.
        - name: blocking_missing_information
          type: list
          item_type: string
          required: true
          description: >-
            The subset of missing_information without which this request cannot be handled with any
            confidence at all — not merely details that would help. Empty list if nothing blocks.
        - name: ambiguities
          type: list
          item_type: string
          required: true
          description: >-
            Phrases or references that require interpretation rather than missing information — for
            example a vague timeframe or an unclear reference to a past order. Empty list if the
            message is unambiguous.
        - name: suggested_actions
          type: list
          item_type: string
          required: true
          description: >-
            Your advisory recommendations for what should happen next, in business language (e.g.
            "Create an urgent technical support case", "Start a quotation for two replacement
            pumps"). The workflow's own rules decide the actual routing — these are suggestions, not
            commitments.
    selected_model: auto
    model_routing:
      accuracy_priority: balanced
    experience:
      display_name: Understand Customer Request
      purpose: >-
        Read the message in its original language and produce a structured business representation
        of what the customer wants — including every request it contains, not just one.
      contribution: The business rules and the router act on these fields, never on the raw text.
      expected_output: >-
        Language, request types, requestor and product details, urgency signals, missing
        information split into blocking versus non-blocking, ambiguities, and a confidence score.
      success_condition: A schema-valid result with a confidence score.
      failure_message: The request could not be understood well enough to act on. It will be sent to a person.
  - id: automation_safety
    type: DecisionAgent
    config:
      defaults:
        human_review: false
        clarification_required: false
        urgency: normal
        escalation_reason: ''
        automation_allowed: true
        primary_intent: general_inquiry
      rules:
        - name: The AI step could not produce a usable result
          description: >-
            A refusal, an invalid response or a provider failure must reach a person, not be treated
            as "nothing to escalate".
          when:
            operator: or
            conditions:
              - field: outputs.understand_request.status
                operator: not_equals
                value: ok
              - field: outputs.understand_request.result.request_types
                operator: does_not_exist
          then:
            - field: human_review
              value: true
            - field: automation_allowed
              value: false
            - field: escalation_reason
              value: The request could not be understood automatically.
        - name: Low confidence needs a person
          description: Below 0.80 we do not act on the extraction automatically.
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.confidence
                operator: less_than
                value: 0.8
          then:
            - field: human_review
              value: true
            - field: automation_allowed
              value: false
            - field: escalation_reason
              value: The extraction confidence was below the 0.80 threshold for automatic handling.
        # ---- primary_intent: deterministic pick from request_types, lowest to
        # highest business priority so a later, higher-priority match overwrites
        # an earlier one. Every request_types value the customer sent stays
        # visible on the extraction itself — this only picks which one drives
        # routing when several apply at once (§9: represent all of them, but a
        # single-branch router still needs one to act on first).
        - name: Order status drives routing when present
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: order_status
          then:
            - field: primary_intent
              value: order_status
        - name: A quotation request drives routing when present
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: quotation_request
          then:
            - field: primary_intent
              value: quotation_request
        - name: General inquiry drives routing when present
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: general_inquiry
          then:
            - field: primary_intent
              value: general_inquiry
        - name: A spare part request drives routing when present
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: spare_part_request
          then:
            - field: primary_intent
              value: spare_part_request
        - name: A technical support need drives routing when present
          description: >-
            Technical problems outrank a quotation asked in the same message — the customer's
            production issue is the more urgent of the two asks.
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: technical_support
          then:
            - field: primary_intent
              value: technical_support
        - name: A complaint always drives routing when present
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.request_types
                operator: contains
                value: complaint
          then:
            - field: primary_intent
              value: complaint
        - name: Complaints are always handled by a person
          when:
            operator: and
            conditions:
              - field: decisions.primary_intent
                operator: equals
                value: complaint
          then:
            - field: human_review
              value: true
            - field: escalation_reason
              value: Complaints are reviewed by a person before any reply.
        - name: Stopped production is critical
          description: Urgency comes from stated business impact, not from how the message is phrased.
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.production_stopped
                operator: is_true
          then:
            - field: urgency
              value: critical
        - name: High urgency for a strategic account is critical
          description: 'Demonstrates nested logic: an OR of a direct signal and an AND of two weaker ones.'
          when:
            operator: or
            conditions:
              - field: outputs.understand_request.result.urgency
                operator: equals
                value: critical
              - operator: and
                conditions:
                  - field: outputs.understand_request.result.urgency
                    operator: equals
                    value: high
                  - field: outputs.understand_request.result.serial_number
                    operator: is_not_empty
          then:
            - field: urgency
              value: critical
        - name: A spare part request without a model cannot be quoted
          when:
            operator: and
            conditions:
              - field: decisions.primary_intent
                operator: equals
                value: spare_part_request
              - field: outputs.understand_request.result.blocking_missing_information
                operator: contains
                value: product_model
          then:
            - field: clarification_required
              value: true
            - field: human_review
              value: true
            - field: escalation_reason
              value: A spare part cannot be identified without the product model.
        - name: High-impact ambiguity needs a person
          description: >-
            An ambiguous reference that would change what we do (e.g. which product, which order) is
            exactly the case that must never be resolved by a guess. Runs last so its reason is the
            one shown when it co-occurs with a more specific rule above — the ambiguity is the more
            important thing for a reviewer to know about first.
          when:
            operator: and
            conditions:
              - field: outputs.understand_request.result.ambiguities
                operator: is_not_empty
              - field: outputs.understand_request.result.blocking_missing_information
                operator: is_not_empty
          then:
            - field: human_review
              value: true
            - field: escalation_reason
              value: The request is both ambiguous and missing information needed to act.
    experience:
      display_name: Check Automation Safety
      purpose: Decide whether this request can safely be handled automatically.
      contribution: The router uses these conclusions to send uncertain work to a person.
      expected_output: Whether a human must look at it, the effective urgency, the primary intent to route on, and why.
      failure_message: The safety rules could not be evaluated.
  - id: route_request
    type: RouterAgent
    config:
      mode: conditions
      cases:
        - route: human_review
          description: The safety rules require a person to look at this.
          when:
            operator: or
            conditions:
              - field: outputs.automation_safety.decisions.human_review
                operator: is_true
              - field: outputs.automation_safety.decisions.automation_allowed
                operator: is_false
        - route: sales
          description: Commercial requests go to Sales.
          when:
            operator: and
            conditions:
              - field: outputs.automation_safety.decisions.primary_intent
                operator: in
                value:
                  - quotation_request
                  - order_status
        - route: technical_support
          description: Technical problems go to Support.
          when:
            operator: and
            conditions:
              - field: outputs.automation_safety.decisions.primary_intent
                operator: equals
                value: technical_support
        - route: spare_parts
          description: Parts requests go to Service.
          when:
            operator: and
            conditions:
              - field: outputs.automation_safety.decisions.primary_intent
                operator: equals
                value: spare_part_request
        - route: customer_service
          description: Complaints go to Customer Service.
          when:
            operator: and
            conditions:
              - field: outputs.automation_safety.decisions.primary_intent
                operator: equals
                value: complaint
      fallback: human_review
    experience:
      display_name: Route Customer Request
      purpose: >-
        Send the request to the department that handles it — or to a person when the safety rules
        said it cannot be handled automatically.
      contribution: The receiving department gets a structured request.
      expected_output: One branch, with the conditions that chose it recorded.
      failure_message: The request could not be routed.
  - id: sales
    type: DataTransformAgent
    config:
      operations:
        - target: department
          operation: constant
          value: Sales
        - target: title
          operation: format
          value: >-
            [{{outputs.automation_safety.decisions.urgency}}]
            {{outputs.understand_request.result.requested_action}}
        - target: company
          operation: coalesce
          sources:
            - outputs.understand_request.result.organization
            - outputs.incoming_request.data.customer_email
          default: unknown
        - target: contact_email
          operation: coalesce
          sources:
            - outputs.understand_request.result.requestor.email
            - outputs.incoming_request.data.customer_email
          default: unknown
        - target: quantity
          operation: copy
          source: outputs.understand_request.result.quantity
          default: not stated
        - target: detected_intents
          operation: copy
          source: outputs.understand_request.result.request_types
        - target: summary
          operation: copy
          source: outputs.understand_request.result.request_summary
        - target: needs_clarification
          operation: boolean
          source: outputs.automation_safety.decisions.clarification_required
        - target: original_language
          operation: copy
          source: outputs.understand_request.result.language
    experience:
      display_name: Sales
      purpose: Hand a structured commercial request to Sales.
      contribution: Sales receives a request they can act on without re-reading the email.
      expected_output: A commercial hand-off packet.
      failure_message: The Sales hand-off could not be built.
  - id: technical_support
    type: DataTransformAgent
    config:
      operations:
        - target: department
          operation: constant
          value: Technical Support
        - target: title
          operation: format
          value: >-
            [{{outputs.automation_safety.decisions.urgency}}]
            {{outputs.understand_request.result.product_model}} —
            {{outputs.understand_request.result.requested_action}}
        - target: model
          operation: copy
          source: outputs.understand_request.result.product_model
          default: not stated
        - target: serial_number
          operation: copy
          source: outputs.understand_request.result.serial_number
          default: not stated
        - target: production_stopped
          operation: boolean
          source: outputs.understand_request.result.production_stopped
        - target: urgency
          operation: copy
          source: outputs.automation_safety.decisions.urgency
        - target: detected_intents
          operation: copy
          source: outputs.understand_request.result.request_types
        - target: summary
          operation: copy
          source: outputs.understand_request.result.request_summary
        - target: missing_information
          operation: copy
          source: outputs.understand_request.result.missing_information
        - target: blocking_missing_information
          operation: copy
          source: outputs.understand_request.result.blocking_missing_information
    experience:
      display_name: Technical Support
      purpose: Hand a structured technical case to Support.
      contribution: Support sees the equipment and impact without re-reading the email.
      expected_output: A technical case packet.
      failure_message: The Support hand-off could not be built.
  - id: spare_parts
    type: DataTransformAgent
    config:
      operations:
        - target: department
          operation: constant
          value: Service / Spare Parts
        - target: model
          operation: copy
          source: outputs.understand_request.result.product_model
          default: not stated
        - target: serial_number
          operation: copy
          source: outputs.understand_request.result.serial_number
          default: not stated
        - target: quantity
          operation: copy
          source: outputs.understand_request.result.quantity
          default: not stated
        - target: clarification_required
          operation: boolean
          source: outputs.automation_safety.decisions.clarification_required
        - target: missing_information
          operation: copy
          source: outputs.understand_request.result.missing_information
        - target: blocking_missing_information
          operation: copy
          source: outputs.understand_request.result.blocking_missing_information
        - target: summary
          operation: copy
          source: outputs.understand_request.result.request_summary
    experience:
      display_name: Service and Spare Parts
      purpose: Hand a structured parts request to Service.
      contribution: Service can identify the part or ask one precise question.
      expected_output: A spare-parts hand-off packet.
      failure_message: The Service hand-off could not be built.
  - id: customer_service
    type: DataTransformAgent
    config:
      operations:
        - target: department
          operation: constant
          value: Customer Service
        - target: summary
          operation: copy
          source: outputs.understand_request.result.request_summary
        - target: original_message
          operation: copy
          source: outputs.incoming_request.data.message
        - target: escalation_reason
          operation: copy
          source: outputs.automation_safety.decisions.escalation_reason
    experience:
      display_name: Customer Service
      purpose: Hand a complaint to Customer Service with its context.
      contribution: A person handles the complaint with the facts already gathered.
      expected_output: A complaint hand-off packet.
      failure_message: The Customer Service hand-off could not be built.
  - id: human_review
    type: HumanInLoopAgent
    config:
      question: >-
        This request could not be handled automatically. Check the extracted information and decide
        how to proceed.
      review_purpose: >-
        Either the AI step was not confident enough, the request is a complaint, or the intent has
        no automatic route. Approve to accept the extraction as it stands, edit it to correct what
        the AI got wrong, or reject to stop the workflow.
      allowed_actions:
        - approve
        - edit
        - reject
      context_fields:
        - outputs.incoming_request.data.message
        - outputs.understand_request.result
        - outputs.automation_safety.decisions
      editable_content_field: outputs.understand_request.result
      review_panels:
        - label: Original communication
          field: outputs.incoming_request.data.message
          hint: Exactly as the customer wrote it, untranslated.
        - label: Extracted information
          field: outputs.understand_request.result
          hint: What the AI understood. Correct anything wrong before approving.
          editable: true
        - label: Confidence
          field: outputs.understand_request.confidence
          hint: Below 0.80 the workflow does not act automatically.
        - label: Missing information
          field: outputs.understand_request.result.missing_information
          hint: What a colleague would still need to act on this. Blocking items are listed separately below.
        - label: Blocking information
          field: outputs.understand_request.result.blocking_missing_information
          hint: Without these, this request cannot be handled with any confidence.
        - label: Ambiguities
          field: outputs.understand_request.result.ambiguities
          hint: Phrases that need interpretation rather than information that is simply missing.
        - label: Suggested actions
          field: outputs.understand_request.result.suggested_actions
          hint: The AI's advisory recommendation. It does not decide the route — you do.
        - label: Detected requests
          field: outputs.understand_request.result.request_types
          hint: Every distinct thing the customer asked for, most important first.
        - label: Suggested route
          field: outputs.automation_safety.decisions.primary_intent
          hint: Where this would have gone if it had been handled automatically.
        - label: Reason for escalation
          field: outputs.automation_safety.decisions.escalation_reason
          hint: Which rule sent this request to you.
    experience:
      display_name: Human Review
      purpose: A person decides what happens with requests we are unsure about.
      contribution: Nothing uncertain is handled automatically.
      expected_output: An approval, an edit, or a rejection with a reason.
      failure_message: The review could not be presented.
edges:
  - from: incoming_request
    to: understand_request
  - from: understand_request
    to: automation_safety
  - from: automation_safety
    to: route_request
  - from: route_request
    condition: route
    branches:
      sales: sales
      technical_support: technical_support
      spare_parts: spare_parts
      customer_service: customer_service
      human_review: human_review
