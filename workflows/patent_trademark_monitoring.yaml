name: Patent & Trademark Monitoring
description: >-
  IMPORTANT LIMITATION: this workflow does NOT integrate with any official
  patent or trademark registry (no USPTO, EUIPO, WIPO, or similar API is
  called anywhere in this pipeline). There is no dedicated registry node in
  this platform. Instead, this workflow approximates registry monitoring by
  running a generic public web search (WebSearchAgent) for the given
  industry keywords and treating the resulting web pages as unverified
  candidate filings. Do not use this workflow as a substitute for a real
  registry search, legal clearance check, or freedom-to-operate opinion —
  it is a lightweight early-warning scan only, and every result should be
  independently verified against the actual USPTO/EUIPO/WIPO registries
  before any business or legal decision is made. Pipeline: (1) web-search
  the public web for filings mentioning the supplied industry keywords, (2)
  use an LLM transform to filter the raw search hits down to the categories
  actually relevant to the business, (3) use a second LLM transform to map
  the surviving relevant filings onto the supplied internal product tracks.
version: "1.0"
use_case: ip_monitoring

inputs:
  keywords:
    type: text
    description: >-
      Industry keywords to watch for in public patent/trademark filing
      announcements and news (e.g. "solid-state battery separator,
      wireless power transfer, biodegradable packaging film").
    required: true
  product_tracks:
    type: text
    description: >-
      The internal product tracks to map matching filings against (e.g.
      "Battery Systems, Wireless Charging, Sustainable Packaging"). Used
      only to align relevant filings to internal roadmaps, not as a search
      filter.
    required: true

nodes:
  - id: registry_search
    type: WebSearchAgent
    config:
      query: >-
        new patent or trademark filing announcement {{inputs.keywords}}
      provider: auto
      top_k: 10
      fallback_to_openai: true

  - id: relevance_filter
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      system_prompt: >-
        You are an IP-monitoring analyst. You are given raw public web
        search results that are only unverified candidates, NOT confirmed
        registry filings. Filter out results that are clearly irrelevant
        (wrong industry, unrelated litigation news, generic marketing
        pages, duplicate domains) and keep only the candidates plausibly
        describing a real patent or trademark filing relevant to the
        watched keywords.
      prompt_template: >-
        Watched industry keywords: {{inputs.keywords}}


        Raw search results (JSON array, each item has title, url, snippet,
        score, status):

        {{registry_search.results}}


        Review each result and decide whether it plausibly describes a
        patent or trademark filing relevant to the watched keywords, as
        opposed to unrelated news, marketing, or noise. Return only the
        relevant candidates, each annotated with the category of filing
        you infer (e.g. "patent", "trademark", "unclear") and a one-line
        reason it was kept. Every filing is unverified against the
        original registry.
      output_schema:
        relevant_filings: list
        excluded_count: int
        notes: str
      temperature: 0.1
      max_tokens: 4096
      max_retries: 1

  - id: product_track_mapper
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      system_prompt: >-
        You are an IP-monitoring analyst mapping candidate patent/trademark
        filings, sourced from generic public web search and unverified
        against any official registry, to a company's internal product
        tracks so the right product team can review them.
      prompt_template: >-
        Internal product tracks: {{inputs.product_tracks}}


        Relevant filing candidates (already filtered for relevance, still
        unverified against the original registry):

        {{relevance_filter.parsed.relevant_filings}}


        Filter notes from the previous step: {{relevance_filter.parsed.notes}}


        For each filing candidate, map it to the single internal product
        track it most plausibly affects, or "unmapped" if none of the
        supplied product tracks apply. Return the mapped list along with a
        short rationale per mapping, and flag every item as unverified
        against the source registry.
      output_schema:
        mapped_filings: list
        unmapped_count: int
        summary: str
      temperature: 0.1
      max_tokens: 4096
      max_retries: 1

edges:
  - from: registry_search
    to: relevance_filter
  - from: relevance_filter
    to: product_track_mapper

entry: registry_search
exit: product_track_mapper

output:
  include_input: false
  nodes:
    - node_id: registry_search
      flatten: true
    - node_id: relevance_filter
      flatten: true
    - node_id: product_track_mapper
      flatten: true
