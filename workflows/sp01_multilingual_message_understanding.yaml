name: SP01 — Multilingual Message Understanding
description: >-
  Reusable subprocess. Detects language, translates to English, and extracts the core business facts
  from a customer message — each fact tagged KNOWN / INFERRED / MISSING / AMBIGUOUS / CONFLICTING
  rather than guessed. Called via SubprocessAgent from Workflow 01 (Intelligent Customer Inquiry
  Resolution), Workflow 03 (Technical Service Case), and Workflow 04 (Order Status and Delivery
  Exception Management).
version: '1.0'
use_case: shared_subprocess
library:
  title: SP01 — Multilingual Message Understanding
  summary: Detect language, translate, and extract facts with explicit certainty status.
  purpose:
    - Never let the model invent a missing business fact
    - Give every extracted field an auditable KNOWN/INFERRED/MISSING/AMBIGUOUS/CONFLICTING status
  suitable_for:
    - Called as a SubprocessAgent step from any workflow reading a free-text customer message
  not_suitable_for:
    - Direct end-user invocation — this has no Start node, it's a subprocess
  outputs:
    - Detected language, an English translation, and six status-tagged facts
  input_types:
    - A customer message and optional subject line
  human_reviews:
    count: 0
    labels: []
  visibility_status: draft
inputs:
  message:
    type: text
    required: true
    description: The customer's message, in its original language.
  subject:
    type: text
    required: false
    description: Customer Enquiry
entry: extract
exit:
  - end_understanding
nodes:
  - id: extract
    type: TransformAgent
    config:
      mode: ai
      model: claude-sonnet-4-5
      temperature: 0
      input_fields:
        - name: subject
          type: string
          value: '{{inputs.subject}}'
          description: Customer Enquiry
        - name: message
          type: string
          value: '{{inputs.message}}'
      instructions: >-
        Read both the subject and message, regardless of the language used. Treat information stated
        in either field as part of the source content.


        Translate the message into English when it is written wholly or partly in another language.
        Set detected_language to the primary source language, using a language name or ISO language
        code. If the source is already in English, set translated_message to null; otherwise provide
        the English translation when it can be produced. Do not add information that is absent from
        the source.


        Set source_file to the source file name or path if one is provided. No source file is
        provided to this step, so leave source_file empty rather than inventing a value. Set
        processed_at to the current processing timestamp in ISO 8601 datetime format.


        Populate extraction with the customer or company name, product or equipment, quantity,
        delivery details, purchase order details, and other stated requirements. Include
        company_name as the customer or company when it is stated. For each of these six
        facts—company_name, order_reference, issue, requested_action, serial_number, and
        urgency—record the value together with a status and, where relevant, brief evidence:

        - KNOWN means the customer stated the fact plainly.

        - INFERRED means the fact is implied but not stated outright; include the evidence
        supporting the inference.

        - MISSING means the message does not address the fact.

        - AMBIGUOUS means the message could reasonably mean more than one thing; describe the
        alternatives if useful.

        Never invent a value that the message does not support. Use MISSING or AMBIGUOUS rather than
        guessing. Do not use CONFLICTING; that status is reserved for a later check against business
        records.


        Set order_reference to the primary order identifier stated in the source, such as an order
        number or purchase order reference. If several identifiers appear, use the one most clearly
        presented as the order identifier and retain other purchase order details in extraction. If
        no supported identifier exists, leave order_reference empty.


        Set issue to the main issue or topic requiring attention:

        - Use order_issue for a problem with the order itself.

        - Use delivery_issue for shipping, delivery timing, or receipt problems.

        - Use product_issue for a product or equipment problem.

        - Use pricing_issue for a price, cost, or pricing dispute.

        - Use documentation_issue for missing, incorrect, or requested documents.

        - Use no_issue when the message is a routine request or enquiry without a problem requiring
        investigation.

        - Use other when the topic requiring attention does not fit these categories.

        When more than one issue is mentioned, choose the issue most directly requiring attention.
        Prefer a specific issue category over other; do not label a routine request as an issue
        merely because an action is requested.


        Set requested_action to the sender’s primary requested action:

        - process_order when the sender asks the business to place, enter, or process an order;

        - confirm_receipt when the sender primarily asks for acknowledgement or confirmation that
        something was received;

        - provide_lead_time when the sender asks when a product or order can be supplied or
        delivered;

        - investigate_issue when the sender asks the business to examine or resolve a problem;

        - provide_quote when the sender asks for a quotation or pricing proposal;

        - other when the requested action does not fit these choices.

        If multiple actions are requested, select the action stated as the main request or required
        next step. Do not use process_order merely because an order is mentioned, and do not use
        confirm_receipt when the sender is asking for the order to be processed.


        Set serial_number to the equipment or product serial number exactly as stated. If none is
        stated, leave it empty. Do not substitute an order number, product code, or model number for
        a serial number.


        Set urgency based on urgency explicitly indicated in the source:

        - low, normal, high, or urgent when the wording clearly matches that level;

        - other when an explicit urgency is given but does not fit those values.

        Do not infer urgency from an issue type, deadline, wording, or business impact alone. If
        urgency is not addressed, mark it MISSING in the extraction details and leave the urgency
        value empty or use the appropriate unset representation.


        Populate order_processing with whether human intervention is needed and why. Mark
        intervention as needed when the message explicitly requests human handling or describes an
        unclear, exceptional, or problematic order that cannot be handled as a straightforward
        order-processing request. Otherwise mark it as not needed when the source clearly supports
        routine processing. If the message does not provide enough information to decide, state that
        the decision is unclear and explain why rather than guessing.


        Populate routing with whether the request should be routed to the sales team and why. Mark
        sales routing as needed when the message explicitly seeks a quotation, pricing or commercial
        information, or other sales assistance. Do not route to sales solely because a product or
        order is mentioned. If the source does not indicate a sales need, mark routing as not
        needed; if the evidence is insufficient, state that clearly and give the reason.


        Keep the top-level values consistent with the corresponding details in extraction. Use only
        facts stated or strongly supported by the subject and message, and leave values empty or use
        the closest permitted catch-all when the source does not support a more specific value.
      output_fields:
        - name: source_file
          type: string
          description: Record the name or path of the source file being processed.
          required: true
          nullable: false
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: processed_at
          type: string
          description: Record the processing timestamp in ISO 8601 datetime format.
          required: true
          nullable: false
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: detected_language
          type: string
          description: >-
            Identify the primary language of the source content using a language name or ISO
            language code.
          required: true
          nullable: true
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: translated_message
          type: text
          description: >-
            Provide the translated message when translation is needed or available; otherwise return
            null.
          required: true
          nullable: true
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: extraction
          type: object
          description: >-
            Capture the customer, product, quantity, delivery, purchase order, and requirement
            details extracted from the source.
          required: true
          nullable: false
          enum_values: []
          fields:
            - name: customer_name
              type: string
              description: Record the full name of the person placing or requesting the order when stated.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: company_name
              type: string
              description: Record the legal or trading name of the customer company.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: product_reference
              type: list
              description: >-
                List each product name, model, part number, or other product reference included in
                the order.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: string
              item_enum_values: []
              minimum: null
              maximum: null
            - name: quantity
              type: integer
              description: Record the ordered quantity as an integer, excluding units of measure.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: requested_delivery_date
              type: date
              description: Record the requested delivery date in YYYY-MM-DD format.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: delivery_address
              type: string
              description: Record the complete delivery address exactly as provided.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: po_reference
              type: string
              description: Record the purchase order reference or purchase order number.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: special_requirements
              type: text
              description: >-
                Record any special requirements, instructions, conditions, or requested
                confirmations associated with the order.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: order_reference
          type: string
          description: >-
            Record the primary order identifier found in the source, including an order number or
            purchase order reference.
          required: true
          nullable: true
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: issue
          type: enum
          description: >-
            Classify the main issue or topic requiring attention; select other when it does not fit
            the listed categories.
          required: true
          nullable: true
          enum_values:
            - order_issue
            - delivery_issue
            - product_issue
            - pricing_issue
            - documentation_issue
            - no_issue
            - other
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: requested_action
          type: enum
          description: >-
            Identify the primary action requested by the sender; select other when it does not fit
            the listed actions.
          required: true
          nullable: true
          enum_values:
            - process_order
            - confirm_receipt
            - provide_lead_time
            - investigate_issue
            - provide_quote
            - other
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: serial_number
          type: string
          description: Record the equipment or product serial number when stated.
          required: true
          nullable: true
          enum_values: []
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: urgency
          type: enum
          description: >-
            Classify the urgency explicitly indicated in the source; select other for an explicitly
            stated urgency that does not fit the listed values.
          required: true
          nullable: true
          enum_values:
            - low
            - normal
            - high
            - urgent
            - other
          fields: []
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: order_processing
          type: object
          description: Record whether the order needs human intervention and why.
          required: true
          nullable: false
          enum_values: []
          fields:
            - name: human_review_required
              type: boolean
              description: >-
                Set to true when the order cannot be safely processed automatically or requires
                human validation; otherwise set to false.
              required: true
              nullable: false
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: review_reason
              type: string
              description: >-
                Explain why human review is required; return null when no human review is required
                or no reason is stated.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
        - name: routing
          type: object
          description: >-
            Record whether the request should be routed to the sales team and the reason for that
            routing.
          required: true
          nullable: false
          enum_values: []
          fields:
            - name: sales_team_flag
              type: boolean
              description: >-
                Set to true when the request requires sales-team handling or follow-up; otherwise
                set to false.
              required: true
              nullable: false
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
            - name: sales_team_reason
              type: string
              description: >-
                Explain why the request should be routed to the sales team; return null when sales
                routing is not required or no reason is stated.
              required: true
              nullable: true
              enum_values: []
              fields: []
              item_type: null
              item_enum_values: []
              minimum: null
              maximum: null
          item_type: null
          item_enum_values: []
          minimum: null
          maximum: null
    experience:
      display_name: Understand Message
      purpose: Read the message in its own language and extract the facts it actually contains.
      contribution: Every downstream rule reads a status-tagged fact, never a raw guess.
      expected_output: Detected language, an English translation, and six status-tagged facts.
      failure_message: The message could not be read well enough to extract anything from.
  - id: end_understanding
    type: EndAgent
    config:
      mode: workflow_result
      outputs:
        - key: detected_language
          value_from: '{{outputs.extract.parsed.detected_language}}'
        - key: translated_message
          value_from: '{{outputs.extract.parsed.translated_message}}'
        - key: company_name
          value_from: '{{outputs.extract.parsed.extraction.company_name}}'
        - key: order_reference
          value_from: '{{outputs.extract.parsed.order_reference}}'
        - key: issue
          value_from: '{{outputs.extract.parsed.issue}}'
        - key: requested_action
          value_from: '{{outputs.extract.parsed.requested_action}}'
        - key: serial_number
          value_from: '{{outputs.extract.parsed.serial_number}}'
        - key: urgency
          value_from: '{{outputs.extract.parsed.urgency}}'
    experience:
      display_name: Understanding Result
      purpose: Return the extracted, status-tagged understanding to the calling workflow.
      contribution: A clean, typed result — never the whole accumulated state.
      expected_output: Language, translation, and six status-tagged facts.
      failure_message: The result could not be produced.
edges:
  - from: extract
    to: end_understanding
