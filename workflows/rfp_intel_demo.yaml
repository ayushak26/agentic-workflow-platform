name: RFP Intel Demo
description: Phase 5 demo — Transform extracts industry, Router branches, HITL confirms.
version: '1.0'
inputs:
  rfp_text:
    type: text
nodes:
  - id: rfp_intel
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: |-
        Extract the industry and top 3 requirements from this RFP:
        {{inputs.rfp_text}}
      output_schema:
        industry: str
        requirements: list
  - id: industry_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: finance
          condition: rfp_intel.parsed.industry == 'finance'
        - name: other
          default: true
  - id: handle_other
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: >-
        Summarize the requirements for industry {{rfp_intel.parsed.industry}}:
        {{rfp_intel.parsed.requirements}}
      temperature: 0.7
  - id: router_1
    type: RouterAgent
    config:
      mode: rule
      rules: []
      model: null
      prompt: null
      context: null
  - id: transform_1
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: ''
      system_prompt: null
      temperature: 0.2
      max_retries: 1
edges:
  - from: rfp_intel
    to: industry_router
  - from: industry_router
    to: router_1
  - from: router_1
    to: handle_other
