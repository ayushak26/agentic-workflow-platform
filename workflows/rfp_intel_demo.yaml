name: RFP Intel Demo
description: Phase 5 demo — Transform extracts industry, Router branches, HITL confirms.
version: '1.0'
inputs:
  rfp_text:
    type: text
nodes:
  - id: rfp_intel
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: |-
        Extract the industry and top 3 requirements from this RFP:
        {{inputs.rfp_text}}
      output_schema:
        industry: str
        requirements: list
  - id: industry_router
    type: RouterAgent
    config:
      mode: rule
      rules:
        - name: finance
          condition: rfp_intel.parsed.industry == 'finance'
        - name: other
          default: true
  - id: handle_finance
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: 'Summarize these finance-sector requirements: {{rfp_intel.parsed.requirements}}'
  - id: handle_other
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: >-
        Summarize the requirements for industry {{rfp_intel.parsed.industry}}:
        {{rfp_intel.parsed.requirements}}
  - id: confirm
    type: HumanInLoopAgent
    config:
      question: Review the summary — approve to finish, or reject.
      context_fields:
        - handle_finance.raw
        - handle_other.raw
      allowed_actions:
        - approve
        - reject
edges:
  - from: rfp_intel
    to: industry_router
  - from: industry_router
    condition: route
    branches:
      finance: handle_finance
      other: handle_other
  - from: handle_finance
    to: confirm
  - from: handle_other
    to: confirm