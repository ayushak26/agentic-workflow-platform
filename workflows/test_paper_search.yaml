name: "Paper Search MCP — Integration Test"
use_case: eu_proposal
description: >
  End-to-end smoke test of candidate discovery, lawful full-text download,
  exact page-level claim verification, contradiction search, and citation
  integrity gates. Search metadata is never linked to a claim.
version: "2.0"

inputs:
  # A short, concept-note-style text the seeder turns into a couple of claims.
  # For a bare smoke test you can pass one sentence; the seeder extracts claims.
  topic_text:
    type: text

nodes:

  # Seed the graph with claims. Reuses GraphNormalizer: it extracts Claim
  # objects (among others) from any source text. For a pure test, topic_text
  # can be 2-3 sentences of state-of-the-art assertions.
  - id: seed_claims
    type: GraphNormalizer
    config:
      model: claude-sonnet-4-5

  # Discovery only. Candidate records cannot change claim verification.
  - id: gather_evidence
    type: ScholarlyCandidateDiscoveryAgent
    config:
      mcp_server: "paper-search-mcp"
      tool: "search_papers"
      sources: ["arxiv", "openalex", "europepmc", "crossref"]
      max_results_per_source: 2
      max_candidates_per_claim: 6
      claim_types: ["state_of_art", "problem", "impact", "method"]
      model: claude-sonnet-4-5
      require_contradiction_search: true

  - id: acquire_full_text
    type: FullTextEvidenceAcquirer
    config:
      candidates: "{{gather_evidence.candidates}}"
      fail_when_none_acquired: false

  - id: verify_evidence
    type: ProposalEvidenceFactoryAgent
    config:
      model: claude-sonnet-4-5
      candidates: "{{gather_evidence.candidates}}"
      documents: "{{acquire_full_text.documents}}"
      search_audit: "{{gather_evidence.search_audit}}"
      rejected_candidates: "{{acquire_full_text.rejected_candidates}}"

  # Human-readable dump of what discovery produced, so you can verify the DOIs,
  # identifiers and citations are real (not model-invented).
  - id: show_evidence
    type: TransformAgent
    config:
      model: claude-sonnet-4-5
      prompt_template: |
        Summarise the evidence discovery result as a plain table for a human
        reviewer. For each claim, list the claim text and the sources found
        (identifier + citation + authority). Flag any claim that found zero
        sources. Do not add papers or facts — only report what is in the inputs.

        NORMALIZER REPORT: {{seed_claims.report}}
        CANDIDATE DISCOVERY: {{gather_evidence.report}}
        FULL TEXT:           {{acquire_full_text.report}}
        VERIFIED EVIDENCE:   {{verify_evidence.report}}
        QA REPORT:           {{verify_evidence.qa_report}}
        BLOCKING ISSUES:     {{verify_evidence.blocking_issues}}

        SCIENTIFIC SYNTHESIS:
        {{scientific_synthesis.answer}}

  # Apply reviewed K-Dense research methodology to the real MCP evidence.
  # Skill files guide the LLM but cannot execute scripts or bypass platform
  # tools, evidence checks, RBAC, audit, or human review.
  - id: scientific_synthesis
    type: ScientificSkillAgent
    config:
      model: claude-sonnet-4-5
      skills:
        - literature-review
        - scientific-critical-thinking
      auto_select: false
      objective: |
        Critically synthesize only the evidence records below. Group findings
        by theme, identify evidence limitations and missing support, and list
        which claims remain unsafe to use in a proposal. Do not add papers,
        measurements, or conclusions that are absent from the records.

        VERIFIED EVIDENCE REPORT:
        {{verify_evidence.report}}

        CLAIM-EVIDENCE LINKS:
        {{verify_evidence.claim_evidence_links}}

edges:
  - from: seed_claims
    to: gather_evidence
  - from: gather_evidence
    to: acquire_full_text
  - from: acquire_full_text
    to: verify_evidence
  - from: verify_evidence
    to: scientific_synthesis
  - from: scientific_synthesis
    to: show_evidence
