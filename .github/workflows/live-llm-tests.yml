name: Live LLM Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider test to run (uses paid API calls)
        required: true
        default: openai
        type: choice
        options:
          - openai
          - anthropic
          - both

permissions:
  contents: read

concurrency:
  group: live-llm-tests
  cancel-in-progress: false

jobs:
  openai-smoke:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.provider == 'openai' || inputs.provider == 'both')
    environment: live-llm-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: live-test-secret-key-never-use-in-production
      DEV_BYPASS_ENABLED: "false"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend without dependency cache
        run: python -m pip install -e ".[dev]"

      - name: Run the controlled OpenAI integration test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/live_provider_smoke.py --provider openai

  anthropic-smoke:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.provider == 'anthropic' || inputs.provider == 'both')
    environment: live-llm-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend without dependency cache
        run: python -m pip install -e ".[dev]"

      - name: Run the controlled Anthropic smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/live_provider_smoke.py --provider anthropic
