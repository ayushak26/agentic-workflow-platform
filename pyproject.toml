[project]
name = "agentic-workflow-platform"
version = "0.1.0"
description = "Agentic workflow platform — Optimoz proposal mini-build"
requires-python = ">=3.11"
dependencies = [
  # Phase 1 — web framework, config, observability
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  # Phase 2 — document ingestion
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "markdown-it-py>=3.0",
  "tiktoken>=0.7",
  # Phase 2 — storage clients
  "boto3>=1.34",
  "motor>=3.5",
  "weaviate-client>=4.9",
  # Phase 2 — LLM/embedding API
  "openai>=1.50",
  # Phase 2 — resilience
  "tenacity>=8.5",
  # Phase 4 — orchestration
  "langgraph>=0.2.50",
  "pyyaml>=6.0.2",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"