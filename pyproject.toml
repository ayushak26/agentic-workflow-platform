[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflow-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "motor>=3.4.0",
    "pymongo>=4.7.0",
    "redis>=5.0.4",
    "minio>=7.2.7",
    "weaviate-client>=4.6.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "pyyaml>=6.0.1",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.4",
    "python-pptx>=0.6.23",
    "weasyprint>=62.0",
    "jinja2>=3.1.4",
    "tiktoken>=0.7.0",
    "prometheus-client>=0.20.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
test = "pytest tests/ -v"